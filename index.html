<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:#0a0e1a;display:flex;justify-content:center;padding:12px}
        .app{max-width:400px;width:100%}
        
        .header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
        .user{color:#fff;font-size:16px;font-weight:600}
        .avatar{width:35px;height:35px;border-radius:50%;background:gold;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:700;overflow:hidden}
        .avatar img{width:100%;height:100%;object-fit:cover}
        
        .balance{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
        .balance span{color:#fff;font-size:24px;font-weight:700}
        .btn{padding:6px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer}
        .btn-gold{background:gold;color:#000}
        .btn-out{background:transparent;border:1px solid rgba(255,255,255,.15);color:#fff}
        
        .menu-title{color:#aec0ff;font-size:14px;font-weight:600;margin:12px 0 8px}
        .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        .menu-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 4px;text-align:center;color:#aec0ff;font-size:12px;cursor:pointer}
        .menu-item .icon{font-size:20px;display:block;margin-bottom:4px}
        .menu-item:active{transform:scale(.95)}
        
        .page{display:none}
        .page.active{display:block}
        
        .dice-page{display:none;padding:10px 0}
        .dice-page.active{display:block}
        .back{color:#4a8af4;cursor:pointer;font-size:14px;margin-bottom:8px;display:inline-block}
        .title{color:#fff;font-size:22px;font-weight:700;text-align:center;margin:8px 0}
        .timer{text-align:center;font-size:16px;color:#4ade80;padding:8px;background:rgba(74,222,128,.08);border-radius:8px;margin:6px 0}
        .timer span{font-size:20px;color:#f7e05e}
        .dice-box{display:flex;justify-content:center;gap:16px;margin:12px 0}
        .dice{width:60px;height:60px;background:linear-gradient(135deg,#1a2a5a,#2a4a8a);border:2px solid rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
        .dice.rolling{animation:roll 1s ease-in-out}
        @keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(360deg)}100%{transform:rotate(720deg)}}
        .result{text-align:center;color:#f7e05e;font-size:18px;font-weight:700;min-height:28px}
        .bet-options{display:flex;gap:8px;margin:8px 0}
        .bet-opt{flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
        .bet-opt.active{border-color:#f7e05e;background:rgba(255,215,0,.08);color:#f7e05e}
        .bet-opt:disabled{opacity:.4;cursor:not-allowed}
        .input-group{display:flex;gap:6px;margin:8px 0}
        .input-group input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
        .input-group input:disabled{opacity:.4}
        .input-group button{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;font-size:12px}
        .input-group button:disabled{opacity:.4}
        .place-btn{width:100%;padding:10px;border-radius:10px;border:none;background:gold;color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
        .place-btn:disabled{opacity:.4;cursor:not-allowed}
        .bets-list{background:rgba(255,255,255,.02);border-radius:8px;padding:8px;max-height:120px;overflow-y:auto;margin-top:6px}
        .bet-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02);color:#aec0ff;font-size:12px}
        .bet-item .win{color:#4ade80}
        .bet-item .lose{color:#ff6b6b}
        .bet-item .pending{color:#f7e05e}
        
        .nav{display:flex;justify-content:space-around;padding:12px 0;margin-top:10px;border-top:1px solid rgba(255,255,255,.05)}
        .nav-item{color:#6f8f9f;font-size:11px;cursor:pointer;text-align:center}
        .nav-item .icon{font-size:20px;display:block}
        .nav-item.active{color:#f7e05e}
        .nav-center{width:55px;height:55px;border-radius:50%;background:linear-gradient(135deg,#4a8af4,#2a5a9a);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-top:-20px;cursor:pointer;box-shadow:0 4px 20px rgba(74,138,244,.3)}
        .nav-center:active{transform:scale(.92)}
        .nav-center.active{background:gold;color:#000}
        
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100}
        .modal.active{display:flex}
        .modal-box{background:#141b33;border-radius:20px;padding:24px;max-width:340px;width:100%}
        .modal-title{color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:12px}
        .modal-input{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:15px;text-align:center;outline:none}
        .modal-btns{display:flex;gap:10px;margin-top:12px}
        .modal-btns button{flex:1;padding:9px;border:none;border-radius:10px;font-weight:600;cursor:pointer}
        .modal-btn-primary{background:#4a8af4;color:#fff}
        .modal-btn-secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.08)}
        
        .result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:200}
        .result-modal.active{display:flex}
        .result-box{text-align:center}
        .result-icon{font-size:56px;margin-bottom:10px}
        .result-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
        .result-title.win{color:#4ade80}
        .result-title.lose{color:#ff6b6b}
        .result-amount{color:#f7e05e;font-size:15px;margin-bottom:14px}
        .result-btn{padding:10px 30px;border:none;border-radius:30px;background:gold;color:#000;font-weight:700;font-size:14px;cursor:pointer}
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="user" id="userName">hamster</div>
        <div class="avatar" id="userAvatar">🐹</div>
    </div>

    <!-- BALANCE -->
    <div class="balance">
        <div>
            <div style="color:#8a9bb5;font-size:12px">BetCoin</div>
            <span id="balanceDisplay">0</span>
        </div>
        <div style="display:flex;gap:6px">
            <button class="btn btn-gold" id="getBtn">+ Получить</button>
            <button class="btn btn-out" id="buyBtn">Купить</button>
        </div>
    </div>

    <!-- HOME -->
    <div class="page active" id="pageHome">
        <div class="menu-title">Управление</div>
        <div class="menu-grid">
            <div class="menu-item" onclick="alert('Профиль')"><span class="icon">👤</span>Профиль</div>
            <div class="menu-item" onclick="alert('Инвентарь')"><span class="icon">📦</span>Инвентарь</div>
            <div class="menu-item" onclick="alert('Сервис')"><span class="icon">⚙️</span>Сервис</div>
            <div class="menu-item" onclick="openPromo()"><span class="icon">🎁</span>Промо</div>
        </div>
    </div>

    <!-- DICE -->
    <div class="dice-page" id="dicePage">
        <div class="back" onclick="closeDice()">← Назад</div>
        <div class="title">🎲 Dice</div>
        
        <div class="timer" id="timerDisplay">⏳ Раунд: <span id="timerCount">12</span>s</div>
        
        <div class="dice-box">
            <div class="dice" id="dice1">⚀</div>
            <div class="dice" id="dice2">⚀</div>
        </div>
        <div class="result" id="diceResult">Результат: ?</div>
        
        <div class="bet-options">
            <button class="bet-opt active" data-bet="under" onclick="setBet('under')">⟨ 7</button>
            <button class="bet-opt" data-bet="over" onclick="setBet('over')">7 ⟩</button>
        </div>
        
        <div class="input-group">
            <input id="betInput" type="number" value="100" min="1" />
            <button onclick="document.getElementById('betInput').value=Math.floor(balance/2)">1/2</button>
            <button onclick="document.getElementById('betInput').value=balance">Max</button>
        </div>
        
        <button class="place-btn" id="placeBtn" onclick="placeBet()">🎲 Сделать ставку</button>
        
        <div style="color:#8a9bb5;font-size:12px;margin-top:8px">Ставки игроков</div>
        <div class="bets-list" id="betsList">
            <div class="bet-item"><span>Нет ставок</span><span></span></div>
        </div>
    </div>

    <!-- NAV -->
    <div class="nav">
        <div class="nav-item active" onclick="goHome()">
            <span class="icon">🏠</span>Главная
        </div>
        <div class="nav-center" id="gameBtn" onclick="openDice()">🎲</div>
        <div class="nav-item" onclick="alert('Настройки')">
            <span class="icon">⚙️</span>Настройки
        </div>
    </div>

    <!-- PROMO -->
    <div class="modal" id="promoModal">
        <div class="modal-box">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" />
            <div class="modal-btns">
                <button class="modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn-primary" onclick="applyPromo()">Активировать</button>
            </div>
        </div>
    </div>

    <!-- RESULT -->
    <div class="result-modal" id="resultModal">
        <div class="result-box">
            <div class="result-icon" id="resIcon">🎉</div>
            <div class="result-title" id="resTitle">Вы выиграли!</div>
            <div class="result-amount" id="resAmount">+0 BetCoin</div>
            <button class="result-btn" onclick="closeResult()">Продолжить</button>
        </div>
    </div>

</div>

<script>
// ===== TELEGRAM =====
let tgUser = null;
try {
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        tgUser = tg.initDataUnsafe.user;
    }
} catch(e) {}
if (!tgUser) tgUser = { id: 'demo', first_name: 'Тест' };

const userId = tgUser.id.toString();
let balance = 0;
let betType = 'under';
let timerInterval = null;
let seconds = 12;
let isRolling = false;

// ===== SUPABASE =====
const SB_URL = 'https://dlprylagddsmtzpmzxqy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';

// ===== DOM =====
const userName = document.getElementById('userName');
const userAvatar = document.getElementById('userAvatar');
const balanceDisplay = document.getElementById('balanceDisplay');

function updateUI() {
    balanceDisplay.textContent = balance.toLocaleString();
    const name = tgUser.first_name || 'Игрок';
    userName.textContent = name;
    userAvatar.textContent = name.charAt(0).toUpperCase();
}

// ===== LOAD USER =====
async function loadUser() {
    try {
        const res = await fetch(`${SB_URL}/rest/v1/users?id=eq.${userId}&select=*`, {
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
        });
        const data = await res.json();
        if (data.length === 0) {
            await fetch(`${SB_URL}/rest/v1/users`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: userId, name: tgUser.first_name || 'Игрок', balance: 5000 })
            });
            balance = 5000;
        } else {
            balance = data[0].balance || 0;
        }
        updateUI();
    } catch(e) { balance = 5000; updateUI(); }
}

async function saveBalance(val) {
    try {
        await fetch(`${SB_URL}/rest/v1/users?id=eq.${userId}`, {
            method: 'PATCH',
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ balance: val })
        });
        balance = val;
        updateUI();
    } catch(e) {}
}

// ===== NAV =====
function goHome() {
    document.getElementById('dicePage').classList.remove('active');
    document.getElementById('pageHome').classList.add('active');
    document.getElementById('gameBtn').classList.remove('active');
    document.querySelector('.nav-item').classList.add('active');
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function openDice() {
    document.getElementById('pageHome').classList.remove('active');
    document.getElementById('dicePage').classList.add('active');
    document.getElementById('gameBtn').classList.add('active');
    document.querySelector('.nav-item').classList.remove('active');
    loadBets();
    if (!timerInterval) startTimer();
}

function closeDice() { goHome(); }

// ===== BET =====
function setBet(type) {
    betType = type;
    document.querySelectorAll('.bet-opt').forEach(b => b.classList.remove('active'));
    document.querySelector(`.bet-opt[data-bet="${type}"]`).classList.add('active');
}

// ===== TIMER =====
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    seconds = 12;
    isRolling = false;
    document.getElementById('placeBtn').disabled = false;
    document.getElementById('timerCount').textContent = seconds;
    
    timerInterval = setInterval(() => {
        seconds--;
        document.getElementById('timerCount').textContent = seconds;
        if (seconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            rollDice();
        }
    }, 1000);
}

// ===== ROLL DICE =====
async function rollDice() {
    if (isRolling) return;
    isRolling = true;
    document.getElementById('placeBtn').disabled = true;
    document.getElementById('timerDisplay').innerHTML = '🎲 Бросок...';
    
    const d1 = Math.floor(Math.random() * 6) + 1;
    const d2 = Math.floor(Math.random() * 6) + 1;
    const result = d1 + d2;
    const dots = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    
    const dice1 = document.getElementById('dice1');
    const dice2 = document.getElementById('dice2');
    dice1.textContent = dots[d1-1];
    dice2.textContent = dots[d2-1];
    dice1.classList.add('rolling');
    dice2.classList.add('rolling');
    
    setTimeout(() => {
        dice1.classList.remove('rolling');
        dice2.classList.remove('rolling');
    }, 800);
    
    document.getElementById('diceResult').textContent = `Результат: ${result} (${d1}+${d2})`;
    
    await processBets(result);
    await loadBets();
    
    setTimeout(() => {
        isRolling = false;
        document.getElementById('timerDisplay').innerHTML = '⏳ Раунд: <span id="timerCount">12</span>s';
        startTimer();
    }, 1000);
}

// ===== PROCESS BETS =====
async function processBets(result) {
    try {
        const res = await fetch(`${SB_URL}/rest/v1/bets?game=eq.Dice&result=eq.pending&order=created_at.asc&limit=50`, {
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
        });
        const bets = await res.json();
        
        for (const bet of bets) {
            const win = (bet.detail === 'under') ? result < 7 : result > 7;
            const winAmount = win ? bet.amount * 2 : 0;
            
            await fetch(`${SB_URL}/rest/v1/bets?id=eq.${bet.id}`, {
                method: 'PATCH',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    result: win ? 'win' : 'lose',
                    win_amount: winAmount,
                    coefficient: 2
                })
            });
            
            if (win) {
                const uRes = await fetch(`${SB_URL}/rest/v1/users?id=eq.${bet.user_id}&select=balance`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const uData = await uRes.json();
                if (uData.length > 0) {
                    const newBal = uData[0].balance - bet.amount + winAmount;
                    await fetch(`${SB_URL}/rest/v1/users?id=eq.${bet.user_id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ balance: newBal })
                    });
                    if (bet.user_id === userId) {
                        balance = newBal;
                        updateUI();
                    }
                }
            }
        }
    } catch(e) { console.error(e); }
}

// ===== PLACE BET =====
async function placeBet() {
    if (isRolling) { alert('⏳ Раунд идет!'); return; }
    if (seconds < 3) { alert('⏳ Раунд скоро закончится!'); return; }
    
    const amount = parseInt(document.getElementById('betInput').value);
    if (!amount || amount <= 0) { alert('❌ Введите сумму!'); return; }
    if (amount > balance) { alert('❌ Недостаточно средств!'); return; }
    
    await saveBalance(balance - amount);
    
    try {
        await fetch(`${SB_URL}/rest/v1/bets`, {
            method: 'POST',
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: userId,
                user_name: tgUser.first_name || 'Игрок',
                amount: amount,
                game: 'Dice',
                result: 'pending',
                win_amount: 0,
                coefficient: 0,
                detail: betType
            })
        });
        loadBets();
        alert('✅ Ставка принята!');
    } catch(e) {
        await saveBalance(balance + amount);
        alert('❌ Ошибка!');
    }
}

// ===== LOAD BETS =====
async function loadBets() {
    try {
        const res = await fetch(`${SB_URL}/rest/v1/bets?game=eq.Dice&order=created_at.desc&limit=15`, {
            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
        });
        const bets = await res.json();
        const container = document.getElementById('betsList');
        if (!bets || bets.length === 0) {
            container.innerHTML = '<div class="bet-item"><span>Нет ставок</span><span></span></div>';
            return;
        }
        container.innerHTML = bets.map(b => {
            let status = '', cls = '';
            if (b.result === 'win') { status = '+' + b.win_amount + ' (x2)'; cls = 'win'; }
            else if (b.result === 'lose') { status = '-' + b.amount; cls = 'lose'; }
            else { status = '⏳ Ожидание'; cls = 'pending'; }
            const detail = b.detail === 'under' ? '⟨7' : b.detail === 'over' ? '7⟩' : '';
            return `<div class="bet-item">
                <span>${b.user_name || 'Игрок'} • ${b.amount} ${detail}</span>
                <span class="${cls}">${status}</span>
            </div>`;
        }).join('');
    } catch(e) { console.error(e); }
}

// ===== BUTTONS =====
document.getElementById('getBtn').onclick = function() { saveBalance(balance + 500); alert('✅ +500 BetCoin!'); };
document.getElementById('buyBtn').onclick = function() {
    const amount = prompt('💰 Сумма:', '1000');
    if (amount) { const c = parseInt(amount); if (c > 0) { saveBalance(balance + c); alert('✅ +' + c + ' BetCoin!'); } }
};

// ===== PROMO =====
function openPromo() { document.getElementById('promoModal').classList.add('active'); }
function closePromo() { document.getElementById('promoModal').classList.remove('active'); }
function applyPromo() {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    if (!code) { alert('❌ Введите код!'); return; }
    const codes = { 'BETCOIN': 10000 };
    if (codes[code]) {
        saveBalance(balance + codes[code]);
        alert('🎉 +' + codes[code] + ' BetCoin!');
        closePromo();
    } else { alert('❌ Неверный код!'); }
}

// ===== RESULT =====
function closeResult() { document.getElementById('resultModal').classList.remove('active'); }

window.showResult = function(win, amount) {
    document.getElementById('resIcon').textContent = win ? '🎉' : '😔';
    document.getElementById('resTitle').textContent = win ? 'Вы выиграли!' : 'Вы проиграли!';
    document.getElementById('resTitle').className = 'result-title ' + (win ? 'win' : 'lose');
    document.getElementById('resAmount').textContent = win ? '+' + amount + ' BetCoin' : 'Попробуйте снова!';
    document.getElementById('resultModal').classList.add('active');
};

// ===== INIT =====
loadUser();

window.goHome = goHome;
window.openDice = openDice;
window.closeDice = closeDice;
window.setBet = setBet;
window.placeBet = placeBet;
window.openPromo = openPromo;
window.closePromo = closePromo;
window.applyPromo = applyPromo;
window.closeResult = closeResult;
</script>
</body>
</html>
