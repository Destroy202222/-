<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e1a;
            padding: 20px;
            overflow: hidden;
        }

        /* 3D ФОН */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a3a6a 0%, #0a0e1a 70%);
            overflow: hidden;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, #4a8af4, #1a3a7a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #6aafff, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #8ac4ff, #3a6aaa);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ХЕДЕР */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a8af4, #1a3a7a);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(74, 138, 244, 0.3);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* БАЛАНС */
        .balance-block {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px 20px 22px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .balance-amount {
            color: #fff;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(74, 138, 244, 0.2);
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 13px 10px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a8af4, #2a5a9a);
            color: #fff;
            box-shadow: 0 4px 20px rgba(74, 138, 244, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #c8d6ff;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* ЗАГОЛОВОК "УПРАВЛЕНИЕ" */
        .menu-title {
            width: 100%;
            color: #aec0ff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-align: left;
        }

        /* СЕТКА МЕНЮ */
        .menu-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 6px;
            text-align: center;
            color: #c8d6ff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-item .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 6px;
            filter: brightness(0) invert(1);
            opacity: 0.5;
        }

        @media (max-width: 400px) {
            .app {
                padding: 15px;
            }
            .balance-amount {
                font-size: 34px;
            }
            .btn {
                font-size: 13px;
                padding: 11px 8px;
            }
            .menu-item {
                font-size: 11px;
                padding: 14px 4px;
            }
            .menu-item .icon {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <div class="app">
        <!-- ХЕДЕР -->
        <div class="header">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="username" id="userName">Гость</div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-block">
            <div class="balance-label">BETCOIN</div>
            <div class="balance-amount" id="balanceDisplay">0</div>
            <div class="buttons">
                <button class="btn btn-primary" id="getCoinsBtn">💎 Получить</button>
                <button class="btn btn-secondary" id="buyCoinsBtn">💰 Купить</button>
            </div>
        </div>

        <!-- УПРАВЛЕНИЕ -->
        <div class="menu-title">Управление</div>

        <div class="menu-grid">
            <div class="menu-item" onclick="alert('Профиль')">
                <span class="icon">👤</span>Профиль
            </div>
            <div class="menu-item" onclick="alert('Инвентарь')">
                <span class="icon">📦</span>Инвентарь
            </div>
            <div class="menu-item" onclick="alert('Сервис')">
                <span class="icon">⚙️</span>Сервис
            </div>
            <div class="menu-item" onclick="alert('Промо')">
                <span class="icon">🎁</span>Промо
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TELEGRAM AUTH
        // ============================================
        let tgUser = null;
        let balance = 5000;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        // ============================================
        // DOM REFS
        // ============================================
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const getCoinsBtn = document.getElementById('getCoinsBtn');
        const buyCoinsBtn = document.getElementById('buyCoinsBtn');

        // ============================================
        // UPDATE UI
        // ============================================
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();

            if (tgUser) {
                const name = tgUser.first_name || tgUser.username || 'Гость';
                userName.textContent = name;

                if (tgUser.photo_url) {
                    userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
                } else {
                    userAvatar.textContent = name.charAt(0).toUpperCase() || '🐹';
                }
            }
        }

        // ============================================
        // BUTTONS
        // ============================================
        getCoinsBtn.addEventListener('click', function() {
            balance += 500;
            updateUI();
            alert('✅ +500 BetCoin!');
        });

        buyCoinsBtn.addEventListener('click', function() {
            const amount = prompt('💰 Сколько BetCoin купить?', '1000');
            if (!amount) return;
            const coins = parseInt(amount);
            if (isNaN(coins) || coins <= 0) {
                alert('❌ Введите сумму!');
                return;
            }
            balance += coins;
            updateUI();
            alert(`✅ +${coins} BetCoin!`);
        });

        // ============================================
        // INIT
        // ============================================
        updateUI();

        console.log('🚀 BetGame запущен!');
        console.log('👤 Пользователь:', tgUser);
    </script>

</body>
</html>
