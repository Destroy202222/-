<script>

const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsaHpjb2N3Z216Y3J0emhlZmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ4ODYsImV4cCI6MjEwNjQ1MDg4Nn0.-Y1jYFT1NO9Nm1SgzNU7QYBA1E8zTZr8aXA768-5cd8";

const tg = Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d");

async function call(action, extra = {}) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 15000);
  try {
    const r = await fetch(API, { method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ action, initData: tg.initData, ...extra }) });
    let d = {}; try { d = await r.json(); } catch (_) { d = { error: "http_" + r.status }; }
    if (!r.ok) { d.status = d.status || r.status; throw d; }
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw { error: "timeout" };
    if (e instanceof TypeError) throw { error: "network", detail: e.message };
    throw e;
  } finally { clearTimeout(tm); }
}
const errText = e => ({ tag_not_found: "Тег не найден", tag_taken: "Этот аккаунт уже привязан", bad_auth: "Открой приложение из Telegram", timeout: "Сервер не отвечает (таймаут)", network: "Нет связи с сервером" }[e.error] || "Ошибка, попробуй ещё раз");

  const v = p.status === "verified";
  document.body.classList.toggle("shell", v);
  document.getElementById("nav").classList.toggle("hidden", !v);
  if (p.status === "verified") return profile(p);
  if (p.status === "pending") return pending(p);

const WL = "#0289PYLQGRJCUVO";
function makeCanvas(img, sx, sy, sw, sh, k, mode) {
  const c = document.createElement("canvas");
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    if (mode === "t100") v = v > 100 ? 255 : 0;
    if (mode === "t90inv") v = v > 90 ? 0 : 255;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}

async function readTags(file) {
  const img = await createImageBitmap(file);
  const reads = [];
  const grab = (t, strict) => {
    const re = strict ? /#\s*([0289PYLQGRJCUVO]{5,11})/g : /([0289PYLQGRJCUVO]{6,11})/g;
    for (const m of t.toUpperCase().matchAll(re)) reads.push(m[1].replace(/O/g, "0"));
  };
  const w = await Tesseract.createWorker("eng");
  try {
    await w.setParameters({ tessedit_char_whitelist: WL, tessedit_pageseg_mode: "11" });
    const sc = img.width < 1500 ? 1500 / img.width : 1;
    let box = null;
    for (const m of ["gray", "t100", "t90inv"]) {
      const { data } = await w.recognize(makeCanvas(img, 0, 0, img.width, img.height, sc, m));
      grab(data.text, true);
      if (!box) { const wd = (data.words || []).find(q => q.text.includes("#")); if (wd) box = wd.bbox; }
    }
    if (box) {
      await w.setParameters({ tessedit_pageseg_mode: "7" });
      const h = box.y1 - box.y0, pad = h * 0.6;
      const sx = Math.max(0, (box.x0 - pad) / sc), sy = Math.max(0, (box.y0 - pad) / sc);
      const sw = Math.min(img.width - sx, (box.x1 - box.x0 + 2 * pad) / sc), sh = Math.min(img.height - sy, (h + 2 * pad) / sc);
      for (const m of ["gray", "t90inv", "t100"]) for (const k of [3, 4]) {
        const { data } = await w.recognize(makeCanvas(img, sx, sy, sw, sh, k, m));
        grab(data.text, false);
      }
    }
  } finally { await w.terminate(); }
  const cnt = {}; reads.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || Math.abs(a.length - 9) - Math.abs(b.length - 9)).slice(0, 8);
}

function withVariants(list) {
  const out = [];
  for (const t of list) {
    out.push(t);
    for (let i = 1; i < t.length; i++) if (t[i] === t[i - 1]) out.push(t.slice(0, i) + t.slice(i + 1));
  }
  return [...new Set(out)].slice(0, 20);
}

function upload() {
  app.innerHTML = `<div class="icon">🛡️</div><h1>Верификация аккаунта</h1>
  <p>Подтверди, что аккаунт Brawl Stars принадлежит тебе</p>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <input type="file" id="f" accept="image/*" class="hidden">
  <button class="drop" id="pick"><b>📷</b>Загрузить скриншот профиля<small>Мы сами найдём твой #ТЕГ</small></button>
  <p id="st"></p>
  <input type="text" id="manual" class="hidden" placeholder="#ТЕГ вручную">
  <button class="btn hidden" id="go">Продолжить</button>`;
  const f = q("f"), st = q("st");
  let found = [];
  q("pick").onclick = () => f.click();
  f.onchange = async () => {
    if (!f.files[0]) return;
    st.textContent = "Распознаём тег…"; st.className = "";
    let err = ""; found = [];
    try { found = await readTags(f.files[0]); } catch (e) { err = " (" + (e.message || e) + ")"; }
    q("manual").value = found[0] ? "#" + found[0] : "";
    st.textContent = found[0] ? "Проверь тег и нажми «Продолжить»" : "Тег не распознан — введи вручную" + err;
    q("manual").classList.remove("hidden"); q("go").classList.remove("hidden");
  };
  q("go").onclick = async () => {
    q("go").disabled = true; st.className = "";
    const raw = q("manual").value.toUpperCase().replace(/^#/, "").replace(/O/g, "0").replace(/[^0289PYLQGRJCUV]/g, "");
    const cands = withVariants(raw === found[0] ? found : [raw]);
    let last;
    for (const t of cands) {
      st.textContent = "Ищем аккаунт…";
      try { return render((await call("start", { tag: t })).player); }
      catch (e) { last = e; if (e.error !== "tag_not_found") break; }
    }
    st.textContent = errText(last || {}); st.className = "err"; q("go").disabled = false;
  };
}

function toast(t) {

function applySnap(sn) {
  if (!sn) return;
  snap = sn; off = new Date(sn.now).getTime() - Date.now();
  if (cur) cur.balance = sn.balance;
  const wbe = document.getElementById("wb"); if (wbe) wbe.textContent = money(sn.balance);
  const key = JSON.stringify([sn.mine, sn.open, sn.balance]);
  if (key !== lastKey) { lastKey = key; if (curTab === "matches") renderMatches(); }
  if (sn.mine && sn.mine.status === "confirming" && curTab !== "matches") showTab("matches");
}

async function lobbyCall(action, extra = {}) {
  if (busy) return; busy = true;
  try { const d = await call(action, extra); busy = false; applySnap(d.snap); if (d.error) toast(LERR[d.error] || d.error); if (d.snap) renderMatches(); }

}

// ПРАВКА 1: tick() — два таймера (поиск и подтверждение)
function tick() {
  if (!snap || !snap.mine) return;
  const m = snap.mine;

  if (m.status === "waiting" && m.search_deadline) {
    const el = document.getElementById("cd");
    const ring = document.getElementById("ring");
    const total = (m.search_seconds || 150) * 1000;
    const left = Math.max(0, new Date(m.search_deadline).getTime() - (Date.now() + off));
    if (el) { const s = Math.ceil(left / 1000); el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
    if (ring) ring.style.strokeDashoffset = 565 * (1 - left / total);
    if (left <= 0 && !tick.f) { tick.f = true; setTimeout(() => { tick.f = false; poll(); }, 700); }
    return;
  }

  if (m.status === "confirming") {
    const el = document.getElementById("cd");
    if (!el) return;
    const total = (snap.confirm_seconds || 30) * 1000;
    const left = Math.max(0, new Date(m.deadline).getTime() - (Date.now() + off));
    el.textContent = Math.ceil(left / 1000);
    const ring = document.getElementById("ring");
    if (ring) ring.style.strokeDashoffset = 565 * (1 - left / total);
    if (left <= 0 && !tick.f) { tick.f = true; setTimeout(() => { tick.f = false; poll(); }, 700); }
  }
}

const RPCB = "https://wlhzcocwgmzcrtzhefic.supabase.co/rest/v1/rpc/";
const rpc = (a, b) => rpcTo("tg_do", a, b);

const ms  = (a, b) => rpcTo("tg_ms", a, b);
async function rpcTo(fn, action, args = {}) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  try {
    const r = await fetch(RPCB + fn, { method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ p_init: tg.initData, p_action: action, p_args: args }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw { error: d.message || "rpc_error" };
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw { error: "timeout" };
    if (e instanceof TypeError) throw { error: "network" };
    throw e;
  } finally { clearTimeout(tm); }
}
const eText = e => LERR[e.error] || errText(e);
async function shrink(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1100 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.62);
}

const fmtD = d => new Date(d).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace(".", "");
const sgn = n => (n > 0 ? "+" : "") + n;
function fillStats() {
  const w = cur.wins || 0, l = cur.losses || 0, g = w + l;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set("sw", w); set("sl", l); set("sr", g ? Math.round(w / g * 100) + "%" : "—");
}
async function loadProfileHistory() {

  const box = document.getElementById("chbox"), hl = document.getElementById("hlist");
  if (!box || curTab !== "profile") return;

  hl.innerHTML = d.matches.length ? d.matches.slice().reverse().slice(0, 20).map(m => {
    const w = m.result === "win";
    const dt = new Date(m.created_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="mrow"><div class="mres ${w ? "win" : "loss"}">${w ? "Победа" : "Поражение"}</div>
      <div class="minfo"><b>${modeName(m.mode)} · ${m.map || ""}</b><span>${m.mode === "sd" ? (m.place ? m.place + " место" : "вне призов") : "vs " + (m.opponent || "—")} · ${dt}</span></div>
      <div class="mdelta ${m.profit >= 0 ? "up" : "down"}">${sgn(m.profit)} ₽</div></div>`;
  }).join("") : "<p>Матчей пока нет.</p>";
}
function drawChart(box, ms) {
  if (!ms.length) { box.innerHTML = "<p>Пока нет матчей — график появится после первой игры.</p>"; return; }
  const W = box.clientWidth || 320, H = 150, pt = 12, pb = 8, n = ms.length;
  const vals = ms.map(m => Number(m.total));
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 10; max += 10; }
  const pad = (max - min) * 0.15; min -= pad; max += pad;
  const X = i => n === 1 ? W / 2 : i * (W / (n - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const line = "M" + ms.map((m, i) => X(i).toFixed(1) + "," + Y(Number(m.total)).toFixed(1)).join(" L");
  const area = line + ` L${X(n - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z`;
  const col = vals[n - 1] >= vals[0] ? "#6ee787" : "#ff6b6b";
  const grid = [0, 1, 2, 3].map(k => { const y = (pt + (H - pt - pb) * k / 3).toFixed(1); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#222" stroke-width="1"/>`; }).join("");
  box.innerHTML = `<div class="ch-head"><div><b id="chv"></b><span id="chd"></span></div><span id="cht"></span></div>
  <svg id="chsvg" viewBox="0 0 ${W} ${H}" height="${H}">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cl" y1="0" y2="${H}" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle id="cc" r="6" fill="#0d0d0d" stroke="${col}" stroke-width="3"/>
  </svg>
  <div class="ch-foot"><span>${fmtD(ms[0].created_at)}</span><span>${fmtD(ms[n - 1].created_at)}</span></div>`;
  const svg = box.querySelector("#chsvg"), cl = box.querySelector("#cl"), cc = box.querySelector("#cc");
  const set = i => {
    const m = ms[i], x = X(i);
    cl.setAttribute("x1", x); cl.setAttribute("x2", x);
    cc.setAttribute("cx", x); cc.setAttribute("cy", Y(Number(m.total)));
    box.querySelector("#chv").textContent = money(m.total);
    const d = box.querySelector("#chd"); d.textContent = sgn(m.profit) + " ₽"; d.className = m.profit >= 0 ? "up" : "down";
    box.querySelector("#cht").textContent = fmtD(m.created_at);
  };
  let drag = false;
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = n === 1 ? 0 : Math.round((e.clientX - r.left) / r.width * (n - 1));
    set(Math.max(0, Math.min(n - 1, i)));
  };
  svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener("pointermove", e => { if (drag) move(e); });
  ["pointerup", "pointercancel"].forEach(ev => svg.addEventListener(ev, () => drag = false));
  set(n - 1);
}

  app.innerHTML = `<h1>Админ-меню</h1>${adminSeg()}
  <div class="sec">Создать промокод</div>
  <input type="text" id="pcode" placeholder="Код (пусто — создать случайный)" style="font-size:15px;text-transform:uppercase">
  <input type="text" id="pamt" inputmode="numeric" placeholder="Сумма на баланс, ₽">
  <input type="text" id="pmax" inputmode="numeric" placeholder="Сколько человек смогут использовать">
  <button class="btn" id="pmk">Создать промокод</button>
  <div class="sec">Промокоды</div><div class="mlist">${rows || "<p>Пока нет промокодов.</p>"}</div>`;
  bindSeg();
  q("pmk").onclick = async () => {
    const amount = q("pamt").value.replace(/\D/g, ""), max = q("pmax").value.replace(/\D/g, "");
    if (!amount || !max) { toast("Укажи сумму и количество использований"); return; }
    q("pmk").disabled = true;
    try {
      const r = await rpc("promo_create", { code: q("pcode").value, amount, max_uses: max });
      try { navigator.clipboard.writeText(r.code); } catch (_) {}
      toast("Создан промокод " + r.code); renderPromo();
    } catch (e) { toast(eText(e)); q("pmk").disabled = false; }
  };
  app.querySelectorAll("[data-pc]").forEach(b => b.onclick = async () => {
    try { await rpc("promo_toggle", { code: b.dataset.pc }); renderPromo(); } catch (e) { toast(eText(e)); }
  });
}

async function renderAdmins() {
  let d; try { d = await rpc("admins_list"); } catch (e) { toast(eText(e)); return; }
  if (curTab !== "admin" || adminSec !== "admins") return;
  const rows = d.admins.map(a => `<div class="lrow"><div class="li"><b>${a.name || "Ещё не заходил"}</b><span>${a.tag}${a.main ? " · главный админ" : ""}</span></div>
    ${a.main ? "" : `<button class="btn" data-da="${a.tag}">Убрать</button>`}</div>`).join("");
  app.innerHTML = `<h1>Админ-меню</h1>${adminSeg()}
  <div class="sec">Добавить админа</div>
  <input type="text" id="atag" placeholder="#ТЕГ Brawl Stars" style="text-transform:uppercase">
  <button class="btn" id="aadd">Сделать админом</button>
  <div class="sec">Админы</div><div class="mlist">${rows}</div>`;
  bindSeg();
  q("aadd").onclick = async () => {
    if (!q("atag").value.trim()) return;
    q("aadd").disabled = true;
    try { await rpc("admin_add", { tag: q("atag").value }); toast("Админ добавлен"); renderAdmins(); }
    catch (e) { toast(eText(e)); q("aadd").disabled = false; }
  };
  app.querySelectorAll("[data-da]").forEach(b => b.onclick = () => askOk(`Убрать админа ${b.dataset.da}?`, async () => {
    try { await rpc("admin_del", { tag: b.dataset.da }); renderAdmins(); } catch (e) { toast(eText(e)); }
  }));
}

async function openGame(id) {
  adminGameId = id; app.dataset.adm = "0";
  let g; try { g = await rpc("admin_game", { id }); } catch (e) { toast(eText(e)); adminGameId = null; return renderAdmin(); }
  const sd = g.mode === "sd", picks = [];
  const ps = g.players.map(p => `<div class="sec" style="margin-top:14px">${p.name} · ${p.tag}</div>
    ${p.img ? `<img class="shot" src="${p.img}" data-v="1" alt="">` : "<p>Скриншот не прикреплён</p>"}
    ${sd ? `<div class="pk"><button class="btn sm" data-p="1" data-id="${p.tg_id}">1 место</button><button class="btn sm" data-p="2" data-id="${p.tg_id}">2 место</button></div>` : ""}`).join("");
  app.innerHTML = `<h1>Игра #${g.id}</h1><p>${modeName(g.mode)} · ${g.map} · ставка ${money(g.stake)}</p>${ps}
  <div class="sec">${sd ? "Выбери 1 и 2 место" : "Кто победил?"}</div>
  ${sd ? '<button class="btn" id="done" disabled>Подтвердить результат</button>' : g.players.map(p => `<button class="btn" data-w="${p.tg_id}">Победил ${p.name}</button>`).join("")}
  <button class="btn ghost" id="back">← Назад</button>`;
  app.querySelectorAll("[data-v]").forEach(i => i.onclick = () => viewImg(i.src));
  q("back").onclick = () => { app.dataset.adm = "0"; renderAdmin(); };
  const finish = async winners => {
    try { await rpc("admin_pick", { id, winners }); toast("Результат подтверждён"); }
    catch (e) { toast(eText(e)); }
    adminGameId = null; app.dataset.adm = "0"; renderAdmin();
  };
  const ask = (msg, go) => tg.showConfirm ? tg.showConfirm(msg, ok => ok && go()) : (confirm(msg) && go());
  if (sd) {
    app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      const place = +b.dataset.p - 1, pid = +b.dataset.id;
      const other = 1 - place;
      if (picks[other] === pid) picks[other] = undefined;
      picks[place] = pid;
      app.querySelectorAll("[data-p]").forEach(x => x.classList.toggle("on", picks[+x.dataset.p - 1] === +x.dataset.id));
      q("done").disabled = !(picks[0] && picks[1]);
    });
    q("done").onclick = () => {
      const nm = id2 => g.players.find(p => p.tg_id === id2).name;
      ask(`1 место: ${nm(picks[0])}\n2 место: ${nm(picks[1])}\nПодтвердить результат?`, () => finish([picks[0], picks[1]]));
    };
  } else {
    app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      const name = g.players.find(p => String(p.tg_id) === b.dataset.w).name;
      ask(`Победитель: ${name}. Подтвердить результат?`, () => finish([+b.dataset.w]));
    });
  }
}

function openTopup() {
  if (topupPending) { toast("У тебя уже есть заявка на пополнение"); return; }
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-in" id="sh"></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  const sh = el.querySelector("#sh");
  const stepAmount = (def = 300) => {
    sh.innerHTML = `<h1>Пополнение</h1><p>Выбери сумму в рублях</p>
    <div class="chips">${[100, 300, 500, 1000].map(a => `<button class="chip${a === def ? " on" : ""}" data-a="${a}">${a} ₽</button>`).join("")}</div>
    <input type="text" id="amt" inputmode="numeric" value="${def}" placeholder="Своя сумма, ₽">
    <p id="tst"></p>
    <button class="btn" id="pay">Перейти к оплате</button>
    <button class="link" id="cls">Отмена</button>`;
    const inp = sh.querySelector("#amt"), tst = sh.querySelector("#tst");
    sh.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      sh.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on"); inp.value = c.dataset.a;
    });
    sh.querySelector("#cls").onclick = () => el.remove();
    sh.querySelector("#pay").onclick = () => {
      const amount = parseInt(inp.value.replace(/\D/g, ""), 10);
      if (!amount || amount < 50 || amount > 50000) { tst.textContent = "Сумма от 50 до 50 000 ₽"; tst.className = "err"; return; }
      stepQr(amount);
    };
  };
  const stepQr = amount => {
    const ref = String(1000 + Math.floor(Math.random() * 9000));
    sh.innerHTML = `<h1>Переведи ${money(amount)}</h1>
    <p>Отсканируй QR-код в приложении банка (с другого устройства или сохрани картинку долгим нажатием) и переведи ровно <b style="color:var(--tx)">${money(amount)}</b></p>
    <img class="qr" src="${QR_IMG}" alt="QR для перевода">
    <p style="margin-top:12px">В комментарии к переводу укажи код (если банк позволяет):</p>
    <div class="refcode">${ref}</div>
    <p id="tst"></p>
    <button class="btn" id="ok">Подтвердить перевод</button>
    <button class="link" id="back">← Изменить сумму</button>`;
    sh.querySelector("#back").onclick = () => stepAmount(amount);
    sh.querySelector("#ok").onclick = async () => {
      const ok = sh.querySelector("#ok"), tst = sh.querySelector("#tst");
      ok.disabled = true; tst.className = ""; tst.textContent = "Отправляем заявку…";
      try {
        await pay("request", { amount, ref });
        el.remove();
        topupPending = { amount, ref };
        renderTopupBox();
        toast("Заявка отправлена. Ждём подтверждения администратора");
      } catch (e) { tst.textContent = eText(e); tst.className = "err"; ok.disabled = false; }
    };
  };
  stepAmount();
}

function renderTopupBox() {
  const box = document.getElementById("tpbox"); if (!box) return;
  if (!topupPending) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="note"><span class="pulse"></span><b>Ожидание оплаты</b> · ${money(topupPending.amount)}<br>Администратор проверяет перевод и пополнит баланс.</div>
  <button class="link" id="tpc">Отменить заявку</button>`;
  q("tpc").onclick = async () => {
    try { await pay("cancel"); topupPending = null; renderTopupBox(); toast("Заявка отменена"); } catch (e) { toast(eText(e)); }
  };
}
function applyTopupState(st) {
  const prev = topupPending;
  topupPending = st.pending ? { amount: st.pending.amount, ref: st.pending.ref } : null;
  if (prev && !topupPending && st.last) {
    toast(st.last.status === "approved" ? "Баланс пополнен на " + money(st.last.amount) : "Перевод на " + money(st.last.amount) + " отклонён администратором");
  }
  renderTopupBox();
}
let admWd = 0;
async function extraPoll() {
  if (isAdmin) {
    loadAdminStats();
    try {
      const c = await pay("admin_counts"), w = await wd("admin_count");
      const n = Number(c.topups) + Number(c.games) + Number(w.withdrawals);
      const bdg = document.getElementById("admbdg");
      bdg.textContent = n; bdg.classList.toggle("hidden", n === 0);
      if (Number(c.topups) > admTop) toast("Новая заявка на пополнение");
      if (Number(w.withdrawals) > admWd) toast("Новая заявка на вывод");
      admTop = Number(c.topups); admWd = Number(w.withdrawals);
    } catch (e) {}
  }
  if (cur && (topupPending || curTab === "profile")) { try { applyTopupState(await pay("status")); } catch (e) {} }
  if (cur && (wdPending.length || curTab === "profile")) { try { applyWdState(await wd("status")); } catch (e) {} }
}

let wdPending = [];
function renderWdBox() {
  const box = document.getElementById("wdbox"); if (!box) return;
  box.innerHTML = wdPending.map(w => `<div class="note"><span class="pulse"></span><b>Вывод в обработке</b> · ${money(w.amount)}${w.bank ? " · " + w.bank : ""}<br>Администратор скоро отправит перевод. Если вывод отменят, деньги вернутся на баланс.</div>`).join("");
}
function applyWdState(st) {
  const prev = wdPending;
  wdPending = st.pending || [];
  prev.filter(p => !wdPending.some(n => n.id === p.id)).forEach(p => {
    const r = (st.recent || []).find(x => x.id === p.id);
    if (r) toast(r.status === "paid" ? "Вывод " + money(r.amount) + " выполнен" : "Вывод отменён", " + money(r.amount) + " верну inputлись на баланс");
  });
 mode renderWdBox();
}
const normPhone = v =>=" {
  const d = v.replace(/\Dtel/g, "");
  if (d.length === 11 && (d[0]" === "7" || d[0] === "8")) return "+7" + d.slice(1);
  if (d.length === 10 && d[0] === "9") return "+7" + d;
  return null;
};
function openWithdraw() {
  const bal = Math.floor(Number(cur.balance || 0));
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="sheet-in"><h1>Вывод средств</h1><p>Доступно: <b style="color:var(--tx)">${money(bal)}</b></p>
    <input type="text" id="wamt" inputmode="numeric" placeholder="Сумма вывода, ₽" autocomplete="off">
    <input type="text" id="wph placeholder="Номер телефона получателя" value="+7" autocomplete="off">
    <input type="text" id="wbank" list="banks" placeholder="Банк получателя" autocomplete="off">
    <datalist id="banks"><option value="Сбербанк"><option value="Т-Банк"><option value="ВТБ"><option value="Альфа-Банк"><option value="Ozon Банк"><option value="Райффайзенбанк"><option value="Газпромбанк"><option value="Совкомбанк"><option value="Яндекс Банк"></datalist>
    <p id="tst" style="font-size:12px">Сумма сразу спишется с баланса. Если вывод отменят, деньги вернутся.</p>
    <button class="btn" id="ok">Подтвердить вывод</button><button class="link" id="cls">Отмена</button></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if (e.target === el) el.remove(); };
  const tst = el.querySelector("#tst"), ok = el.querySelector("#ok");
  const bad = t => { tst.textContent = t; tst.className = "err"; };
  el.querySelector("#cls").onclick = () => el.remove();
  ok.onclick = async () => {
    const amount = parseInt(el.querySelector("#wamt").value.replace(/\D/g, ""), 10);
    const phone = normPhone(el.querySelector("#wph").value);
    const bank = el.querySelector("#wbank").value.trim();
    if (!amount || amount < 50) return bad("Минимальная сумма вывода — 50 ₽");
    if (amount > bal) return bad("Недостаточно средств на балансе");
    if (!phone) return bad("Введи российский номер: +7 900 000-00-00");
    if (bank.length < 2) return bad("Укажи банк получателя");
    ok.disabled = true; tst.className = ""; tst.textContent = "Создаём заявку…";
    try {
      const d = await wd("request", { amount, phone, bank });
      cur.balance = d.balance;
      const wbe = document.getElementById("wb"); if (wbe) wbe.textContent = money(d.balance);
      wdPending.push({ id: d.id, amount, bank }); renderWdBox();
      el.remove(); toast("Заявка на вывод создана");
    } catch (e) { bad(eText(e)); ok.disabled = false; }
  };
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { if (cur) showTab(b.dataset.t); });

["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault());

function boot() {
  app.innerHTML = "<h1>Загрузка…</h1>";
  call("me").then(d => { render(d.player); ms("ref_touch").catch(() => {}); }).catch(e => {
    app.innerHTML = `<div class="icon">⚠️</div><h1>Не удалось загрузить</h1><p class="err">${errText(e)}</p><p style="font-size:12px">${[e.error, e.status, e.detail, e.message].filter(Boolean).join(" · ")}</p><button class="btn" onclick="boot()">Повторить</button>`;
  });
}
boot();
</script>
</body>
</html>
