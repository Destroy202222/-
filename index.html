                    document.getElementById('result').innerHTML = '❌ Ошибка: ' + error.message + '<br>Код: ' + error.code;

                }
            } catch(e) {
                document.getElementById('result').innerHTML = '❌ Ошибка: ' + e.message;
            }
        }

        test();
    </script>
