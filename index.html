<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STARTUP PLATFORM · профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ===== ФОН ===== */
    body {
      background-color: #0a0705;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255, 120, 0, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 90, 0, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 70% 15%, rgba(255, 150, 0, 0.10) 0%, transparent 40%),
        linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
      background-attachment: fixed;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffeadb;
    }

    /* ===== ОБЛАСТЬ КОНТЕНТА ===== */
    .app-scroll {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 110px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== КАРТОЧКА ===== */
    .card {
      max-width: 880px;
      width: 100%;
      height: fit-content;
      background: rgba(12, 8, 5, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 130, 0, 0.35);
      border-radius: 40px;
      padding: 2.2rem 2.25rem 2rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(255, 160, 40, 0.08) inset,
        0 30px 70px -25px #000,
        0 0 60px rgba(255, 110, 0, 0.10);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -120px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 120, 0, 0.18), transparent 70%);
      pointer-events: none;
    }

    /* ===== НАЗВАНИЕ ===== */
    .project-title {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #ff8a00;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.75);
      margin-bottom: 1.8rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 130, 0, 0.18);
      position: relative;
      z-index: 1;
    }

    /* ===== ШАПКА ===== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      border: 3px solid #ffb347;
      box-shadow:
        0 0 0 3px rgba(255, 140, 0, 0.25),
        0 0 30px rgba(255, 120, 0, 0.55),
        0 8px 20px -6px #000;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #3a1400;
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      text-transform: uppercase;
    }

    .nickname {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow:
        0 0 18px rgba(255, 140, 0, 0.85),
        0 0 40px rgba(255, 90, 0, 0.55);
      line-height: 1.1;
      word-break: break-word;
    }

    .nickname .at {
      color: #ff8a00;
      text-shadow: 0 0 14px rgba(255, 140, 0, 0.9);
    }

    /* ===== БАЛАНС ===== */
    .balance-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      background: linear-gradient(135deg, rgba(40, 20, 5, 0.9), rgba(20, 10, 3, 0.9));
      border-radius: 100px;
      padding: 0.9rem 2rem;
      margin: 0 auto 2rem auto;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 140, 0, 0.45);
      box-shadow:
        0 0 30px rgba(255, 120, 0, 0.18),
        inset 0 0 24px rgba(255, 120, 0, 0.06);
      position: relative;
      z-index: 1;
    }

    .coin-css {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffc266 0%, #ff8a00 45%, #c74a00 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 2px #7a2e00,
        0 0 14px rgba(255, 140, 0, 0.9),
        0 4px 0 #8a3600,
        0 6px 12px rgba(0, 0, 0, 0.7);
      position: relative;
      flex-shrink: 0;
    }

    .coin-css::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #fff6d8, rgba(255, 230, 150, 0));
      border-radius: 50%;
      top: 4px;
      left: 5px;
      filter: blur(0.5px);
    }

    .coin-css::after {
      content: "";
      width: 12px;
      height: 12px;
      background: #3a1400;
      clip-path: polygon(
        60% 0%, 100% 0%, 100% 18%, 45% 18%,
        45% 38%, 100% 38%, 100% 100%, 0% 100%,
        0% 82%, 55% 82%, 55% 62%, 0% 62%, 0% 0%
      );
      filter: drop-shadow(0 0 3px rgba(255, 200, 100, 0.5));
      opacity: 0.9;
    }

    .balance-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.9);
      letter-spacing: 0.02em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    /* ===== СТАТИСТИКА ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      margin-bottom: 1.8rem;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      background: linear-gradient(160deg, rgba(35, 18, 5, 0.9), rgba(15, 8, 2, 0.9));
      border-radius: 22px;
      padding: 1.3rem 0.5rem;
      text-align: center;
      border: 1px solid rgba(255, 140, 0, 0.30);
      box-shadow:
        0 10px 24px -12px #000,
        inset 0 1px 0 rgba(255, 180, 80, 0.08);
      transition: all 0.25s ease;
    }

    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: #c98a4e;
      margin-bottom: 0.55rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }

    /* ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== */
    .win-loss-row {
      display: flex;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .wl-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1.1rem 1rem;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.7rem;
      letter-spacing: 0.02em;
      border: 1.5px solid;
      transition: all 0.25s ease;
    }

    .wl-block.wins {
      border-color: #22c55e;
      color: #4ade80;
      background: linear-gradient(145deg, rgba(20, 60, 35, 0.55), rgba(8, 30, 18, 0.55));
      box-shadow:
        0 0 26px rgba(34, 197, 94, 0.28),
        inset 0 0 20px rgba(34, 197, 94, 0.08);
      text-shadow: 0 0 16px rgba(74, 222, 128, 0.8);
    }

    .wl-block.losses {
      border-color: #ef4444;
      color: #f87171;
      background: linear-gradient(145deg, rgba(70, 15, 20, 0.55), rgba(35, 8, 10, 0.55));
      box-shadow:
        0 0 26px rgba(239, 68, 68, 0.28),
        inset 0 0 20px rgba(239, 68, 68, 0.08);
      text-shadow: 0 0 16px rgba(248, 113, 113, 0.8);
    }

    .wl-label {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.14em;
      opacity: 0.95;
    }

    .wl-icon {
      width: 34px;
      height: 34px;
      position: relative;
      flex-shrink: 0;
      display: inline-block;
    }

    .win-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #4ade80, #16a34a);
      clip-path: polygon(50% 0%, 100% 22%, 100% 65%, 50% 100%, 0% 65%, 0% 22%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.9);
    }

    .win-icon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 8px;
      border-left: 3px solid #052e16;
      border-bottom: 3px solid #052e16;
      transform: rotate(-45deg);
      top: 11px;
      left: 9px;
    }

    .loss-icon::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      background: linear-gradient(160deg, #f87171, #b91c1c);
      border-radius: 6px;
      top: 4px;
      left: 4px;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
    }

    .loss-icon::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 6px;
      background: #2a0505;
      border-radius: 3px;
      top: 14px;
      left: 4px;
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }

    /* ============================================================
       НИЖНЯЯ НАВИГАЦИЯ — ТОЛЬКО ЦЕНТРАЛЬНЫЙ КРУЖОК
       ============================================================ */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* мягкое затемнение снизу под кнопкой */
    .bottom-nav::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background: linear-gradient(180deg, transparent 0%, rgba(10, 6, 2, 0.55) 55%, rgba(8, 5, 2, 0.92) 100%);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== ЦЕНТРАЛЬНАЯ КНОПКА «ИГРЫ» ===== */
    .center-btn {
      pointer-events: auto;
      position: relative;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;

      background: radial-gradient(circle at 32% 26%, #ffc46b 0%, #ff9500 38%, #d85500 72%, #a33700 100%);

      box-shadow:
        0 0 0 5px rgba(255, 140, 0, 0.18),
        0 0 0 7px rgba(255, 140, 0, 0.08),
        0 0 44px rgba(255, 130, 0, 0.85),
        0 14px 28px -8px #000,
        inset 0 3px 12px rgba(255, 240, 190, 0.5),
        inset 0 -8px 18px rgba(120, 40, 0, 0.6);

      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease;
      display: flex;
      align-items: center;
      justify-content: center;

      /* лёгкое парение */
      transform: translateY(-6px);
    }

    /* пульсирующее кольцо вокруг кнопки */
    .center-btn::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 150, 30, 0.35);
      animation: pulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.12);
        opacity: 0;
      }
    }

    /* блик сверху */
    .center-btn::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 20%;
      width: 44%;
      height: 30%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.55), transparent 70%);
      pointer-events: none;
    }

    .center-btn:hover {
      box-shadow:
        0 0 0 5px rgba(255, 160, 40, 0.28),
        0 0 0 7px rgba(255, 160, 40, 0.14),
        0 0 60px rgba(255, 150, 20, 1),
        0 16px 32px -8px #000,
        inset 0 3px 14px rgba(255, 245, 200, 0.6),
        inset 0 -8px 20px rgba(120, 40, 0, 0.6);
      transform: translateY(-9px) scale(1.03);
    }

    .center-btn:active {
      transform: translateY(-3px) scale(0.97);
    }

    /* ===== CSS-ЭМОДЗИ «ИГРЫ» — геймпад ===== */
    .game-icon {
      position: relative;
      width: 48px;
      height: 48px;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(60, 20, 0, 0.7));
    }

    /* корпус геймпада — верх */
    .game-icon .gp-body {
      position: absolute;
      width: 44px;
      height: 22px;
      background: linear-gradient(180deg, #2b1500, #150900);
      border-radius: 14px 14px 5px 5px / 12px 12px 4px 4px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      box-shadow:
        inset 0 2px 3px rgba(255, 190, 90, 0.35),
        inset 0 -2px 4px rgba(0, 0, 0, 0.9);
    }

    /* корпус — нижние рукоятки */
    .game-icon .gp-body::after {
      content: "";
      position: absolute;
      width: 48px;
      height: 16px;
      background: linear-gradient(180deg, #221000, #0e0600);
      border-radius: 3px 3px 22px 22px / 3px 3px 20px 20px;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.95);
    }

    /* D-pad (крестовина) */
    .game-icon .gp-dpad {
      position: absolute;
      width: 12px;
      height: 12px;
      background: linear-gradient(145deg, #ffe0a0, #ffab3d);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translate(-13px, -2px);
      clip-path: polygon(
        35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%,
        65% 65%, 65% 100%, 35% 100%, 35% 65%,
        0% 65%, 0% 35%, 35% 35%
      );
      box-shadow: 0 0 9px rgba(255, 200, 80, 1);
      z-index: 3;
    }

    /* кнопки A/B/X/Y */
    .game-icon .gp-btn {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle at 30% 30%, #fff3cf, #ffab3d);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      box-shadow: 0 0 8px rgba(255, 200, 80, 1);
      z-index: 3;
    }

    .game-icon .gp-btn.b1 { transform: translate(-50%, -50%) translate(14px, -7px); }
    .game-icon .gp-btn.b2 { transform: translate(-50%, -50%) translate(19px, -1px); }
    .game-icon .gp-btn.b3 { transform: translate(-50%, -50%) translate(14px, 5px); }
    .game-icon .gp-btn.b4 { transform: translate(-50%, -50%) translate(9px, -1px); }

    /* активное состояние */
    .center-btn.active {
      box-shadow:
        0 0 0 5px rgba(255, 180, 60, 0.45),
        0 0 0 8px rgba(255, 180, 60, 0.18),
        0 0 70px rgba(255, 170, 30, 1),
        0 16px 32px -8px #000,
        inset 0 3px 16px rgba(255, 250, 220, 0.7),
        inset 0 -8px 20px rgba(120, 40, 0, 0.6);
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 640px) {
      .app-scroll { padding: 1.2rem 1rem; bottom: 100px; }
      .card { padding: 1.6rem 1.3rem; border-radius: 30px; }
      .avatar { width: 66px; height: 66px; }
      .nickname { font-size: 1.7rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.9rem; }
      .balance-value { font-size: 1.8rem; }
      .balance-section { padding: 0.8rem 1.5rem; }
      .wl-block { font-size: 1.3rem; gap: 0.6rem; padding: 0.9rem 0.7rem; }
      .wl-label { font-size: 0.82rem; letter-spacing: 0.08em; }
      .wl-icon { width: 28px; height: 28px; }
      .win-icon::after { top: 9px; left: 7px; }
      .loss-icon::before { width: 22px; height: 22px; top: 3px; left: 3px; }
      .loss-icon::after { width: 22px; height: 5px; top: 12px; left: 3px; }
      .project-title { font-size: 0.8rem; letter-spacing: 0.3em; }

      .center-btn { width: 74px; height: 74px; }
      .game-icon { width: 42px; height: 42px; }
      .game-icon .gp-body { width: 38px; height: 20px; }
      .game-icon .gp-body::after { width: 42px; height: 14px; bottom: -11px; }
      .game-icon .gp-dpad { transform: translate(-50%, -50%) translate(-11px, -2px); }
      .game-icon .gp-btn.b1 { transform: translate(-50%, -50%) translate(12px, -6px); }
      .game-icon .gp-btn.b2 { transform: translate(-50%, -50%) translate(16px, -1px); }
      .game-icon .gp-btn.b3 { transform: translate(-50%, -50%) translate(12px, 4px); }
      .game-icon .gp-btn.b4 { transform: translate(-50%, -50%) translate(8px, -1px); }
    }

    @media (max-width: 420px) {
      .stats-grid { gap: 0.6rem; }
      .stat-value { font-size: 1.6rem; }
      .nickname { font-size: 1.4rem; }
      .balance-section { padding: 0.8rem 1.2rem; max-width: 320px; }
      .wl-label { display: none; }

      .center-btn { width: 68px; height: 68px; }
      .game-icon { width: 38px; height: 38px; }
      .game-icon .gp-body { width: 34px; height: 18px; }
      .game-icon .gp-body::after { width: 38px; height: 13px; bottom: -10px; }
      .game-icon .gp-dpad { width: 11px; height: 11px; transform: translate(-50%, -50%) translate(-10px, -2px); }
      .game-icon .gp-btn { width: 5px; height: 5px; }
      .game-icon .gp-btn.b1 { transform: translate(-50%, -50%) translate(11px, -5px); }
      .game-icon .gp-btn.b2 { transform: translate(-50%, -50%) translate(14px, -1px); }
      .game-icon .gp-btn.b3 { transform: translate(-50%, -50%) translate(11px, 4px); }
      .game-icon .gp-btn.b4 { transform: translate(-50%, -50%) translate(7px, -1px); }
    }
  </style>
</head>
<body>

  <!-- ===== КОНТЕНТ ===== -->
  <div class="app-scroll">
    <div class="card">

      <div class="project-title">STARTUP PLATFORM</div>

      <div class="profile-header">
        <div class="avatar" id="avatar">
          <div class="avatar-fallback" id="avatarFallback">?</div>
        </div>
        <div class="nickname" id="nickname"><span class="at">@</span>loading</div>
      </div>

      <div class="balance-section">
        <span class="coin-css" aria-hidden="true"></span>
        <span class="balance-value">0</span>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">Убийства</div>
          <div class="stat-value">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Смерти</div>
          <div class="stat-value">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Ассисты</div>
          <div class="stat-value">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">AVG</div>
          <div class="stat-value">0.00</div>
        </div>
      </div>

      <div class="win-loss-row">
        <div class="wl-block wins">
          <span class="wl-icon win-icon" aria-hidden="true"></span>
          <span class="wl-label">ПОБЕДЫ</span>
          <span>0</span>
        </div>
        <div class="wl-block losses">
          <span class="wl-icon loss-icon" aria-hidden="true"></span>
          <span class="wl-label">ПОРАЖЕНИЯ</span>
          <span>0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== НИЖНЯЯ НАВИГАЦИЯ — ТОЛЬКО ЦЕНТРАЛЬНЫЙ КРУЖОК ===== -->
  <nav class="bottom-nav">
    <button class="center-btn active" type="button" data-tab="games" aria-label="Игры">
      <span class="game-icon" aria-hidden="true">
        <span class="gp-body"></span>
        <span class="gp-dpad"></span>
        <span class="gp-btn b1"></span>
        <span class="gp-btn b2"></span>
        <span class="gp-btn b3"></span>
        <span class="gp-btn b4"></span>
      </span>
    </button>
  </nav>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (tg) {
        tg.ready();
        tg.expand();
      }

      const avatarEl = document.getElementById('avatar');
      const fallbackEl = document.getElementById('avatarFallback');
      const nicknameEl = document.getElementById('nickname');

      let user = null;
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          user = tg.initDataUnsafe.user;
        }
      } catch (e) {
        console.warn('Не удалось получить user из Telegram WebApp', e);
      }

      if (!user) {
        nicknameEl.innerHTML = '<span class="at">@</span>guest';
        fallbackEl.textContent = '?';
      } else {
        const username = user.username;
        const firstName = user.first_name || '';

        if (username) {
          nicknameEl.innerHTML = '<span class="at">@</span>' + username;
        } else if (firstName) {
          nicknameEl.textContent = firstName;
        } else {
          nicknameEl.innerHTML = '<span class="at">@</span>user';
        }

        const photoUrl = user.photo_url;

        if (photoUrl) {
          const img = document.createElement('img');
          img.src = photoUrl;
          img.alt = 'avatar';
          img.onload = () => {
            avatarEl.innerHTML = '';
            avatarEl.appendChild(img);
          };
          img.onerror = () => {
            const letter = (firstName || username || '?').trim().charAt(0);
            fallbackEl.textContent = letter || '?';
          };
        } else {
          const letter = (firstName || username || '?').trim().charAt(0);
          fallbackEl.textContent = letter || '?';
        }
      }

      // ===== ЦЕНТРАЛЬНАЯ КНОПКА =====
      const centerBtn = document.querySelector('.center-btn');
      centerBtn.addEventListener('click', () => {
        centerBtn.classList.toggle('active');
      });
    })();
  </script>
</body>
</html>
