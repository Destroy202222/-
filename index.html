<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkyRed — ставки на Standoff 2</title>
  <style>
    /* Общий сброс и шрифт */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b0e17;
      color: #f0f3fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px 30px;
    }

    .app {
      max-width: 800px;
      width: 100%;
      background: #11151f;
      border-radius: 36px 36px 24px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      padding: 20px 16px 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid #2a3142;
    }

    /* хедер как у fonbet */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #28303f;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      background: #e53935;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: white;
      box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0f3fa 0%, #b0c4e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .balance-block {
      background: #1e2639;
      padding: 8px 18px 8px 16px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #313b54;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
    }

    .balance-amount {
      font-weight: 700;
      font-size: 18px;
      color: #b8e45c;
      letter-spacing: 0.3px;
    }

    .balance-currency {
      color: #7986a8;
      font-size: 14px;
      font-weight: 500;
    }

    /* главный баннер киберспорта */
    .cyber-banner {
      background: linear-gradient(145deg, #1b2338, #0f1522);
      border-radius: 24px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #31405c;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
    }

    .banner-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .banner-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #d6e2ff;
    }

    .banner-sub {
      font-size: 13px;
      color: #8d9fc7;
      background: #1f2940;
      padding: 4px 12px;
      border-radius: 60px;
      display: inline-block;
      width: fit-content;
      border: 1px solid #3e4b6b;
    }

    .banner-icon {
      background: #2d3a57;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #e53935;
      border: 1px solid #4a5b81;
    }

    /* секция матчей */
    .matches-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .match-card {
      background: #151d2b;
      border-radius: 28px;
      padding: 18px 16px 16px;
      border: 1px solid #29344b;
      box-shadow: 0 6px 0 #0b0f17;
      transition: 0.1s ease;
    }

    .match-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      background: #233053;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #b3c7f0;
      border: 1px solid #41517a;
    }

    .vs {
      color: #68769e;
      font-weight: 600;
      background: #1f2840;
      padding: 4px 12px;
      border-radius: 60px;
      font-size: 12px;
      border: 1px solid #38466b;
    }

    .match-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #8b9bc2;
      margin-bottom: 16px;
      background: #101724;
      padding: 6px 14px;
      border-radius: 60px;
      width: fit-content;
      border: 1px solid #28334d;
    }

    .odds-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .odds-btn {
      background: #1e2840;
      border: 1px solid #31446b;
      border-radius: 40px;
      padding: 8px 24px 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #e4edff;
      transition: 0.15s;
      cursor: pointer;
      box-shadow: 0 3px 0 #0c111e;
      flex: 1 0 auto;
      justify-content: center;
    }

    .odds-btn span {
      background: #2f3e62;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 14px;
      color: #b8d0ff;
    }

    .odds-btn:hover {
      background: #26345a;
      border-color: #5b74a8;
      transform: scale(0.97);
    }

    .odds-btn:active {
      transform: scale(0.93);
    }

    .cupon-section {
      background: #0e1522;
      border-radius: 28px;
      padding: 18px 16px 20px;
      border: 1px solid #28324b;
      margin-top: 8px;
    }

    .cupon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .cupon-header h3 {
      font-weight: 600;
      font-size: 18px;
      color: #bcccf0;
      letter-spacing: -0.2px;
    }

    .cupon-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      min-height: 52px;
    }

    .cupon-item {
      background: #1a2338;
      border-radius: 40px;
      padding: 8px 14px 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #314160;
      font-size: 14px;
    }

    .cupon-item .remove {
      color: #cf5a6a;
      font-weight: 700;
      cursor: pointer;
      background: #2a1f2b;
      padding: 0 10px;
      border-radius: 60px;
      border: 1px solid #5b3d47;
      font-size: 14px;
    }

    .cupon-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101b2b;
      padding: 12px 18px;
      border-radius: 60px;
      border: 1px solid #2b3d60;
      margin-top: 4px;
    }

    .cupon-total span {
      font-weight: 600;
      color: #b8e45c;
      font-size: 18px;
    }

    .place-bet-btn {
      background: #e53935;
      border: none;
      border-radius: 60px;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 18px;
      color: white;
      width: 100%;
      margin-top: 16px;
      box-shadow: 0 6px 0 #841f1f;
      transition: 0.1s;
      cursor: pointer;
      letter-spacing: 0.5px;
      border: 1px solid #ff6b6b;
    }

    .place-bet-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #841f1f;
    }

    .place-bet-btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #841f1f;
      pointer-events: none;
    }

    .reset-btn {
      background: #2a3450;
      border: 1px solid #4d5f87;
      color: #b6caf5;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
      margin-top: 6px;
      font-size: 14px;
    }

    .reset-btn:active {
      transform: scale(0.95);
      background: #1e2844;
    }

    .footer-small {
      margin-top: 24px;
      text-align: center;
      color: #4b5b7a;
      font-size: 12px;
      border-top: 1px solid #1e2840;
      padding-top: 20px;
      letter-spacing: 0.3px;
    }

    .toast {
      background: #1f2b47;
      border-left: 5px solid #b8e45c;
      padding: 12px 16px;
      border-radius: 16px;
      margin: 12px 0 0;
      font-weight: 500;
      font-size: 14px;
      color: #d6e2ff;
      border: 1px solid #3b4e78;
    }

    /* адаптив */
    @media (max-width: 520px) {
      .app { padding: 16px 12px; }
      .logo-text { font-size: 20px; }
      .odds-btn { padding: 6px 14px; font-size: 14px; }
      .team { font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">SR</div>
      <div class="logo-text">SkyRed</div>
    </div>
    <div class="balance-block">
      <span class="balance-amount" id="balanceDisplay">20 000</span>
      <span class="balance-currency">₽</span>
    </div>
  </div>

  <!-- Cyber banner -->
  <div class="cyber-banner">
    <div class="banner-left">
      <div class="banner-title">⚡ Standoff 2</div>
      <div class="banner-sub">Киберспорт • матчи live</div>
    </div>
    <div class="banner-icon">🎯</div>
  </div>

  <!-- Список матчей -->
  <div class="matches-section" id="matchesContainer">
    <!-- матч 1 -->
    <div class="match-card" data-match="1">
      <div class="match-teams">
        <div class="team"><span class="team-logo">VP</span> Virtus.pro</div>
        <div class="vs">VS</div>
        <div class="team"><span class="team-logo">NAVI</span> NAVI</div>
      </div>
      <div class="match-meta">🏆 S2 Major • карта 3 • BO3</div>
      <div class="odds-row">
        <div class="odds-btn" data-match="1" data-outcome="team1" data-odds="1.85">VP <span>1.85</span></div>
        <div class="odds-btn" data-match="1" data-outcome="team2" data-odds="2.10">NAVI <span>2.10</span></div>
      </div>
    </div>
    <!-- матч 2 -->
    <div class="match-card" data-match="2">
      <div class="match-teams">
        <div class="team"><span class="team-logo">G2</span> G2 Esports</div>
        <div class="vs">VS</div>
        <div class="team"><span class="team-logo">FZ</span> Faze Clan</div>
      </div>
      <div class="match-meta">🏆 S2 Challenger • карта 2 • BO5</div>
      <div class="odds-row">
        <div class="odds-btn" data-match="2" data-outcome="team1" data-odds="1.72">G2 <span>1.72</span></div>
        <div class="odds-btn" data-match="2" data-outcome="team2" data-odds="2.25">Faze <span>2.25</span></div>
      </div>
    </div>
  </div>

  <!-- Купоны / ставки -->
  <div class="cupon-section">
    <div class="cupon-header">
      <h3>📋 Купон</h3>
      <button class="reset-btn" id="clearCouponBtn">Очистить</button>
    </div>
    <div class="cupon-items" id="cuponItems">
      <div style="color: #5c6e94; font-size: 14px; padding: 6px 0;">Выберите коэффициент</div>
    </div>
    <div class="cupon-total">
      <span>Общий коэффициент</span>
      <span id="totalOddsDisplay">—</span>
    </div>
    <button class="place-bet-btn" id="placeBetBtn">Сделать ставку</button>
    <div id="messageArea" class="toast" style="display: none;"></div>
  </div>

  <div class="footer-small">SkyRed • 18+ • Ставки на Standoff 2</div>
</div>

<script>
  (function() {
    // === состояние ===
    let balance = 20000;
    const INITIAL_BALANCE = 20000;
    let selectedBets = []; // [{ matchId, outcome, odds, label }]

    const balanceEl = document.getElementById('balanceDisplay');
    const cuponItemsEl = document.getElementById('cuponItems');
    const totalOddsEl = document.getElementById('totalOddsDisplay');
    const placeBetBtn = document.getElementById('placeBetBtn');
    const clearBtn = document.getElementById('clearCouponBtn');
    const messageEl = document.getElementById('messageArea');

    // обновить баланс на экране
    function updateBalanceUI() {
      balanceEl.textContent = balance.toLocaleString('ru-RU');
    }

    // обновить купон
    function renderCoupon() {
      if (selectedBets.length === 0) {
        cuponItemsEl.innerHTML = `<div style="color: #5c6e94; font-size: 14px; padding: 6px 0;">Выберите коэффициент</div>`;
        totalOddsEl.textContent = '—';
        placeBetBtn.disabled = true;
        return;
      }

      let html = '';
      let totalOdds = 1;
      selectedBets.forEach((bet, idx) => {
        totalOdds *= bet.odds;
        const label = bet.label || `${bet.outcome === 'team1' ? 'П1' : 'П2'}`;
        html += `
          <div class="cupon-item">
            <span>${label} (${bet.odds.toFixed(2)})</span>
            <span class="remove" data-index="${idx}">✕</span>
          </div>
        `;
      });
      cuponItemsEl.innerHTML = html;
      totalOddsEl.textContent = totalOdds.toFixed(2);

      // обработчики удаления
      document.querySelectorAll('.cupon-item .remove').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const idx = parseInt(this.dataset.index, 10);
          if (!isNaN(idx)) {
            selectedBets.splice(idx, 1);
            renderCoupon();
            showMessage('Ставка удалена из купона', '#b8e45c');
          }
        });
      });

      placeBetBtn.disabled = false;
    }

    // показать сообщение
    function showMessage(text, color = '#b8e45c') {
      messageEl.style.display = 'block';
      messageEl.textContent = text;
      messageEl.style.borderLeftColor = color || '#b8e45c';
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    // добавить ставку в купон
    function addBet(matchId, outcome, odds, label) {
      // проверка на дубликат (матч + исход)
      const exists = selectedBets.some(b => b.matchId === matchId && b.outcome === outcome);
      if (exists) {
        showMessage('Этот исход уже добавлен в купон', '#e57373');
        return false;
      }

      selectedBets.push({ matchId, outcome, odds, label });
      renderCoupon();
      showMessage(`Добавлено: ${label} (${odds.toFixed(2)})`, '#b8e45c');
      return true;
    }

    // обработчики на кнопки коэффициентов
    document.querySelectorAll('.odds-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const matchId = this.dataset.match;
        const outcome = this.dataset.outcome;
        const odds = parseFloat(this.dataset.odds);
        // формируем читаемый label
        const teamSpan = this.textContent.trim().split(' ')[0];
        const label = `${teamSpan} (${odds.toFixed(2)})`;
        addBet(matchId, outcome, odds, label);
      });
    });

    // очистка купона
    clearBtn.addEventListener('click', function() {
      selectedBets = [];
      renderCoupon();
      showMessage('Купон очищен', '#8d9fc7');
    });

    // === СТАВКА ===
    placeBetBtn.addEventListener('click', function() {
      if (selectedBets.length === 0) {
        showMessage('Добавьте хотя бы одну ставку', '#e57373');
        return;
      }

      // вычисляем общий коэффициент
      let totalOdds = 1;
      selectedBets.forEach(b => totalOdds *= b.odds);
      // минимальная ставка 100 (имитация)
      const betAmount = 100;
      if (balance < betAmount) {
        showMessage(`Недостаточно средств. Нужно ${betAmount} ₽`, '#e57373');
        return;
      }

      // выигрыш (условно)
      const winAmount = Math.round(betAmount * totalOdds);
      // списываем ставку
      balance -= betAmount;
      updateBalanceUI();

      // Иммитация "ставка принята" и начисление выигрыша (для теста всегда выигрыш)
      const win = winAmount;
      balance += win;
      updateBalanceUI();

      // сообщение
      const betDetails = selectedBets.map(b => b.label).join(' + ');
      showMessage(`✅ Ставка принята! Выигрыш: ${win} ₽ (коэф. ${totalOdds.toFixed(2)})`, '#b8e45c');

      // очищаем купон после ставки
      selectedBets = [];
      renderCoupon();
    });

    // инициализация
    updateBalanceUI();
    renderCoupon();

    // возможность сброса баланса (скрытая функция для теста) — двойной клик по балансу
    balanceEl.addEventListener('dblclick', function() {
      balance = INITIAL_BALANCE;
      updateBalanceUI();
      showMessage('Баланс сброшен до 20 000 ₽', '#b8e45c');
    });

  })();
</script>
</body>
</html>
