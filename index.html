<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0a0e1a;padding:12px}
        #bg-3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 30% 40%,#1a3a6a 0%,#0a0e1a 70%);overflow:hidden;pointer-events:none}
        .sphere{position:absolute;border-radius:50%;filter:blur(60px);opacity:.25;animation:floatSphere 20s ease-in-out infinite alternate}
        .sphere:nth-child(1){width:500px;height:500px;top:-100px;right:-100px;background:radial-gradient(circle,#4a8af4,#1a3a7a);animation-duration:25s}
        .sphere:nth-child(2){width:400px;height:400px;bottom:-100px;left:-100px;background:radial-gradient(circle,#6aafff,#2a5a9a);animation-duration:20s;animation-delay:-5s}
        .sphere:nth-child(3){width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#8ac4ff,#3a6aaa);animation-duration:30s;animation-delay:-10s;opacity:.15}
        @keyframes floatSphere{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,-40px) scale(1.2)}}
        
        .app{position:relative;z-index:1;max-width:420px;width:100%;padding:8px 8px 80px}
        
        .header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:12px}
        .header-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .username{color:#fff;font-size:15px;font-weight:600}
        .online-status{display:flex;align-items:center;gap:4px;color:#6f8f9f;font-size:11px}
        .online-dot{width:5px;height:5px;background:#4ade80;border-radius:50%;display:inline-block}
        .wins{color:#6f8f9f;font-size:11px}
        .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f7e05e,#ff8a2a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0a0e1a;overflow:hidden;flex-shrink:0}
        .avatar img{width:100%;height:100%;object-fit:cover}
        
        .balance-block{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
        .balance-left{display:flex;flex-direction:column}
        .balance-label{color:#8a9bb5;font-size:12px}
        .balance-amount{color:#fff;font-size:22px;font-weight:800}
        .balance-actions{display:flex;gap:6px}
        .btn-gold{background:linear-gradient(135deg,#f7d875,#e8b42b);border:none;padding:6px 14px;border-radius:30px;font-weight:700;font-size:12px;color:#0a0e1a;cursor:pointer}
        .btn-gold:active{transform:scale(.95)}
        .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:30px;font-weight:600;font-size:12px;color:#d6e0ff;cursor:pointer}
        .btn-outline:active{transform:scale(.95)}
        
        .menu-title{color:#aec0ff;font-size:13px;font-weight:600;margin-bottom:8px}
        .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
        .menu-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 4px;text-align:center;color:#aec0ff;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
        .menu-item:active{transform:scale(.95);background:rgba(255,255,255,.06)}
        .menu-item .icon{font-size:18px;display:block;margin-bottom:3px;filter:brightness(0) invert(1);opacity:.6}
        
        .page{display:none}
        .page.active{display:block}
        
        /* DICE */
        .dice-page{display:none;padding:6px 0}
        .dice-page.active{display:block}
        .dice-back{color:#4a8af4;font-size:13px;cursor:pointer;margin-bottom:6px;display:inline-block}
        .dice-title{color:#fff;font-size:20px;font-weight:700;text-align:center;margin:6px 0}
        .dice-timer{text-align:center;font-size:15px;color:#4ade80;padding:6px;background:rgba(74,222,128,.08);border-radius:8px;margin:6px 0}
        .dice-timer span{font-size:20px;color:#f7e05e}
        .dice-box{display:flex;justify-content:center;gap:16px;margin:10px 0}
        .dice{width:60px;height:60px;background:linear-gradient(135deg,#1a2a5a,#2a4a8a);border:2px solid rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
        .dice.rolling{animation:rollDice .8s ease-in-out}
        @keyframes rollDice{0%{transform:rotate(0)}50%{transform:rotate(360deg)}100%{transform:rotate(720deg)}}
        .dice-result{text-align:center;color:#f7e05e;font-size:17px;font-weight:700;min-height:26px}
        .dice-bet-options{display:flex;gap:8px;margin:6px 0}
        .dice-bet-option{flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
        .dice-bet-option.active{border-color:#f7e05e;background:rgba(255,215,0,.08);color:#f7e05e}
        .dice-bet-option:disabled{opacity:.4;cursor:not-allowed}
        .dice-input-group{display:flex;gap:6px;margin:6px 0}
        .dice-input-group input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
        .dice-input-group input:disabled{opacity:.4}
        .dice-input-group button{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:12px;cursor:pointer}
        .dice-input-group button:disabled{opacity:.4;cursor:not-allowed}
        .dice-place-btn{width:100%;padding:10px;border-radius:10px;border:none;background:gold;color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
        .dice-place-btn:disabled{opacity:.4;cursor:not-allowed}
        .dice-bets{background:rgba(255,255,255,.02);border-radius:8px;padding:8px;max-height:120px;overflow-y:auto;margin-top:6px}
        .dice-bet-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02);color:#aec0ff;font-size:11px}
        .dice-bet-item .win{color:#4ade80}
        .dice-bet-item .lose{color:#ff6b6b}
        .dice-bet-item .pending{color:#f7e05e}
        
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:420px;width:100%;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;padding:6px 16px 14px;z-index:40;border-top:1px solid rgba(255,255,255,.04)}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:none;color:#6f8f9f;font-size:10px;cursor:pointer;padding:4px 8px}
        .nav-item .icon{font-size:18px;filter:brightness(.7) invert(.9);opacity:.6}
        .nav-item.active{color:#f7e05e}
        .nav-item.active .icon{filter:none;opacity:1}
        .nav-center{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#4a8af4,#2a5a9a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:-20px;box-shadow:0 4px 20px rgba(74,138,244,.3);border:3px solid rgba(255,255,255,.08);cursor:pointer}
        .nav-center:active{transform:scale(.92)}
        .nav-center.active{background:linear-gradient(135deg,#f7e05e,#e8b42b);box-shadow:0 4px 20px rgba(247,224,94,.3)}
        
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;display:none;justify-content:center;align-items:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:rgba(20,30,60,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px 20px;max-width:340px;width:100%}
        .modal-title{color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:12px}
        .modal-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:15px;outline:none;text-align:center;text-transform:uppercase}
        .modal-input:focus{border-color:#4a8af4}
        .modal-buttons{display:flex;gap:10px;margin-top:12px}
        .modal-btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
        .modal-btn:active{transform:scale(.95)}
        .modal-btn-primary{background:linear-gradient(135deg,#4a8af4,#2a5a9a);color:#fff}
        .modal-btn-secondary{background:rgba(255,255,255,.06);color:#c8d6ff;border:1px solid rgba(255,255,255,.08)}
        .result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:200;display:none;justify-content:center;align-items:center;padding:20px}
        .result-modal.active{display:flex}
        .result-box{text-align:center}
        .result-icon{font-size:56px;margin-bottom:10px}
        .result-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
        .result-title.win{color:#4ade80}
        .result-title.lose{color:#ff6b6b}
        .result-amount{color:#f7e05e;font-size:15px;margin-bottom:14px}
        .result-btn{padding:10px 30px;border:none;border-radius:30px;background:gold;color:#000;font-weight:700;font-size:14px;cursor:pointer}
    </style>
</head>
<body>
    <div id="bg-3d"><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div></div>
    
    <div class="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <span class="username" id="userName">hamster</span>
                <span class="online-status"><span class="online-dot"></span>online • 51</span>
                <span class="wins">0 W</span>
            </div>
            <div class="avatar" id="userAvatar">🐹</div>
        </div>
        
        <!-- BALANCE -->
        <div class="balance-block">
            <div class="balance-left">
                <div class="balance-label">BetCoin</div>
                <div class="balance-amount" id="balanceDisplay">0</div>
            </div>
            <div class="balance-actions">
                <button class="btn-gold" id="getBtn">+ Получить</button>
                <button class="btn-outline" id="buyBtn">Купить</button>
            </div>
        </div>
        
        <!-- HOME -->
        <div class="page active" id="pageHome">
            <div class="menu-title">Управление</div>
            <div class="menu-grid">
                <div class="menu-item" onclick="alert('Профиль')"><span class="icon">👤</span>Профиль</div>
                <div class="menu-item" onclick="alert('Инвентарь')"><span class="icon">📦</span>Инвентарь</div>
                <div class="menu-item" onclick="alert('Сервис')"><span class="icon">⚙️</span>Сервис</div>
                <div class="menu-item" onclick="openPromo()"><span class="icon">🎁</span>Промо</div>
            </div>
        </div>
        
        <!-- DICE -->
        <div class="dice-page" id="dicePage">
            <div class="dice-back" onclick="closeDice()">← Назад</div>
            <div class="dice-title">🎲 Dice</div>
            
            <div class="dice-timer">⏳ Раунд: <span id="timerDisplay">12</span>s</div>
            
            <div class="dice-box">
                <div class="dice" id="dice1">⚀</div>
                <div class="dice" id="dice2">⚀</div>
            </div>
            <div class="dice-result" id="diceResult">Результат: ?</div>
            
            <div class="dice-bet-options">
                <button class="dice-bet-option active" data-bet="under" onclick="setBet('under')">⟨ 7</button>
                <button class="dice-bet-option" data-bet="over" onclick="setBet('over')">7 ⟩</button>
            </div>
            
            <div class="dice-input-group">
                <input id="betInput" type="number" value="100" min="1" />
                <button onclick="document.getElementById('betInput').value=Math.floor(balance/2)">1/2</button>
                <button onclick="document.getElementById('betInput').value=balance">Max</button>
            </div>
            
            <button class="dice-place-btn" id="placeBtn" onclick="placeBet()">🎲 Сделать ставку</button>
            
            <div style="color:#8a9bb5;font-size:11px;margin-top:6px">Ставки игроков</div>
            <div class="dice-bets" id="betsList">
                <div class="dice-bet-item"><span>Нет ставок</span><span></span></div>
            </div>
        </div>
        
        <!-- NAV -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="goHome()" data-page="pageHome">
                <span class="icon">🏠</span><span>Главная</span>
            </button>
            <div class="nav-center" onclick="openDice()" id="gameBtn">🎲</div>
            <button class="nav-item" onclick="alert('Настройки')">
                <span class="icon">⚙️</span><span>Настройки</span>
            </button>
        </div>
    </div>
    
    <!-- PROMO -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" maxlength="20" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="applyPromo()">Активировать</button>
            </div>
        </div>
    </div>
    
    <!-- RESULT -->
    <div class="result-modal" id="resultModal">
        <div class="result-box">
            <div class="result-icon" id="resIcon">🎉</div>
            <div class="result-title" id="resTitle">Вы выиграли!</div>
            <div class="result-amount" id="resAmount">+0 BetCoin</div>
            <button class="result-btn" onclick="closeResult()">Продолжить</button>
        </div>
    </div>

    <script>
        // ===== TELEGRAM =====
        let tgUser = null;
        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
            }
        } catch(e) {}
        if (!tgUser) tgUser = { id: 'demo', first_name: 'Тест' };

        const userId = tgUser.id.toString();
        let balance = 0;
        let betType = 'under';
        let timerInterval = null;
        let seconds = 12;
        let isRolling = false;

        // ===== SUPABASE =====
        const SB_URL = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';

        // ===== DOM =====
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            const name = tgUser.first_name || 'Игрок';
            userName.textContent = name;
            userAvatar.textContent = name.charAt(0).toUpperCase();
        }

        // ===== LOAD USER =====
        async function loadUser() {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/users?id=eq.${userId}&select=*`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const data = await res.json();
                if (data.length === 0) {
                    await fetch(`${SB_URL}/rest/v1/users`, {
                        method: 'POST',
                        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: userId, name: tgUser.first_name || 'Игрок', balance: 5000 })
                    });
                    balance = 5000;
                } else {
                    balance = data[0].balance || 0;
                }
                updateUI();
            } catch(e) { balance = 5000; updateUI(); }
        }

        async function saveBalance(val) {
            try {
                await fetch(`${SB_URL}/rest/v1/users?id=eq.${userId}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: val })
                });
                balance = val;
                updateUI();
            } catch(e) {}
        }

        // ===== NAV =====
        function goHome() {
            document.getElementById('dicePage').classList.remove('active');
            document.getElementById('pageHome').classList.add('active');
            document.getElementById('gameBtn').classList.remove('active');
            document.querySelector('.nav-item.active')?.classList.remove('active');
            document.querySelector('.nav-item:first-child')?.classList.add('active');
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function openDice() {
            document.getElementById('pageHome').classList.remove('active');
            document.getElementById('dicePage').classList.add('active');
            document.getElementById('gameBtn').classList.add('active');
            document.querySelector('.nav-item.active')?.classList.remove('active');
            loadBets();
            if (!timerInterval) startTimer();
        }

        function closeDice() { goHome(); }

        // ===== BET =====
        function setBet(type) {
            betType = type;
            document.querySelectorAll('.dice-bet-option').forEach(b => b.classList.remove('active'));
            document.querySelector(`.dice-bet-option[data-bet="${type}"]`).classList.add('active');
        }

        // ===== TIMER =====
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 12;
            isRolling = false;
            document.getElementById('placeBtn').disabled = false;
            document.getElementById('timerDisplay').textContent = seconds;
            document.querySelector('.dice-timer').style.color = '#4ade80';
            
            timerInterval = setInterval(() => {
                seconds--;
                document.getElementById('timerDisplay').textContent = seconds;
                if (seconds <= 3) document.querySelector('.dice-timer').style.color = '#ff6b6b';
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    rollDice();
                }
            }, 1000);
        }

        // ===== ROLL DICE =====
        async function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('placeBtn').disabled = true;
            document.querySelector('.dice-timer').innerHTML = '🎲 Бросок...';
            
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const result = d1 + d2;
            const dots = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            dice1.textContent = dots[d1-1];
            dice2.textContent = dots[d2-1];
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');
            
            setTimeout(() => {
                dice1.classList.remove('rolling');
                dice2.classList.remove('rolling');
            }, 800);
            
            document.getElementById('diceResult').textContent = `Результат: ${result} (${d1}+${d2})`;
            
            await processBets(result);
            await loadBets();
            
            setTimeout(() => {
                isRolling = false;
                document.querySelector('.dice-timer').innerHTML = '⏳ Раунд: <span id="timerDisplay">12</span>s';
                startTimer();
            }, 1000);
        }

        // ===== PROCESS BETS =====
        async function processBets(result) {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/bets?game=eq.Dice&result=eq.pending&order=created_at.asc&limit=50`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const bets = await res.json();
                
                for (const bet of bets) {
                    const win = (bet.detail === 'under') ? result < 7 : result > 7;
                    const winAmount = win ? bet.amount * 2 : 0;
                    
                    await fetch(`${SB_URL}/rest/v1/bets?id=eq.${bet.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            result: win ? 'win' : 'lose',
                            win_amount: winAmount,
                            coefficient: 2
                        })
                    });
                    
                    if (win) {
                        const uRes = await fetch(`${SB_URL}/rest/v1/users?id=eq.${bet.user_id}&select=balance`, {
                            headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                        });
                        const uData = await uRes.json();
                        if (uData.length > 0) {
                            const newBal = uData[0].balance - bet.amount + winAmount;
                            await fetch(`${SB_URL}/rest/v1/users?id=eq.${bet.user_id}`, {
                                method: 'PATCH',
                                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ balance: newBal })
                            });
                            if (bet.user_id === userId) {
                                balance = newBal;
                                updateUI();
                            }
                        }
                    }
                }
            } catch(e) { console.error(e); }
        }

        // ===== PLACE BET =====
        async function placeBet() {
            if (isRolling) { alert('⏳ Раунд идет!'); return; }
            if (seconds < 3) { alert('⏳ Раунд скоро закончится!'); return; }
            
            const amount = parseInt(document.getElementById('betInput').value);
            if (!amount || amount <= 0) { alert('❌ Введите сумму!'); return; }
            if (amount > balance) { alert('❌ Недостаточно средств!'); return; }
            
            await saveBalance(balance - amount);
            
            try {
                await fetch(`${SB_URL}/rest/v1/bets`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: tgUser.first_name || 'Игрок',
                        amount: amount,
                        game: 'Dice',
                        result: 'pending',
                        win_amount: 0,
                        coefficient: 0,
                        detail: betType
                    })
                });
                loadBets();
            } catch(e) {
                await saveBalance(balance + amount);
                alert('❌ Ошибка!');
            }
        }

        // ===== LOAD BETS =====
        async function loadBets() {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/bets?game=eq.Dice&order=created_at.desc&limit=15`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const bets = await res.json();
                const container = document.getElementById('betsList');
                if (!bets || bets.length === 0) {
                    container.innerHTML = '<div class="dice-bet-item"><span>Нет ставок</span><span></span></div>';
                    return;
                }
                container.innerHTML = bets.map(b => {
                    let status = '', cls = '';
                    if (b.result === 'win') { status = '+' + b.win_amount + ' (x2)'; cls = 'win'; }
                    else if (b.result === 'lose') { status = '-' + b.amount; cls = 'lose'; }
                    else { status = '⏳ Ожидание'; cls = 'pending'; }
                    const detail = b.detail === 'under' ? '⟨7' : b.detail === 'over' ? '7⟩' : '';
                    return `<div class="dice-bet-item">
                        <span>${b.user_name || 'Игрок'} • ${b.amount} ${detail}</span>
                        <span class="${cls}">${status}</span>
                    </div>`;
                }).join('');
            } catch(e) {}
        }

        // ===== BUTTONS =====
        document.getElementById('getBtn').onclick = function() { saveBalance(balance + 500); alert('✅ +500 BetCoin!'); };
        document.getElementById('buyBtn').onclick = function() {
            const amount = prompt('💰 Сумма:', '1000');
            if (amount) { const c = parseInt(amount); if (c > 0) { saveBalance(balance + c); alert('✅ +' + c + ' BetCoin!'); } }
        };

        // ===== PROMO =====
        function openPromo() { document.getElementById('promoModal').classList.add('active'); }
        function closePromo() { document.getElementById('promoModal').classList.remove('active'); }
        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            if (!code) { alert('❌ Введите код!'); return; }
            const codes = { 'BETCOIN': 10000 };
            if (codes[code]) {
                saveBalance(balance + codes[code]);
                alert('🎉 +' + codes[code] + ' BetCoin!');
                closePromo();
            } else { alert('❌ Неверный код!'); }
        }

        // ===== RESULT =====
        function closeResult() { document.getElementById('resultModal').classList.remove('active'); }

        window.showResult = function(win, amount) {
            document.getElementById('resIcon').textContent = win ? '🎉' : '😔';
            document.getElementById('resTitle').textContent = win ? 'Вы выиграли!' : 'Вы проиграли!';
            document.getElementById('resTitle').className = 'result-title ' + (win ? 'win' : 'lose');
            document.getElementById('resAmount').textContent = win ? '+' + amount + ' BetCoin' : 'Попробуйте снова!';
            document.getElementById('resultModal').classList.add('active');
        };

        // ===== INIT =====
        loadUser();

        window.goHome = goHome;
        window.openDice = openDice;
        window.closeDice = closeDice;
        window.setBet = setBet;
        window.placeBet = placeBet;
        window.openPromo = openPromo;
        window.closePromo = closePromo;
        window.applyPromo = applyPromo;
        window.closeResult = closeResult;
    </script>
</body>
</html>
