<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARTUP PLATFORM · профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== ФОН ===== */
    body {
      min-height: 100vh;
      background-color: #0a0705;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255, 120, 0, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 90, 0, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 70% 15%, rgba(255, 150, 0, 0.10) 0%, transparent 40%),
        linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
      background-attachment: fixed;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.5rem 7rem 1.5rem;
      color: #ffeadb;
    }

    /* ===== КАРТОЧКА ===== */
    .card {
      max-width: 880px;
      width: 100%;
      background: rgba(12, 8, 5, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 130, 0, 0.35);
      border-radius: 40px;
      padding: 2.2rem 2.25rem 2rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(255, 160, 40, 0.08) inset,
        0 30px 70px -25px #000,
        0 0 60px rgba(255, 110, 0, 0.10);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -120px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 120, 0, 0.18), transparent 70%);
      pointer-events: none;
    }

    /* ===== НАЗВАНИЕ ПРОЕКТА ===== */
    .project-title {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #ff8a00;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.75);
      margin-bottom: 1.8rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 130, 0, 0.18);
      position: relative;
      z-index: 1;
    }

    /* ===== ШАПКА ===== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      border: 3px solid #ffb347;
      box-shadow:
        0 0 0 3px rgba(255, 140, 0, 0.25),
        0 0 30px rgba(255, 120, 0, 0.55),
        0 8px 20px -6px #000;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #3a1400;
      text-shadow: 0 0 10px rgba(255, 220, 150, 0.6);
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      text-transform: uppercase;
    }

    .nickname {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow:
        0 0 18px rgba(255, 140, 0, 0.85),
        0 0 40px rgba(255, 90, 0, 0.55);
      line-height: 1.1;
      word-break: break-word;
    }

    .nickname .at {
      color: #ff8a00;
      text-shadow: 0 0 14px rgba(255, 140, 0, 0.9);
    }

    /* ===== БАЛАНС ===== */
    .balance-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      background: linear-gradient(135deg, rgba(40, 20, 5, 0.9), rgba(20, 10, 3, 0.9));
      border-radius: 100px;
      padding: 0.9rem 2rem;
      margin: 0 auto 2rem auto;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 140, 0, 0.45);
      box-shadow:
        0 0 30px rgba(255, 120, 0, 0.18),
        inset 0 0 24px rgba(255, 120, 0, 0.06);
      position: relative;
      z-index: 1;
    }

    .coin-css {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffc266 0%, #ff8a00 45%, #c74a00 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 2px #7a2e00,
        0 0 14px rgba(255, 140, 0, 0.9),
        0 4px 0 #8a3600,
        0 6px 12px rgba(0, 0, 0, 0.7);
      position: relative;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .coin-css::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #fff6d8, rgba(255, 230, 150, 0));
      border-radius: 50%;
      top: 4px;
      left: 5px;
      filter: blur(0.5px);
    }

    .coin-css::after {
      content: "";
      width: 12px;
      height: 12px;
      background: #3a1400;
      clip-path: polygon(
        60% 0%, 100% 0%, 100% 18%, 45% 18%,
        45% 38%, 100% 38%, 100% 100%, 0% 100%,
        0% 82%, 55% 82%, 55% 62%, 0% 62%, 0% 0%
      );
      filter: drop-shadow(0 0 3px rgba(255, 200, 100, 0.5));
      opacity: 0.9;
    }

    .balance-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.9);
      letter-spacing: 0.02em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    /* ===== СТАТИСТИКА ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      margin-bottom: 1.8rem;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      background: linear-gradient(160deg, rgba(35, 18, 5, 0.9), rgba(15, 8, 2, 0.9));
      border-radius: 22px;
      padding: 1.3rem 0.5rem;
      text-align: center;
      border: 1px solid rgba(255, 140, 0, 0.30);
      box-shadow:
        0 10px 24px -12px #000,
        inset 0 1px 0 rgba(255, 180, 80, 0.08);
      transition: all 0.25s ease;
    }

    .stat-item:hover {
      border-color: rgba(255, 160, 40, 0.75);
      box-shadow:
        0 0 28px rgba(255, 130, 0, 0.28),
        inset 0 1px 0 rgba(255, 180, 80, 0.15);
      transform: translateY(-3px);
    }

    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: #c98a4e;
      margin-bottom: 0.55rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }

    /* ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== */
    .win-loss-row {
      display: flex;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .wl-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1.1rem 1rem;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.7rem;
      letter-spacing: 0.02em;
      border: 1.5px solid;
      transition: all 0.25s ease;
    }

    .wl-block.wins {
      border-color: #22c55e;
      color: #4ade80;
      background: linear-gradient(145deg, rgba(20, 60, 35, 0.55), rgba(8, 30, 18, 0.55));
      box-shadow:
        0 0 26px rgba(34, 197, 94, 0.28),
        inset 0 0 20px rgba(34, 197, 94, 0.08);
      text-shadow: 0 0 16px rgba(74, 222, 128, 0.8);
    }

    .wl-block.wins:hover {
      box-shadow:
        0 0 44px rgba(34, 197, 94, 0.55),
        inset 0 0 26px rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }

    .wl-block.losses {
      border-color: #ef4444;
      color: #f87171;
      background: linear-gradient(145deg, rgba(70, 15, 20, 0.55), rgba(35, 8, 10, 0.55));
      box-shadow:
        0 0 26px rgba(239, 68, 68, 0.28),
        inset 0 0 20px rgba(239, 68, 68, 0.08);
      text-shadow: 0 0 16px rgba(248, 113, 113, 0.8);
    }

    .wl-block.losses:hover {
      box-shadow:
        0 0 44px rgba(239, 68, 68, 0.55),
        inset 0 0 26px rgba(239, 68, 68, 0.15);
      transform: translateY(-2px);
    }

    .wl-label {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.14em;
      opacity: 0.95;
    }

    .wl-icon {
      width: 34px;
      height: 34px;
      position: relative;
      flex-shrink: 0;
      display: inline-block;
    }

    .win-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #4ade80, #16a34a);
      clip-path: polygon(50% 0%, 100% 22%, 100% 65%, 50% 100%, 0% 65%, 0% 22%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.9);
    }

    .win-icon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 8px;
      border-left: 3px solid #052e16;
      border-bottom: 3px solid #052e16;
      transform: rotate(-45deg);
      top: 11px;
      left: 9px;
    }

    .loss-icon::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      background: linear-gradient(160deg, #f87171, #b91c1c);
      border-radius: 6px;
      top: 4px;
      left: 4px;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
    }

    .loss-icon::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 6px;
      background: #2a0505;
      border-radius: 3px;
      top: 14px;
      left: 4px;
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }

    /* ===== ФИКСИРОВАННАЯ НИЖНЯЯ НАВИГАЦИЯ ===== */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      width: calc(100% - 3rem);
      max-width: 640px;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;

      padding: 0.7rem 1.1rem;
      background: rgba(14, 9, 4, 0.88);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border: 1px solid rgba(255, 140, 0, 0.38);
      border-radius: 100px;

      box-shadow:
        0 -6px 30px -8px rgba(255, 110, 0, 0.35),
        0 20px 45px -20px #000,
        inset 0 1px 0 rgba(255, 180, 90, 0.15);
    }

    /* ===== ПУНКТ НАВИГАЦИИ ===== */
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      color: #a3621d;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0.3rem 0.2rem;
      user-select: none;
      background: transparent;
      border: none;
      font-family: inherit;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item:hover {
      color: #ffa84d;
    }

    .nav-item.active {
      color: #ff9d33;
      text-shadow: 0 0 14px rgba(255, 140, 0, 0.9);
    }

    /* ===== ИКОНКА ===== */
    .nav-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(160deg, rgba(40, 20, 5, 0.95), rgba(15, 8, 2, 0.95));
      border: 1.5px solid rgba(255, 140, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item.active .nav-icon {
      border-color: #ff8a00;
      box-shadow:
        0 0 0 2px rgba(255, 140, 0, 0.35),
        0 0 22px rgba(255, 140, 0, 0.75),
        inset 0 0 14px rgba(255, 140, 0, 0.28);
      transform: translateY(-2px);
    }

    .nav-item:hover .nav-icon {
      border-color: rgba(255, 160, 40, 0.8);
    }

    /* ===== ИКОНКА «ПРОФИЛЬ» ===== */
    .icon-profile::before {
      content: "";
      width: 11px;
      height: 11px;
      background: currentColor;
      border-radius: 50%;
      position: absolute;
      top: 9px;
      transition: all 0.28s;
      box-shadow: 0 0 8px rgba(255, 140, 0, 0.7);
    }

    .icon-profile::after {
      content: "";
      width: 20px;
      height: 11px;
      background: currentColor;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      position: absolute;
      bottom: 10px;
      transition: all 0.28s;
      box-shadow: 0 0 8px rgba(255, 140, 0, 0.7);
    }

    /* ===== ИКОНКА «МАГАЗИН» ===== */
    .icon-shop::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 16px;
      background: currentColor;
      border-radius: 4px 4px 6px 6px;
      top: 18px;
      transition: all 0.28s;
      box-shadow: 0 0 8px rgba(255, 140, 0, 0.7);
    }

    .icon-shop::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 8px;
      border: 2.5px solid currentColor;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      top: 10px;
      transition: all 0.28s;
    }

    /* ===== ЦЕНТРАЛЬНАЯ КНОПКА «ИГРЫ» ===== */
    .nav-item.nav-center {
      flex: 0 0 auto;
      padding: 0;
    }

    .nav-center .nav-icon {
      width: 64px;
      height: 64px;
      margin-top: -26px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffb347 0%, #ff8a00 45%, #b13a00 100%);
      border: 3px solid #ffd08a;
      box-shadow:
        0 0 0 4px rgba(255, 140, 0, 0.22),
        0 0 38px rgba(255, 130, 0, 0.85),
        0 12px 24px -8px #000,
        inset 0 0 22px rgba(255, 220, 150, 0.28);
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      color: #2a1400; /* цвет для CSS-эмодзи внутри */
    }

    .nav-center .nav-icon:hover {
      box-shadow:
        0 0 0 4px rgba(255, 160, 40, 0.38),
        0 0 55px rgba(255, 150, 20, 1),
        0 12px 28px -8px #000,
        inset 0 0 26px rgba(255, 230, 170, 0.4);
      transform: translateY(-3px);
    }

    .nav-center.active .nav-icon {
      box-shadow:
        0 0 0 4px rgba(255, 180, 60, 0.5),
        0 0 60px rgba(255, 160, 30, 1),
        0 12px 28px -8px #000,
        inset 0 0 30px rgba(255, 240, 190, 0.45);
    }

    .nav-center .nav-label {
      margin-top: 0.3rem;
    }

    /* ===== CSS-ЭМОДЗИ «ИГРЫ» — полноценный геймпад ===== */
    .icon-games {
      /* корпус геймпада */
    }

    /* Верхняя часть корпуса */
    .icon-games::before {
      content: "";
      position: absolute;
      width: 40px;
      height: 22px;
      background: #2a1400;
      border-radius: 14px 14px 8px 8px / 12px 12px 6px 6px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 12px rgba(255, 210, 130, 0.65),
        inset 0 0 8px rgba(255, 160, 40, 0.35);
    }

    /* Нижняя часть корпуса (рукоятки) */
    .icon-games::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 15px;
      background: #2a1400;
      border-radius: 6px 6px 16px 16px / 4px 4px 14px 14px;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow:
        0 0 10px rgba(255, 200, 100, 0.5),
        inset 0 0 6px rgba(255, 160, 40, 0.3);
    }

    /* D-pad (крестовина слева) — через отдельный псевдо-элемент обёртки */
    .icon-games-dpad {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #ffb347;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translate(-13px, -1px);
      clip-path: polygon(
        35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%,
        65% 65%, 65% 100%, 35% 100%, 35% 65%,
        0% 65%, 0% 35%, 35% 35%
      );
      box-shadow: 0 0 8px rgba(255, 180, 60, 0.95);
      z-index: 2;
      border-radius: 1px;
    }

    /* Кнопки справа (A/B/X/Y) */
    .icon-games-buttons {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translate(12px, -1px);
      width: 12px;
      height: 12px;
      z-index: 2;
    }

    .icon-games-buttons::before {
      content: "";
      position: absolute;
      width: 4.5px;
      height: 4.5px;
      background: #ffb347;
      border-radius: 50%;
      top: 0;
      left: 0;
      box-shadow: 0 0 7px rgba(255, 180, 60, 0.95);
    }

    .icon-games-buttons::after {
      content: "";
      position: absolute;
      width: 4.5px;
      height: 4.5px;
      background: #ffb347;
      border-radius: 50%;
      bottom: 0;
      right: 0;
      box-shadow: 0 0 7px rgba(255, 180, 60, 0.95);
    }

    /* дополнительные «кнопки» через вложенный span */
    .icon-games-extra {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translate(12px, -1px);
      width: 12px;
      height: 12px;
      z-index: 2;
    }

    .icon-games-extra::before {
      content: "";
      position: absolute;
      width: 4.5px;
      height: 4.5px;
      background: #ffb347;
      border-radius: 50%;
      top: 0;
      right: 0;
      box-shadow: 0 0 7px rgba(255, 180, 60, 0.95);
    }

    .icon-games-extra::after {
      content: "";
      position: absolute;
      width: 4.5px;
      height: 4.5px;
      background: #ffb347;
      border-radius: 50%;
      bottom: 0;
      left: 0;
      box-shadow: 0 0 7px rgba(255, 180, 60, 0.95);
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 640px) {
      body { padding: 1.2rem 1rem 6.5rem 1rem; }
      .card { padding: 1.6rem 1.3rem 1.6rem 1.3rem; border-radius: 30px; }
      .avatar { width: 66px; height: 66px; }
      .nickname { font-size: 1.7rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.9rem; }
      .balance-value { font-size: 1.8rem; }
      .balance-section { padding: 0.8rem 1.5rem; }
      .wl-block { font-size: 1.3rem; gap: 0.6rem; padding: 0.9rem 0.7rem; }
      .wl-label { font-size: 0.82rem; letter-spacing: 0.08em; }
      .wl-icon { width: 28px; height: 28px; }
      .win-icon::after { top: 9px; left: 7px; }
      .loss-icon::before { width: 22px; height: 22px; top: 3px; left: 3px; }
      .loss-icon::after { width: 22px; height: 5px; top: 12px; left: 3px; }
      .project-title { font-size: 0.8rem; letter-spacing: 0.3em; }

      .bottom-nav {
        width: calc(100% - 2rem);
        padding: 0.6rem 0.9rem;
        bottom: 1rem;
      }

      .nav-icon { width: 38px; height: 38px; }
      .nav-center .nav-icon { width: 58px; height: 58px; margin-top: -22px; }
      .icon-games::before { width: 36px; height: 20px; }
      .icon-games::after { width: 38px; height: 13px; bottom: 11px; }
      .icon-games-dpad { transform: translate(-50%, -50%) translate(-12px, -1px); }
      .icon-games-buttons,
      .icon-games-extra { transform: translate(-50%, -50%) translate(11px, -1px); }
    }

    @media (max-width: 420px) {
      .stats-grid { gap: 0.6rem; }
      .stat-value { font-size: 1.6rem; }
      .nickname { font-size: 1.4rem; }
      .balance-section { padding: 0.8rem 1.2rem; max-width: 320px; }
      .wl-label { display: none; }

      .bottom-nav { padding: 0.55rem 0.7rem; }
      .nav-item { font-size: 0.58rem; letter-spacing: 0.1em; }
      .nav-icon { width: 34px; height: 34px; }
      .nav-center .nav-icon { width: 54px; height: 54px; margin-top: -20px; }

      .icon-profile::before { width: 9px; height: 9px; top: 8px; }
      .icon-profile::after { width: 17px; height: 9px; bottom: 8px; }
      .icon-shop::before { width: 19px; height: 14px; top: 15px; }
      .icon-shop::after { width: 11px; height: 7px; top: 9px; }

      .icon-games::before { width: 32px; height: 18px; }
      .icon-games::after { width: 34px; height: 12px; bottom: 10px; }
      .icon-games-dpad { width: 8px; height: 8px; transform: translate(-50%, -50%) translate(-11px, -1px); }
      .icon-games-buttons,
      .icon-games-extra { width: 11px; height: 11px; transform: translate(-50%, -50%) translate(10px, -1px); }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- ===== НАЗВАНИЕ ПРОЕКТА ===== -->
    <div class="project-title">STARTUP PLATFORM</div>

    <!-- ===== ШАПКА ===== -->
    <div class="profile-header">
      <div class="avatar" id="avatar">
        <div class="avatar-fallback" id="avatarFallback">?</div>
      </div>
      <div class="nickname" id="nickname"><span class="at">@</span>loading</div>
    </div>

    <!-- ===== БАЛАНС ===== -->
    <div class="balance-section">
      <span class="coin-css" aria-hidden="true"></span>
      <span class="balance-value">0</span>
    </div>

    <!-- ===== СТАТИСТИКА ===== -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Убийства</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Смерти</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Ассисты</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">AVG</div>
        <div class="stat-value">0.00</div>
      </div>
    </div>

    <!-- ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== -->
    <div class="win-loss-row">
      <div class="wl-block wins">
        <span class="wl-icon win-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОБЕДЫ</span>
        <span>0</span>
      </div>
      <div class="wl-block losses">
        <span class="wl-icon loss-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОРАЖЕНИЯ</span>
        <span>0</span>
      </div>
    </div>
  </div>

  <!-- ===== ФИКСИРОВАННАЯ НИЖНЯЯ НАВИГАЦИЯ ===== -->
  <nav class="bottom-nav">
    <!-- Профиль -->
    <button class="nav-item active" type="button" data-tab="profile">
      <span class="nav-icon icon-profile" aria-hidden="true"></span>
      <span class="nav-label">Профиль</span>
    </button>

    <!-- ИГРЫ (центр) -->
    <button class="nav-item nav-center" type="button" data-tab="games">
      <span class="nav-icon icon-games" aria-hidden="true">
        <span class="icon-games-dpad"></span>
        <span class="icon-games-buttons"></span>
        <span class="icon-games-extra"></span>
      </span>
      <span class="nav-label">Игры</span>
    </button>

    <!-- Магазин -->
    <button class="nav-item" type="button" data-tab="shop">
      <span class="nav-icon icon-shop" aria-hidden="true"></span>
      <span class="nav-label">Магазин</span>
    </button>
  </nav>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (tg) {
        tg.ready();
        tg.expand();
      }

      const avatarEl = document.getElementById('avatar');
      const fallbackEl = document.getElementById('avatarFallback');
      const nicknameEl = document.getElementById('nickname');

      let user = null;
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          user = tg.initDataUnsafe.user;
        }
      } catch (e) {
        console.warn('Не удалось получить user из Telegram WebApp', e);
      }

      if (!user) {
        nicknameEl.innerHTML = '<span class="at">@</span>guest';
        fallbackEl.textContent = '?';
      } else {
        const username = user.username;
        const firstName = user.first_name || '';

        if (username) {
          nicknameEl.innerHTML = '<span class="at">@</span>' + username;
        } else if (firstName) {
          nicknameEl.textContent = firstName;
        } else {
          nicknameEl.innerHTML = '<span class="at">@</span>user';
        }

        const photoUrl = user.photo_url;

        if (photoUrl) {
          const img = document.createElement('img');
          img.src = photoUrl;
          img.alt = 'avatar';
          img.onload = () => {
            avatarEl.innerHTML = '';
            avatarEl.appendChild(img);
          };
          img.onerror = () => {
            const letter = (firstName || username || '?').trim().charAt(0);
            fallbackEl.textContent = letter || '?';
          };
        } else {
          const letter = (firstName || username || '?').trim().charAt(0);
          fallbackEl.textContent = letter || '?';
        }
      }

      // ===== НАВИГАЦИЯ =====
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach((item) => {
        item.addEventListener('click', () => {
          navItems.forEach((i) => i.classList.remove('active'));
          item.classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
