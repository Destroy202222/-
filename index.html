<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body{background:#0a0e1a;color:#fff;padding:20px;font-family:monospace}
        #log{background:#000;padding:15px;border-radius:10px;min-height:200px;margin-top:20px;white-space:pre-wrap;font-size:14px;color:#0f0}
        .error{color:#f00}
        .success{color:#0f0}
        .info{color:#ff0}
    </style>
</head>
<body>
    <h2>🔍 Тест Supabase</h2>
    <div id="log">⏳ Запуск теста...</div>

    <script>
        const log = document.getElementById('log');

        function addLog(msg, type = 'info') {
            const colors = { error: '#f00', success: '#0f0', info: '#ff0' };
            log.innerHTML += `<div style="color:${colors[type]}">${msg}</div>`;
        }

        addLog('1️⃣ Создаем клиент Supabase...', 'info');

        // ===== SUPABASE =====
        const supabaseUrl = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        addLog('✅ Клиент создан', 'success');

        // ===== ТЕСТ 1: Проверка подключения =====
        async function testSupabase() {
            addLog('2️⃣ Проверяем подключение к Supabase...', 'info');

            try {
                // Просто пробуем получить список таблиц
                const { data, error } = await supabase
                    .from('users')
                    .select('count')
                    .limit(1);

                if (error) {
                    addLog('❌ Ошибка: ' + error.message, 'error');
                    addLog('📝 Код ошибки: ' + error.code, 'error');
                    addLog('📝 Подробности: ' + JSON.stringify(error, null, 2), 'error');
                    return;
                }

                addLog('✅ Подключение работает!', 'success');
                addLog('📦 Ответ: ' + JSON.stringify(data, null, 2), 'info');

                // ===== ТЕСТ 2: Пробуем создать пользователя =====
                addLog('3️⃣ Пробуем создать тестового пользователя...', 'info');

                const testId = 'test_' + Date.now();
                const { data: insertData, error: insertError } = await supabase
                    .from('users')
                    .insert([{
                        id: testId,
                        name: 'Тест',
                        balance: 1000
                    }]);

                if (insertError) {
                    addLog('❌ Ошибка создания: ' + insertError.message, 'error');
                    addLog('📝 Код: ' + insertError.code, 'error');
                    return;
                }

                addLog('✅ Пользователь создан!', 'success');

                // ===== ТЕСТ 3: Читаем пользователя =====
                addLog('4️⃣ Читаем пользователя...', 'info');
                const { data: readData, error: readError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', testId)
                    .single();

                if (readError) {
                    addLog('❌ Ошибка чтения: ' + readError.message, 'error');
                    return;
                }

                addLog('✅ Данные прочитаны: ' + JSON.stringify(readData, null, 2), 'success');

                // ===== ТЕСТ 4: Обновляем баланс =====
                addLog('5️⃣ Обновляем баланс...', 'info');
                const { error: updateError } = await supabase
                    .from('users')
                    .update({ balance: 2000 })
                    .eq('id', testId);

                if (updateError) {
                    addLog('❌ Ошибка обновления: ' + updateError.message, 'error');
                    return;
                }

                addLog('✅ Баланс обновлен!', 'success');

                // ===== ТЕСТ 5: Удаляем =====
                addLog('6️⃣ Удаляем тестового пользователя...', 'info');
                await supabase.from('users').delete().eq('id', testId);
                addLog('✅ Тестовый пользователь удален', 'success');

                addLog('🎉 ВСЕ ТЕСТЫ ПРОШЛИ УСПЕШНО!', 'success');
                addLog('📌 Supabase работает отлично!', 'success');

            } catch (e) {
                addLog('❌ Критическая ошибка: ' + e.message, 'error');
            }
        }

        // Запускаем тест
        testSupabase();
    </script>
</body>
</html>
