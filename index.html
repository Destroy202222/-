<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0;
            overflow-x: hidden;
        }

        /* 3D ФОН */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a2244 0%, #070a12 100%);
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.1;
            animation: floatOrb 15s ease-in-out infinite alternate;
        }

        .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: #ff6b35;
        }

        .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: #4a6cf7;
            animation-duration: 20s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -60px) scale(1.3);
            }
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 12px 12px 80px;
            min-height: 100vh;
        }

        /* ХЕДЕР - ТОЧНО КАК НА СКРИНШОТЕ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #6f8f9f;
            font-size: 12px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        .wins-count {
            color: #6f8f9f;
            font-size: 12px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #0a0e1a;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* БАЛАНС */
        .balance-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-left {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 13px;
            color: #8a9bb5;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        .balance-actions {
            display: flex;
            gap: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f7d875, #e8b42b);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            color: #0a0e1a;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-gold:active {
            transform: scale(0.95);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            color: #d6e0ff;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-outline:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.05);
        }

        /* МЕНЮ - ТОЧНО КАК НА СКРИНШОТЕ (только то что есть) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 4px;
            text-align: center;
            color: #aec0ff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.06);
        }
