<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>START COIN · профиль</title>
  <style>
    /* ===== RESET & БАЗА ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #0b0e1a, #05070c 90%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #eef3fc;
    }

    /* ===== КАРТОЧКА ===== */
    .card {
      max-width: 880px;
      width: 100%;
      background: rgba(18, 25, 40, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 150, 255, 0.15);
      border-radius: 48px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 220, 180, 0.08) inset;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 40px 60px -18px #00b8a0, 0 0 0 1px rgba(0, 255, 200, 0.2) inset;
    }

    /* ===== ВЕРХНЯЯ ПАНЕЛЬ: АВАТАР + НИК ===== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 32px;
      background: linear-gradient(145deg, #1e2b4a, #0f172a);
      border: 2px solid rgba(0, 255, 210, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.25), 0 10px 20px -6px #00000080;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 600;
      color: #b7f0e0;
      text-shadow: 0 0 12px #00ffe0;
      letter-spacing: 1px;
      transition: all 0.2s;
      position: relative;
    }

    /* CSS-эмодзи для аватарки (стилизованный «глаз» / игрок) — без юникода */
    .avatar::before {
      content: "";
      display: block;
      width: 44px;
      height: 44px;
      background: radial-gradient(circle at 30% 30%, #b0fff0, #1e7b6b);
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      box-shadow: 0 0 18px #00e6c4, 0 0 8px #affff0 inset;
      transform: rotate(-5deg);
    }

    /* «зрачок» — тёмный эллипс */
    .avatar::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 24px;
      background: radial-gradient(circle at 40% 40%, #0b1a2a, #03070c);
      border-radius: 50%;
      top: 32px;
      left: 30px;
      box-shadow: 0 0 12px #000000, 0 0 6px #1a3a4a inset;
      transform: rotate(8deg);
    }

    .nickname {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, #b0e6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 255, 220, 0.5);
      border-right: 4px solid #00ffc3;
      padding-right: 1rem;
    }

    /* ===== БАЛАНС START COIN ===== */
    .balance-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 40, 35, 0.5);
      border-radius: 100px;
      padding: 0.9rem 1.8rem 0.9rem 1.5rem;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(0, 255, 200, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.1), inset 0 0 20px #00ffc308;
    }

    .balance-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 1rem;
      color: #a0d6d0;
    }

    /* CSS-эмодзи монеты «start coin» — полностью нарисованная */
    .coin-css {
      width: 36px;
      height: 36px;
      background: radial-gradient(circle at 30% 30%, #ffe484, #c99b0c);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px #f0c000, 0 6px 0 #8b6f00, 0 8px 12px #00000070;
      position: relative;
      transform: rotate(5deg);
      transition: transform 0.15s;
    }

    /* блик и внутренняя звезда */
    .coin-css::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 30% 30%, #fff8d0, #ffdb4d);
      border-radius: 50%;
      top: 6px;
      left: 6px;
      box-shadow: 0 0 12px #ffffffb0;
    }

    /* вторая часть — "S" из start, звёздочка */
    .coin-css::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #2f1f00;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      top: 11px;
      left: 12px;
      filter: drop-shadow(0 0 4px #ffd966);
      opacity: 0.9;
      transform: rotate(10deg);
    }

    .balance-value {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 2rem;
      font-weight: 700;
      color: #fff8e0;
      text-shadow: 0 0 12px #ffd966, 0 0 30px #ffb80080;
    }

    .balance-value .coin-css {
      width: 42px;
      height: 42px;
    }

    .balance-value .coin-css::before {
      width: 16px;
      height: 16px;
      top: 7px;
      left: 7px;
    }

    .balance-value .coin-css::after {
      width: 14px;
      height: 14px;
      top: 13px;
      left: 14px;
    }

    /* ===== СТАТИСТИКА ПРОФИЛЯ (УБИЙСТВА/СМЕРТИ/АССИСТЫ/AVG) ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      margin-bottom: 2.3rem;
    }

    .stat-item {
      background: rgba(8, 20, 30, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 24px;
      padding: 1.2rem 0.5rem;
      text-align: center;
      border: 1px solid rgba(0, 180, 255, 0.2);
      transition: all 0.2s;
      box-shadow: 0 10px 20px -10px #000000;
    }

    .stat-item:hover {
      border-color: #00ccb0;
      box-shadow: 0 0 20px #00ccb030;
      transform: translateY(-2px);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
      color: #8aaac0;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.1;
      color: #e2f0ff;
      text-shadow: 0 0 18px #3f9eff80;
    }

    /* ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== */
    .win-loss-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.8rem;
    }

    .wl-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      border: 1px solid;
      transition: 0.15s;
      box-shadow: 0 8px 20px -8px #000000;
    }

    .wl-block.wins {
      background: linear-gradient(145deg, #0b3b2e, #0a281f);
      border-color: #00e6a0;
      color: #aaffdd;
      text-shadow: 0 0 15px #00ffaa;
      box-shadow: 0 0 30px #00ffaa30, 0 8px 20px -6px black;
    }

    .wl-block.losses {
      background: linear-gradient(145deg, #4a101a, #2a0a10);
      border-color: #ff4d6d;
      color: #ffc0cb;
      text-shadow: 0 0 15px #ff3b5c;
      box-shadow: 0 0 30px #ff3b5c30, 0 8px 20px -6px black;
    }

    .wl-block.wins:hover {
      background: #0f4f3a;
      box-shadow: 0 0 40px #00ffaa60;
    }

    .wl-block.losses:hover {
      background: #611425;
      box-shadow: 0 0 40px #ff3b5c70;
    }

    .wl-label {
      font-weight: 400;
      font-size: 1.1rem;
      opacity: 0.9;
      letter-spacing: 0.1em;
    }

    /* CSS-эмодзи для победы (галочка/меч) и поражения (крест/череп) — без юникода */
    .wl-icon {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* победа — стилизованный "V" / галочка */
    .wl-icon.win-icon::before {
      content: "";
      width: 24px;
      height: 24px;
      background: #00ffb3;
      clip-path: polygon(0% 40%, 40% 80%, 100% 10%, 90% 0%, 40% 60%, 10% 30%);
      filter: drop-shadow(0 0 8px #00ffb3);
      transform: scale(1.2);
    }

    /* поражение — стилизованный крест */
    .wl-icon.loss-icon::before {
      content: "";
      width: 26px;
      height: 26px;
      background: #ff3b5c;
      clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
      position: absolute;
      filter: drop-shadow(0 0 8px #ff3b5c);
      border-radius: 4px;
    }

    .wl-icon.loss-icon::after {
      content: "";
      width: 6px;
      height: 24px;
      background: #1a0408;
      position: absolute;
      border-radius: 3px;
      transform: rotate(45deg);
      box-shadow: 0 0 8px #ff3b5c;
    }

    /* альтернативный крест внутри */
    .wl-icon.loss-icon::before {
      background: #ff3b5c;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }

    /* ===== ДОПОЛНИТЕЛЬНО: тонкие настройки ===== */
    .subnote {
      margin-top: 1.8rem;
      display: flex;
      justify-content: center;
      opacity: 0.6;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7d9bb5;
      border-top: 1px solid #1f3545;
      padding-top: 1.2rem;
    }

    /* адаптив */
    @media (max-width: 580px) {
      .card { padding: 1.8rem 1.2rem; border-radius: 32px; }
      .avatar { width: 64px; height: 64px; }
      .avatar::after { width: 14px; height: 20px; top: 28px; left: 25px; }
      .nickname { font-size: 1.8rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .balance-value { font-size: 1.6rem; }
      .balance-value .coin-css { width: 34px; height: 34px; }
      .balance-value .coin-css::before { width: 12px; height: 12px; top: 6px; left: 6px; }
      .balance-value .coin-css::after { width: 10px; height: 10px; top: 11px; left: 11px; }
      .wl-block { font-size: 1.2rem; padding: 0.8rem 1rem; }
      .wl-icon { width: 28px; height: 28px; }
    }

    @media (max-width: 400px) {
      .stats-grid { gap: 0.5rem; }
      .stat-value { font-size: 1.8rem; }
      .nickname { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Верх: аватар + ник (как в Telegram) -->
    <div class="profile-header">
      <div class="avatar" aria-label="аватар профиля"></div>
      <div class="nickname">@cyber_vortex</div>
    </div>

    <!-- Баланс Start Coin -->
    <div class="balance-section">
      <div class="balance-label">
        <span class="coin-css" aria-hidden="true"></span>
        <span>START COIN</span>
      </div>
      <div class="balance-value">
        <span class="coin-css" aria-hidden="true"></span>
        12 480
      </div>
    </div>

    <!-- Статистика: убийства, смерти, ассисты, avg -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Убийства</div>
        <div class="stat-value">2 341</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Смерти</div>
        <div class="stat-value">1 208</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Ассисты</div>
        <div class="stat-value">847</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">AVG</div>
        <div class="stat-value">1.94</div>
      </div>
    </div>

    <!-- Победы / Поражения -->
    <div class="win-loss-row">
      <div class="wl-block wins">
        <span class="wl-icon win-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОБЕДЫ</span>
        <span>1 024</span>
      </div>
      <div class="wl-block losses">
        <span class="wl-icon loss-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОРАЖЕНИЯ</span>
        <span>672</span>
      </div>
    </div>

    <!-- декоративная подпись (без эмодзи) -->
    <div class="subnote">start coin · profile</div>
  </div>
</body>
</html>
