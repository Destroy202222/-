<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #0a0e1a;
            padding: 12px;
            overflow-x: hidden;
        }

        /* 3D ФОН */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a3a6a 0%, #0a0e1a 70%);
            overflow: hidden;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.25;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, #4a8af4, #1a3a7a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #6aafff, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #8ac4ff, #3a6aaa);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        /* ПРИЛОЖЕНИЕ */
        .app {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            padding: 12px 12px 30px;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #6f8f9f;
            font-size: 12px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        .wins {
            color: #6f8f9f;
            font-size: 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #0a0e1a;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== БАЛАНС ===== */
        .balance-block {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-left {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            color: #8a9bb5;
            font-size: 13px;
        }

        .balance-amount {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
        }

        .balance-actions {
            display: flex;
            gap: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f7d875, #e8b42b);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            color: #0a0e1a;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-gold:active {
            transform: scale(0.95);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            color: #d6e0ff;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-outline:active {
            transform: scale(0.95);
        }

        /* ===== ЗАГОЛОВОК "УПРАВЛЕНИЕ" ===== */
        .menu-title {
            color: #aec0ff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* ===== СЕТКА МЕНЮ ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 4px;
            text-align: center;
            color: #aec0ff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.06);
        }

        .menu-item .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
            filter: brightness(0) invert(1);
            opacity: 0.6;
        }

        /* ===== НИЖНИЕ БЛОКИ ===== */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .bottom-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 18px 8px;
            text-align: center;
            color: #aec0ff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bottom-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.06);
        }

        .bottom-item .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 6px;
            filter: brightness(0) invert(1);
            opacity: 0.6;
        }

        /* АДАПТИВ */
        @media (max-width: 420px) {
            .app {
                padding: 8px 8px 20px;
            }
            .balance-amount {
                font-size: 20px;
            }
            .menu-item {
                font-size: 10px;
                padding: 10px 2px;
            }
            .menu-item .icon {
                font-size: 16px;
            }
            .bottom-item {
                font-size: 11px;
                padding: 14px 4px;
            }
            .bottom-item .icon {
                font-size: 20px;
            }
            .btn-gold,
            .btn-outline {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <div class="app">
        <!-- ===== ХЕДЕР ===== -->
        <div class="header">
            <div class="header-left">
                <span class="username" id="userName">hamster</span>
                <span class="online-status">
                    <span class="online-dot"></span>
                    online • 51
                </span>
                <span class="wins">0 W</span>
            </div>
            <div class="avatar" id="userAvatar">🐹</div>
        </div>

        <!-- ===== БАЛАНС ===== -->
        <div class="balance-block">
            <div class="balance-left">
                <div class="balance-label">BetCoin</div>
                <div class="balance-amount" id="balanceDisplay">0</div>
            </div>
            <div class="balance-actions">
                <button class="btn-gold" id="getCoinsBtn">+ Получить</button>
                <button class="btn-outline" id="buyCoinsBtn">Купить</button>
            </div>
        </div>

        <!-- ===== ЗАГОЛОВОК "УПРАВЛЕНИЕ" ===== -->
        <div class="menu-title">Управление</div>

        <!-- ===== СЕТКА МЕНЮ ===== -->
        <div class="menu-grid">
            <div class="menu-item" onclick="alert('Управление')">
                <span class="icon">⚡</span>Управление
            </div>
            <div class="menu-item" onclick="alert('Профиль')">
                <span class="icon">👤</span>Профиль
            </div>
            <div class="menu-item" onclick="alert('Клан')">
                <span class="icon">🏰</span>Клан
            </div>
            <div class="menu-item" onclick="alert('Инвентарь')">
                <span class="icon">📦</span>Инвентарь
            </div>
            <div class="menu-item" onclick="alert('Промо')">
                <span class="icon">🎁</span>Промо
            </div>
            <div class="menu-item" onclick="alert('Сервис')">
                <span class="icon">⚙️</span>Сервис
            </div>
        </div>

        <!-- ===== НИЖНИЕ БЛОКИ ===== -->
        <div class="bottom-grid">
            <div class="bottom-item" onclick="alert('Профиль')">
                <span class="icon">👤</span>Профиль
            </div>
            <div class="bottom-item" onclick="alert('Инвентарь')">
                <span class="icon">📦</span>Инвентарь
            </div>
            <div class="bottom-item" onclick="alert('Сервис')">
                <span class="icon">⚙️</span>Сервис
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TELEGRAM AUTH
        // ============================================
        let tgUser = null;
        let balance = 5000;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        // ============================================
        // DOM REFS
        // ============================================
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ============================================
        // UPDATE UI
        // ============================================
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();

            if (tgUser) {
                const name = tgUser.first_name || tgUser.username || 'hamster';
                userName.textContent = name;

                if (tgUser.photo_url) {
                    userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
                } else {
                    userAvatar.textContent = name.charAt(0).toUpperCase() || '🐹';
                }
            }
        }

        // ============================================
        // BUTTONS
        // ============================================
        document.getElementById('getCoinsBtn').addEventListener('click', function() {
            balance += 500;
            updateUI();
            alert('✅ +500 BetCoin!');
        });

        document.getElementById('buyCoinsBtn').addEventListener('click', function() {
            const amount = prompt('Сколько BetCoin купить?', '1000');
            if (!amount) return;
            const coins = parseInt(amount);
            if (isNaN(coins) || coins <= 0) {
                alert('❌ Введите сумму!');
                return;
            }
            balance += coins;
            updateUI();
            alert(`✅ +${coins} BetCoin!`);
        });

        // ============================================
        // INIT
        // ============================================
        updateUI();

        console.log('🚀 BetGame запущен!');
        console.log('👤 Пользователь:', tgUser);
    </script>

</body>
</html>
