<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BETCASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #0a0e1a;
            padding: 20px;
            overflow: hidden;
        }

        /* ===== 3D ФОН ===== */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a2a5a 0%, #070a12 70%);
            overflow: hidden;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, #f7e05e, #ff8a2a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #4a8af4, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ff6b6b, #cc3333);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.1;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -60px) scale(1.3);
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ===== ПРОФИЛЬ (АВАТАРКА + НИКНЕЙМ) ===== */
        .profile {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 6px 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            border: 2px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #0a0e1a;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(247, 224, 94, 0.15);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nickname {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== БАЛАНС ===== */
        .balance-block {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px 20px 24px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            margin-top: 10px;
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .balance-amount {
            color: #fff;
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 40px rgba(247, 224, 94, 0.08);
        }

        .currency-icon {
            font-size: 40px;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(247, 224, 94, 0.15));
        }

        .balance-sub {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 15px 15px 20px;
            }
            .balance-amount {
                font-size: 40px;
            }
            .currency-icon {
                font-size: 32px;
            }
            .avatar {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .nickname {
                font-size: 16px;
            }
            .profile {
                margin-bottom: 20px;
            }
            .balance-block {
                padding: 22px 16px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="app">

        <!-- ПРОФИЛЬ (АВАТАРКА + НИКНЕЙМ) -->
        <div class="profile">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="nickname" id="userName">Загрузка...</div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-block">
            <div class="balance-label">Ваш баланс</div>
            <div class="balance-amount">
                <span class="currency-icon">🪙</span>
                <span id="balanceDisplay">0</span>
            </div>
            <div class="balance-sub">BETCASH</div>
        </div>

    </div>

    <script>
        // ===== SUPABASE =====
        const supabaseUrl = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ===== TELEGRAM =====
        let tgUser = null;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        if (!tgUser) {
            tgUser = {
                id: 'demo_' + Date.now(),
                first_name: 'Игрок',
                username: 'player',
                photo_url: null
            };
            console.log('ℹ️ Демо-режим');
        }

        const userId = tgUser.id.toString();
        const username = tgUser.first_name || tgUser.username || 'Игрок';
        let balance = 0;

        // ===== DOM =====
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            userName.textContent = username;

            if (tgUser.photo_url) {
                userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
            } else {
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }

        // ===== SUPABASE ЗАГРУЗКА =====
        async function loadUserData() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (error && error.code === 'PGRST116') {
                    // Пользователь не найден — создаём
                    const newUser = {
                        id: userId,
                        name: username,
                        balance: 5000
                    };
                    await supabase.from('users').insert([newUser]);
                    balance = 5000;
                } else if (data) {
                    balance = data.balance || 0;
                }
                updateUI();
                console.log('✅ Баланс загружен:', balance);
            } catch (e) {
                console.error('❌ Ошибка загрузки данных:', e);
                balance = 5000;
                updateUI();
            }
        }

        // ===== ЗАПУСК =====
        loadUserData();

        console.log('🚀 BETCASH запущен!');
        console.log('👤 Пользователь:', tgUser);
    </script>

</body>
</html>
