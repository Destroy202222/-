<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>START COIN · профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== ФОН: чёрно-оранжевый с сеткой и свечением ===== */
    body {
      min-height: 100vh;
      background-color: #0a0705;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255, 120, 0, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 90, 0, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 70% 15%, rgba(255, 150, 0, 0.10) 0%, transparent 40%),
        linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
      background-attachment: fixed;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #ffeadb;
    }

    /* ===== КАРТОЧКА ===== */
    .card {
      max-width: 880px;
      width: 100%;
      background: rgba(12, 8, 5, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 130, 0, 0.35);
      border-radius: 40px;
      padding: 2.5rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(255, 160, 40, 0.08) inset,
        0 30px 70px -25px #000,
        0 0 60px rgba(255, 110, 0, 0.10);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -120px;
      right: -120px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 120, 0, 0.18), transparent 70%);
      pointer-events: none;
    }

    /* ===== ШАПКА: АВАТАР + НИК ===== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2.2rem;
      position: relative;
      z-index: 1;
    }

    /* Аватар из Telegram */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      border: 3px solid #ffb347;
      box-shadow:
        0 0 0 3px rgba(255, 140, 0, 0.25),
        0 0 30px rgba(255, 120, 0, 0.55),
        0 8px 20px -6px #000;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Заглушка, если фото нет */
    .avatar .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: #3a1400;
      text-shadow: 0 0 10px rgba(255, 220, 150, 0.6);
      background: linear-gradient(145deg, #ff8a00, #d64f00);
      text-transform: uppercase;
    }

    /* Никнейм */
    .nickname {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow:
        0 0 18px rgba(255, 140, 0, 0.85),
        0 0 40px rgba(255, 90, 0, 0.55);
      line-height: 1.1;
      word-break: break-word;
    }

    .nickname .at {
      color: #ff8a00;
      text-shadow: 0 0 14px rgba(255, 140, 0, 0.9);
    }

    /* ===== БАЛАНС ПО ЦЕНТРУ ===== */
    .balance-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, rgba(40, 20, 5, 0.9), rgba(20, 10, 3, 0.9));
      border-radius: 100px;
      padding: 0.9rem 2rem;
      margin: 0 auto 2.2rem auto;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 140, 0, 0.45);
      box-shadow:
        0 0 30px rgba(255, 120, 0, 0.18),
        inset 0 0 24px rgba(255, 120, 0, 0.06);
      position: relative;
      z-index: 1;
    }

    /* ===== CSS-ЛОГОТИП START COIN (уменьшен) ===== */
    .coin-css {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ffc266 0%, #ff8a00 45%, #c74a00 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 2px #7a2e00,
        0 0 14px rgba(255, 140, 0, 0.9),
        0 4px 0 #8a3600,
        0 6px 12px rgba(0, 0, 0, 0.7);
      position: relative;
      flex-shrink: 0;
      vertical-align: middle;
    }

    /* блик */
    .coin-css::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #fff6d8, rgba(255, 230, 150, 0));
      border-radius: 50%;
      top: 4px;
      left: 5px;
      filter: blur(0.5px);
    }

    /* символ «S» */
    .coin-css::after {
      content: "";
      width: 12px;
      height: 12px;
      background: #3a1400;
      clip-path: polygon(
        60% 0%, 100% 0%, 100% 18%, 45% 18%,
        45% 38%, 100% 38%, 100% 100%, 0% 100%,
        0% 82%, 55% 82%, 55% 62%, 0% 62%, 0% 0%
      );
      filter: drop-shadow(0 0 3px rgba(255, 200, 100, 0.5));
      opacity: 0.9;
    }

    /* Значение баланса — того же размера, что и монета по высоте */
    .balance-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 140, 0, 0.9);
      letter-spacing: 0.02em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    /* ===== СТАТИСТИКА ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .stat-item {
      background: linear-gradient(160deg, rgba(35, 18, 5, 0.9), rgba(15, 8, 2, 0.9));
      border-radius: 22px;
      padding: 1.3rem 0.5rem;
      text-align: center;
      border: 1px solid rgba(255, 140, 0, 0.30);
      box-shadow:
        0 10px 24px -12px #000,
        inset 0 1px 0 rgba(255, 180, 80, 0.08);
      transition: all 0.25s ease;
    }

    .stat-item:hover {
      border-color: rgba(255, 160, 40, 0.75);
      box-shadow:
        0 0 28px rgba(255, 130, 0, 0.28),
        inset 0 1px 0 rgba(255, 180, 80, 0.15);
      transform: translateY(-3px);
    }

    .stat-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: #c98a4e;
      margin-bottom: 0.55rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
    }

    /* ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== */
    .win-loss-row {
      display: flex;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .wl-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      padding: 1.1rem 1rem;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.7rem;
      letter-spacing: 0.02em;
      border: 1.5px solid;
      transition: all 0.25s ease;
    }

    .wl-block.wins {
      border-color: #22c55e;
      color: #4ade80;
      background: linear-gradient(145deg, rgba(20, 60, 35, 0.55), rgba(8, 30, 18, 0.55));
      box-shadow:
        0 0 26px rgba(34, 197, 94, 0.28),
        inset 0 0 20px rgba(34, 197, 94, 0.08);
      text-shadow: 0 0 16px rgba(74, 222, 128, 0.8);
    }

    .wl-block.wins:hover {
      box-shadow:
        0 0 44px rgba(34, 197, 94, 0.55),
        inset 0 0 26px rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }

    .wl-block.losses {
      border-color: #ef4444;
      color: #f87171;
      background: linear-gradient(145deg, rgba(70, 15, 20, 0.55), rgba(35, 8, 10, 0.55));
      box-shadow:
        0 0 26px rgba(239, 68, 68, 0.28),
        inset 0 0 20px rgba(239, 68, 68, 0.08);
      text-shadow: 0 0 16px rgba(248, 113, 113, 0.8);
    }

    .wl-block.losses:hover {
      box-shadow:
        0 0 44px rgba(239, 68, 68, 0.55),
        inset 0 0 26px rgba(239, 68, 68, 0.15);
      transform: translateY(-2px);
    }

    .wl-label {
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.14em;
      opacity: 0.95;
    }

    /* ===== ИКОНКИ ПОБЕД / ПОРАЖЕНИЙ ===== */
    .wl-icon {
      width: 34px;
      height: 34px;
      position: relative;
      flex-shrink: 0;
      display: inline-block;
    }

    .win-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #4ade80, #16a34a);
      clip-path: polygon(50% 0%, 100% 22%, 100% 65%, 50% 100%, 0% 65%, 0% 22%);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.9);
    }

    .win-icon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 8px;
      border-left: 3px solid #052e16;
      border-bottom: 3px solid #052e16;
      transform: rotate(-45deg);
      top: 11px;
      left: 9px;
    }

    .loss-icon::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      background: linear-gradient(160deg, #f87171, #b91c1c);
      border-radius: 6px;
      top: 4px;
      left: 4px;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
    }

    .loss-icon::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 6px;
      background: #2a0505;
      border-radius: 3px;
      top: 14px;
      left: 4px;
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    }

    /* ===== ПОДПИСЬ ===== */
    .subnote {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #a55e1e;
      border-top: 1px solid rgba(255, 130, 0, 0.18);
      padding-top: 1.3rem;
      position: relative;
      z-index: 1;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 640px) {
      .card { padding: 1.8rem 1.3rem; border-radius: 30px; }
      .avatar { width: 66px; height: 66px; }
      .nickname { font-size: 1.7rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.9rem; }
      .balance-value { font-size: 1.8rem; }
      .balance-section { padding: 0.8rem 1.5rem; }
      .wl-block { font-size: 1.3rem; gap: 0.6rem; padding: 0.9rem 0.7rem; }
      .wl-label { font-size: 0.82rem; letter-spacing: 0.08em; }
      .wl-icon { width: 28px; height: 28px; }
      .win-icon::after { top: 9px; left: 7px; }
      .loss-icon::before { width: 22px; height: 22px; top: 3px; left: 3px; }
      .loss-icon::after { width: 22px; height: 5px; top: 12px; left: 3px; }
    }

    @media (max-width: 420px) {
      .stats-grid { gap: 0.6rem; }
      .stat-value { font-size: 1.6rem; }
      .nickname { font-size: 1.4rem; }
      .balance-section { padding: 0.8rem 1.2rem; max-width: 320px; }
      .wl-label { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- ===== ШАПКА: АВАТАР + НИК ИЗ TELEGRAM ===== -->
    <div class="profile-header">
      <div class="avatar" id="avatar">
        <div class="avatar-fallback" id="avatarFallback">?</div>
      </div>
      <div class="nickname" id="nickname"><span class="at">@</span>loading</div>
    </div>

    <!-- ===== БАЛАНС ПО ЦЕНТРУ ===== -->
    <div class="balance-section">
      <span class="coin-css" aria-hidden="true"></span>
      <span class="balance-value">0</span>
    </div>

    <!-- ===== СТАТИСТИКА ===== -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Убийства</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Смерти</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Ассисты</div>
        <div class="stat-value">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">AVG</div>
        <div class="stat-value">0.00</div>
      </div>
    </div>

    <!-- ===== ПОБЕДЫ / ПОРАЖЕНИЯ ===== -->
    <div class="win-loss-row">
      <div class="wl-block wins">
        <span class="wl-icon win-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОБЕДЫ</span>
        <span>0</span>
      </div>
      <div class="wl-block losses">
        <span class="wl-icon loss-icon" aria-hidden="true"></span>
        <span class="wl-label">ПОРАЖЕНИЯ</span>
        <span>0</span>
      </div>
    </div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="subnote">START COIN · PROFILE</div>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;

      // Сообщаем Telegram, что приложение готово
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const avatarEl = document.getElementById('avatar');
      const fallbackEl = document.getElementById('avatarFallback');
      const nicknameEl = document.getElementById('nickname');

      // Пытаемся получить данные пользователя
      let user = null;
      try {
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
          user = tg.initDataUnsafe.user;
        }
      } catch (e) {
        console.warn('Не удалось получить user из Telegram WebApp', e);
      }

      // Если данных нет — показываем заглушку
      if (!user) {
        nicknameEl.innerHTML = '<span class="at">@</span>guest';
        fallbackEl.textContent = '?';
        return;
      }

      // ===== Никнейм =====
      const username = user.username;
      const firstName = user.first_name || '';

      if (username) {
        nicknameEl.innerHTML = '<span class="at">@</span>' + username;
      } else if (firstName) {
        nicknameEl.textContent = firstName;
      } else {
        nicknameEl.innerHTML = '<span class="at">@</span>user';
      }

      // ===== Аватар =====
      const photoUrl = user.photo_url;

      if (photoUrl) {
        const img = document.createElement('img');
        img.src = photoUrl;
        img.alt = 'avatar';
        img.onload = () => {
          // Убираем заглушку, вставляем картинку
          avatarEl.innerHTML = '';
          avatarEl.appendChild(img);
        };
        img.onerror = () => {
          // Если фото не загрузилось — оставляем букву
          const letter = (firstName || username || '?').trim().charAt(0);
          fallbackEl.textContent = letter || '?';
        };
      } else {
        // Нет фото — используем первую букву имени/ника
        const letter = (firstName || username || '?').trim().charAt(0);
        fallbackEl.textContent = letter || '?';
      }
    })();
  </script>
</body>
</html>
