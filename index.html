<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e1a;
            padding: 20px;
            overflow: hidden;
        }

        /* 3D ФОН - бело-темно-синий */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a3a6a 0%, #0a0e1a 70%);
            overflow: hidden;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, #4a8af4, #1a3a7a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #6aafff, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #8ac4ff, #3a6aaa);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        /* Частицы */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ВЕРХНИЙ БЛОК - НИКНЕЙМ И АВАТАРКА */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 50px;
            padding: 0 4px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a8af4, #1a3a7a);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(74, 138, 244, 0.3);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* БЛОК С БАЛАНСОМ */
        .balance-block {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 20px 25px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .balance-amount {
            color: #fff;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(74, 138, 244, 0.2);
            margin-bottom: 25px;
        }

        .balance-amount span {
            font-size: 28px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
        }

        /* КНОПКИ */
        .buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a8af4, #2a5a9a);
            color: #fff;
            box-shadow: 0 4px 20px rgba(74, 138, 244, 0.3);
        }

        .btn-primary:active {
            box-shadow: 0 2px 10px rgba(74, 138, 244, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #c8d6ff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.12);
        }

        /* МОДАЛКА ДЛЯ ПРОМОКОДА */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 30, 60, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 340px;
            width: 100%;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 2px;
        }

        .modal-input:focus {
            border-color: #4a8af4;
        }

        .modal-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #4a8af4, #2a5a9a);
            color: #fff;
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #c8d6ff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* АДАПТИВ */
        @media (max-width: 400px) {
            .app {
                padding: 20px 15px 30px;
            }
            .balance-amount {
                font-size: 38px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 8px;
            }
            .header {
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="app">
        <!-- ВЕРХНИЙ БЛОК -->
        <div class="header">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="username" id="userName">Гость</div>
        </div>

        <!-- БЛОК С БАЛАНСОМ -->
        <div class="balance-block">
            <div class="balance-label">BETCOIN</div>
            <div class="balance-amount" id="balanceDisplay">0</div>
            <div class="buttons">
                <button class="btn btn-primary" id="depositBtn">💎 Пополнить</button>
                <button class="btn btn-secondary" id="promoBtn">🎁 Промокод</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПРОМОКОДА -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" maxlength="20" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="applyPromo()">Активировать</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TELEGRAM AUTH
        // ============================================
        let tgUser = null;
        let balance = 5000;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        // ============================================
        // DOM REFS
        // ============================================
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const depositBtn = document.getElementById('depositBtn');
        const promoBtn = document.getElementById('promoBtn');
        const promoModal = document.getElementById('promoModal');
        const promoInput = document.getElementById('promoInput');

        // ============================================
        // UPDATE UI
        // ============================================
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();

            if (tgUser) {
                const name = tgUser.first_name || tgUser.username || 'Гость';
                userName.textContent = name;

                if (tgUser.photo_url) {
                    userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
                } else {
                    userAvatar.textContent = name.charAt(0).toUpperCase() || '🐹';
                }
            }
        }

        // ============================================
        // DEPOSIT
        // ============================================
        depositBtn.addEventListener('click', function() {
            const amount = prompt('💎 Сумма пополнения:', '1000');
            if (!amount) return;

            const coins = parseInt(amount);
            if (isNaN(coins) || coins <= 0) {
                alert('❌ Введите корректную сумму!');
                return;
            }

            balance += coins;
            updateUI();
            alert(`✅ Баланс пополнен на ${coins} BetCoin!`);
        });

        // ============================================
        // PROMOCODE
        // ============================================
        promoBtn.addEventListener('click', function() {
            promoModal.classList.add('active');
            promoInput.value = '';
            promoInput.focus();
        });

        function closePromo() {
            promoModal.classList.remove('active');
        }

        function applyPromo() {
            const code = promoInput.value.trim().toUpperCase();

            if (!code) {
                alert('❌ Введите промокод!');
                return;
            }

            // Список промокодов
            const promoCodes = {
                'WELCOME': 500,
                'BONUS': 1000,
                'GOLD': 2500,
                'VIP': 5000,
                'BETGAME': 2000,
                'FREE': 100,
                'LUCKY': 750,
                'MEGA': 10000
            };

            if (promoCodes[code]) {
                const bonus = promoCodes[code];
                balance += bonus;
                updateUI();
                alert(`🎉 Промокод активирован! +${bonus} BetCoin`);
                closePromo();
            } else {
                alert('❌ Неверный промокод!');
                promoInput.value = '';
                promoInput.focus();
            }
        }

        // Закрытие по клику вне модалки
        promoModal.addEventListener('click', function(e) {
            if (e.target === this) closePromo();
        });

        // Enter в поле промокода
        promoInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') applyPromo();
        });

        // ============================================
        // INIT
        // ============================================
        updateUI();

        // Делаем функции глобальными для HTML
        window.closePromo = closePromo;
        window.applyPromo = applyPromo;

        console.log('🚀 BetGame запущен! Баланс:', balance);
        console.log('👤 Пользователь2:', tgUser);
    </script>

</body>
</html>
