<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>S2 Arena — матчи 5×5 в Standoff 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1118; --panel:#141d28; --panel2:#1b2735; --line:#2a3948;
  --text:#e8edf3; --mute:#8b9cb0;
  --ct:#4ea1ff; --t:#ffb238; --ok:#3fd68a; --bad:#ff5f56;
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --cut:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font:15px/1.5 var(--body);min-height:100vh;
  background-color:var(--ink);
  background-image:
    linear-gradient(rgba(139,156,176,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(139,156,176,.05) 1px,transparent 1px);
  background-size:36px 36px;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.02em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* ---------- шапка и навигация ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,17,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;height:58px}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em;cursor:pointer;user-select:none}
.brand b{color:var(--t);font-weight:700}
.nav-d{display:none;gap:4px;margin-left:8px}
.nav-btn{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mute);padding:8px 12px;cursor:pointer;font-weight:700}
.nav-btn svg{width:18px;height:18px;fill:currentColor}
.nav-btn.on{color:var(--text)}
.nav-btn.on svg{color:var(--t)}
.nav-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--t)}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.me-chip .nick{font-weight:800;line-height:1.1}
.me-chip .rt{font-family:var(--disp);color:var(--t);font-size:15px;line-height:1.1}
.nav-m{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(11,17,24,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-m .nav-btn{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:9px 2px}
main{padding-top:16px;padding-bottom:96px}
@media (min-width:860px){
  .nav-d{display:flex}.nav-m{display:none}main{padding-bottom:48px}
}

/* ---------- панели и кнопки ---------- */
.panel{
  background:var(--panel);border-left:3px solid var(--line);padding:16px;margin-bottom:12px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);
}
.panel.ct{border-left-color:var(--ct)}
.panel.t{border-left-color:var(--t)}
.panel.ok{border-left-color:var(--ok)}
.panel.bad{border-left-color:var(--bad)}
.panel>h2{margin-bottom:10px}
.btn{
  display:block;width:100%;border:0;cursor:pointer;background:var(--t);color:#1c1300;
  font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.04em;padding:13px 18px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.ct{background:var(--ct);color:#04121f}
.btn.bad{background:var(--bad);color:#210503}
.btn.sm{display:inline-block;width:auto;font-size:15px;padding:8px 14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:grid;gap:10px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;padding:12px 13px;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:0;
}
textarea{resize:vertical;min-height:84px}
label.f{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;margin-left:6px;vertical-align:middle;background:var(--panel2);color:var(--mute)}
.badge.own{background:var(--t);color:#1c1300}
.badge.adm{background:var(--ct);color:#04121f}
.badge.ban{background:var(--bad);color:#210503}
.empty{color:var(--mute);padding:14px 0;text-align:center}

/* ---------- аватары и ранги ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-family:var(--disp)}
.ins{display:block;flex:none}

/* ---------- радар: главный экран ---------- */
.online{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;white-space:nowrap}
.online i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.online.on i{background:var(--ok)}
.radar{
  position:relative;width:min(76vw,300px);aspect-ratio:1;margin:14px auto 10px;border-radius:50%;
  background:
    linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,
    linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,
    repeating-radial-gradient(circle,transparent 0 22%,rgba(78,161,255,.22) 22% calc(22% + 1px)),
    #0c1520;
  box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;
}
.sweep{position:absolute;inset:0;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,rgba(78,161,255,0) 0deg,rgba(78,161,255,.42) 70deg,rgba(78,161,255,0) 71deg)}
.radar.on .sweep{opacity:1;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--t);box-shadow:0 0 0 4px rgba(255,178,56,.18)}
.blip.me{background:var(--ct);box-shadow:0 0 0 4px rgba(78,161,255,.25)}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.core b{font-family:var(--disp);font-size:44px;font-weight:600;line-height:1;text-shadow:0 0 12px var(--ink),0 0 4px var(--ink)}
.core small{color:var(--mute);text-shadow:0 0 8px var(--ink)}
.slots{display:flex;gap:4px;margin:12px 0}
.slots i{flex:1;height:8px;background:var(--panel2)}
.slots i.on{background:var(--t)}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .grow{flex:1;font-weight:700}
.steps{margin:0;padding-left:20px;color:var(--mute)}
.steps li{margin:4px 0}

/* ---------- матч ---------- */
.versus{display:grid;gap:12px}
@media (min-width:600px){.versus{grid-template-columns:1fr 1fr}}
.team{background:var(--panel);padding:14px;border-top:3px solid var(--ct)}
.team.b{border-top-color:var(--t)}
.team .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.team.a h3{color:var(--ct)}.team.b h3{color:var(--t)}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl .grow{flex:1;font-weight:700}
.pl.me .grow{color:var(--t)}
.cap{color:var(--t);font-size:12px;font-weight:800;margin-left:6px}
.code{font-family:var(--disp);font-size:34px;letter-spacing:.06em;word-break:break-all}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .btn{background:var(--panel2);color:var(--text)}
.pick .btn.on[data-v="A"]{background:var(--ct);color:#04121f}
.pick .btn.on[data-v="B"]{background:var(--t);color:#1c1300}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:10px 0}
.bignum{font-family:var(--disp);font-size:56px;line-height:1}
.win{color:var(--ok)}.lose{color:var(--bad)}

/* ---------- таблицы и списки ---------- */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-of-type{border-top:0}
.lrow:hover{background:var(--panel2)}
.lrow.me{background:rgba(255,178,56,.08)}
.lrow .pos{width:26px;text-align:center;font-family:var(--disp);font-size:18px;color:var(--mute)}
.lrow .pos.top{color:var(--t)}
.lrow .grow{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .rt{font-family:var(--disp);font-size:20px;min-width:52px;text-align:right}
.lrow .wl{color:var(--mute);font-size:13px;min-width:46px;text-align:right}
details.panel summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.panel summary::-webkit-details-marker{display:none}
.mscore{font-family:var(--disp);font-size:26px}
.d-pos{color:var(--ok)}.d-neg{color:var(--bad)}

/* ---------- профиль ---------- */
.hero{display:flex;gap:16px;align-items:center}
.hero h1{display:flex;align-items:center;flex-wrap:wrap}
.tierline{display:flex;align-items:center;gap:8px;font-weight:800}
.meter{height:8px;background:var(--panel2);margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--t)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel2);padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{width:40px;height:40px;border:2px solid transparent;background:var(--ink);cursor:pointer;font-size:20px;padding:0}
.picker button.on{border-color:var(--t)}
.picker.colors button{border-radius:50%}
svg.spark{width:100%;height:64px;display:block;margin-top:12px}

/* ---------- вход / регистрация ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;position:relative}
.auth .brand{font-size:36px;text-align:center;margin-bottom:6px;cursor:default}
.auth .lead{text-align:center;color:var(--mute);margin-bottom:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);margin-bottom:14px}
.seg button{background:none;border:0;padding:11px;cursor:pointer;color:var(--mute);font-weight:800}
.seg button.on{background:var(--panel2);color:var(--text)}

.field{display:block}
.field .in-wrap{position:relative}
.field .in-wrap input{padding-right:44px}
.field .status{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:14px;color:var(--mute)}
.field .hint{color:var(--mute);font-size:12px;margin-top:4px;line-height:1.35}
.field .err{color:var(--bad);font-size:13px;min-height:16px;margin-top:2px}
.field.has-err input{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;padding:8px;display:grid;place-items:center}
.eye:hover{color:var(--text)}
.eye.on{color:var(--t)}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.pw-meter i{height:4px;background:var(--panel2);transition:background .2s}
.pw-hint{margin-top:4px;transition:color .2s}
.agree{display:flex;gap:10px;align-items:flex-start;color:var(--mute);font-size:13px;line-height:1.4;cursor:pointer;padding:2px 0}
.agree input{accent-color:var(--t);width:16px;height:16px;margin-top:2px;flex:none}
.agree b{color:var(--text);font-weight:700}
#a-err.big{min-height:20px;margin:4px 0 0}
.center{text-align:center}
.lnk{color:var(--t);text-decoration:none;font-weight:700}
.lnk:hover{text-decoration:underline}
#a-go{position:relative;display:grid;place-items:center}
#a-go .spin{position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#1c1300;opacity:0;transition:opacity .15s}
#a-go.loading{pointer-events:none}
#a-go.loading .spin{opacity:1;animation:spin .8s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.field.has-err input{animation:shake .25s ease-out}
@media (max-width:420px){
  .auth-card{padding:18px 14px}
  .auth .brand{font-size:30px}
}

/* ---------- уведомления ---------- */
#toasts{position:fixed;left:0;right:0;top:66px;z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 16px}
.toast{background:var(--panel2);border-left:3px solid var(--ct);padding:10px 14px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.found{position:fixed;inset:0;z-index:70;background:rgba(11,17,24,.94);display:grid;place-items:center;text-align:center;animation:fin .25s}
.found h1{font-size:clamp(40px,12vw,84px);color:var(--t);letter-spacing:.05em}
@keyframes fin{from{opacity:0}}

/* ---------- админка ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;background:var(--panel);border:0;color:var(--mute);padding:10px 14px;cursor:pointer;font-weight:800}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--t)}
.adm-actions{display:flex;flex-wrap:wrap;gap:6px}
.rep{font-size:13px;color:var(--t);margin:4px 0}
.logrow{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.logrow:first-of-type{border-top:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* =====================  НАСТРОЙКИ  ===================== */
const SUPABASE_URL = 'https://zwrczkwtzzfywgqprmrt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyY3prd3R6emZ5d2dxcHJtcnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4OTc2MDQzNywiZXhwIjoyMTA1MzM2NDM3fQ.2OdASwhJVUUoG_uvKc03DKFmZtOm5GPFgBjQAkVlJ5Y';
const EMAIL_DOMAIN = '@s2arena.app';

/* =====================  УТИЛИТЫ  ===================== */
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deb = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000 | 0);
  if (s < 60) return 'только что';
  if (s < 3600) return (s / 60 | 0) + ' мин назад';
  if (s < 86400) return (s / 3600 | 0) + ' ч назад';
  return (s / 86400 | 0) + ' дн назад';
}
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3300);
  setTimeout(() => t.remove(), 3800);
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  const map = [
    ['Invalid login', 'Неверный ник или пароль'], ['already registered', 'Этот ник уже занят'],
    ['Database error saving', 'Не удалось создать профиль — проверь ник и что SQL из schema.sql выполнен'],
    ['banned', 'Аккаунт заблокирован'], ['already in match', 'Ты уже в матче'],
    ['not admin', 'Нужны права админа'], ['not owner', 'Это может только владелец'],
    ['only captains', 'Результат вводят только капитаны'], ['only host', 'Код комнаты вводит хост'],
    ['match closed', 'Матч уже закрыт'], ['not allowed', 'Это действие запрещено'],
    ['rate limit', 'Слишком часто, подожди немного'], ['Failed to fetch', 'Нет связи с сервером']
  ];
  for (const [k, v] of map) if (m.includes(k)) return v;
  return m || 'Что-то пошло не так';
}

/* ранги */
const TIERS = [
  { n: 'Рекрут', min: 0, c: '#8b9cb0' }, { n: 'Страж', min: 900, c: '#6fb4ff' },
  { n: 'Ветеран', min: 1100, c: '#4ea1ff' }, { n: 'Элита', min: 1300, c: '#ffb238' },
  { n: 'Мастер', min: 1500, c: '#ff8a3d' }, { n: 'Легенда', min: 1800, c: '#ff5f56' }
];
const tierIdx = r => { let i = 0; TIERS.forEach((t, k) => { if (r >= t.min) i = k; }); return i; };
const tier = r => TIERS[tierIdx(r)];
const nextTier = r => TIERS[tierIdx(r) + 1] || null;
function insignia(r, size = 26) {
  const n = tierIdx(r) + 1, t = TIERS[n - 1], h = n * 7 + 9;
  let p = '';
  for (let i = 0; i < n; i++) p += `<path d="M4 ${i * 7 + 12} L16 ${i * 7 + 6} L28 ${i * 7 + 12}"/>`;
  return `<svg class="ins" viewBox="0 0 32 ${h}" width="${size}" height="${Math.round(size * h / 32)}" fill="none" stroke="${t.c}" stroke-width="3" stroke-linecap="square" aria-label="${t.n}">${p}</svg>`;
}
const AV_COLORS = ['#4ea1ff', '#ffb238', '#3fd68a', '#ff5f56', '#b48cff', '#2fd0d0', '#ff8ab3', '#c7d36b'];
const AV_EMOJI = ['🎯', '🔫', '🦊', '🐺', '🐉', '💀', '🚀', '👑', '⚡', '🔥', '🧠', '🦅'];
function avatar(p, size = 40) {
  const c = AV_COLORS[(p.color || 0) % 8];
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .5)}px;background:${c}2e;box-shadow:inset 0 0 0 2px ${c}">${esc(p.avatar || '🎯')}</span>`;
}
function letterAv(nick, size = 32) {
  const c = AV_COLORS[hash(nick) % 8];
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .45)}px;background:${c}2e;box-shadow:inset 0 0 0 2px ${c};color:${c}">${esc(nick.slice(0, 1).toUpperCase())}</span>`;
}
const roleBadge = p => p.banned ? '<span class="badge ban">Бан</span>' : p.role === 'owner' ? '<span class="badge own">Владелец</span>' : p.role === 'admin' ? '<span class="badge adm">Админ</span>' : '';
function blip(key) { const h = hash(key), a = (h % 360) * Math.PI / 180, r = 12 + ((h >>> 9) % 32); return { x: 50 + Math.cos(a) * r, y: 50 + Math.sin(a) * r }; }
const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  rating: '<path d="M5 20V10h4v10zM10 20V4h4v16zM15 20v-7h4v7z"/>',
  matches: '<path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>',
  admin: '<path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/>'
};

/* =====================  СОСТОЯНИЕ  ===================== */
if (!window.supabase) { root.innerHTML = '<div class="auth"><div class="panel bad">Не загрузилась библиотека Supabase. Проверь интернет и перезагрузи страницу.</div></div>'; return; }
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let dismissedIds; try { dismissedIds = new Set(JSON.parse(lsGet('s2a_dismissed') || '[]')); } catch (e) { dismissedIds = new Set(); }
const S = {
  session: null, me: null, page: 'play', authMode: 'login',
  settings: { team_size: '5' }, queue: [], inQueue: false, joinedAt: 0,
  match: null, mplayers: [], rep: { winner: null },
  board: [], recent: [], online: 0, conn: 'connecting',
  viewId: null, pv: null, editing: false, draft: null,
  adminTab: 'matches', adm: { matches: [], players: [], log: [], q: '' },
  dirty: false, ch: null, pch: null, hb: null, tick: null, roomEdit: false
};
const isAdmin = () => !!S.me && (S.me.role === 'admin' || S.me.role === 'owner');
const isOwner = () => !!S.me && S.me.role === 'owner';

/* =====================  ЗАГРУЗКА ДАННЫХ  ===================== */
async function loadMe() {
  const { data } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  S.me = data;
}
async function loadSettings() {
  const { data } = await sb.from('settings').select('*');
  (data || []).forEach(r => { S.settings[r.key] = r.value; });
}
async function loadQueue() {
  const { data } = await sb.from('queue').select('*').order('joined_at');
  S.queue = data || [];
  const mine = S.queue.find(q => q.user_id === S.me.id);
  S.inQueue = !!mine;
  S.joinedAt = mine ? new Date(mine.joined_at).getTime() : 0;
}
async function loadMatch() {
  const { data } = await sb.from('match_players').select('match_id, matches!inner(*)')
    .eq('user_id', S.me.id).order('created_at', { ascending: false }).limit(1);
  const row = data && data[0];
  let m = null;
  if (row) {
    const mm = row.matches;
    const open = mm.status === 'live' || mm.status === 'review';
    const fresh = Date.now() - new Date(mm.finished_at || mm.created_at).getTime() < 10 * 60 * 1000;
    if (open || (!dismissedIds.has(mm.id) && fresh)) m = mm;
  }
  if (!m) { S.match = null; S.mplayers = []; return; }
  const { data: pl } = await sb.from('match_players').select('*').eq('match_id', m.id).order('rating_before', { ascending: false });
  S.match = m; S.mplayers = pl || [];
}
async function loadBoard() {
  const { data } = await sb.from('profiles')
    .select('id,nickname,rating,wins,losses,matches_played,avatar,color,role,banned')
    .eq('banned', false).order('rating', { ascending: false }).limit(50);
  S.board = data || [];
}
async function loadRecent() {
  const { data } = await sb.from('matches').select('*, match_players(nickname,team,delta,is_captain)')
    .eq('status', 'finished').order('finished_at', { ascending: false }).limit(20);
  S.recent = data || [];
}
async function loadProfile(id) {
  const [a, b] = await Promise.all([
    sb.from('profiles').select('*').eq('id', id).maybeSingle(),
    sb.from('match_players').select('team,delta,rating_before,rating_after,created_at,matches!inner(status,winner,score_a,score_b,finished_at)')
      .eq('user_id', id).eq('matches.status', 'finished').order('created_at', { ascending: false }).limit(20)
  ]);
  S.pv = { p: a.data, hist: b.data || [] };
}
async function loadAdmin() {
  if (!isAdmin()) return;
  const t = S.adminTab;
  if (t === 'matches') {
    const { data } = await sb.from('matches').select('*, match_players(*)').in('status', ['live', 'review']).order('created_at', { ascending: false });
    S.adm.matches = data || [];
  } else if (t === 'players') {
    let q = sb.from('profiles').select('id,nickname,role,rating,banned,matches_played').order('rating', { ascending: false }).limit(40);
    if (S.adm.q) q = q.ilike('nickname', '%' + S.adm.q.replace(/[%_,]/g, '') + '%');
    const { data } = await q; S.adm.players = data || [];
  } else if (t === 'queue') {
    await loadQueue();
  } else if (t === 'log') {
    const { data } = await sb.from('admin_log').select('*').order('created_at', { ascending: false }).limit(40);
    S.adm.log = data || [];
  }
}
async function refreshMatch() {
  const prev = S.match;
  await loadMatch();
  if (S.match && S.match.status === 'live' && (!prev || prev.id !== S.match.id)) {
    S.inQueue = false; S.page = 'play'; S.rep = { winner: null }; matchFound();
  }
  if (prev && S.match && prev.id === S.match.id && prev.status !== 'finished' && S.match.status === 'finished') {
    await loadMe();
    const mine = S.mplayers.find(p => p.user_id === S.me.id);
    if (mine && mine.delta != null) toast('Матч засчитан: ' + (mine.delta >= 0 ? '+' : '') + mine.delta + ' к рейтингу', mine.delta >= 0 ? 'ok' : 'bad');
  }
  if (prev && S.match && prev.id === S.match.id && prev.status !== 'cancelled' && S.match.status === 'cancelled') toast('Матч отменён админом', 'bad');
}

/* =====================  ВХОД И СЕССИЯ  ===================== */
async function onSession(session) {
  S.session = session;
  await loadMe();
  if (!S.me) { toast('Профиль не найден. Выполни schema.sql в Supabase.', 'bad'); await sb.auth.signOut(); renderAuth(); return; }
  await Promise.all([loadSettings(), loadQueue(), loadBoard()]);
  await refreshMatch();
  subscribe();
  startTimers();
  S.page = 'play';
  renderApp();
}
function teardown() {
  clearInterval(S.hb); clearInterval(S.tick);
  if (S.ch) sb.removeChannel(S.ch);
  if (S.pch) sb.removeChannel(S.pch);
  S.ch = S.pch = null;
  Object.assign(S, { me: null, session: null, queue: [], inQueue: false, match: null, mplayers: [], pv: null, viewId: null, editing: false, roomEdit: false });
}

/* ---------- хелперы формы ---------- */
function setFieldError(name, msg) {
  const f = document.querySelector(`.field[data-f="${name}"]`);
  if (!f) return;
  const e = f.querySelector('[data-err]');
  if (e) e.textContent = msg || '';
  f.classList.toggle('has-err', !!msg);
}
function setBigError(msg) { const e = $('#a-err'); if (e) e.textContent = msg || ''; }
function setLoading(on, label) {
  const b = $('#a-go'); if (!b) return;
  b.disabled = on;
  b.classList.toggle('loading', on);
  const lb = b.querySelector('.lb'); if (lb && label) lb.textContent = label;
}
function pwScore(p) {
  let s = 0;
  if (p.length >= 6) s++;
  if (p.length >= 10) s++;
  if (/[a-zа-я]/.test(p) && /[A-ZА-Я]/.test(p)) s++;
  if (/\d/.test(p)) s++;
  if (/[^\w\s]/.test(p)) s++;
  return Math.min(4, s);
}
function pwPaint(p) {
  const m = document.querySelector('[data-pw]'); if (!m) return;
  const s = pwScore(p);
  const colors = ['#ff5f56', '#ff8a3d', '#ffb238', '#3fd68a'];
  [...m.children].forEach((b, i) => {
    b.style.background = i < s ? colors[s - 1] : 'var(--panel2)';
  });
  const h = document.querySelector('[data-pwhint]');
  if (h) {
    const t = !p ? 'От 6 символов. Строчная + заглавная + цифра — надёжнее.'
      : (['Слабый пароль', 'Так себе', 'Хороший', 'Отличный'][s - 1] || 'Слабый пароль');
    h.textContent = t;
    h.style.color = p ? colors[Math.max(0, s - 1)] : 'var(--mute)';
  }
}

/* ---------- проверка ника на лету ---------- */
let nickOk = null;
const checkNick = deb(async (nick) => {
  const field = document.querySelector('.field[data-f="nick"] .status');
  if (!field) return;
  if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { field.textContent = ''; nickOk = null; return; }
  field.textContent = '…'; field.style.color = 'var(--mute)';
  try {
    const { data, error } = await sb.rpc('nickname_available', { p_nick: nick });
    if (error) throw error;
    nickOk = !!data;
    field.textContent = data ? '✓' : '✕';
    field.style.color = data ? 'var(--ok)' : 'var(--bad)';
    setFieldError('nick', data ? '' : 'Этот ник уже занят');
  } catch (e) {
    field.textContent = '';
    nickOk = null;
  }
}, 400);

/* ---------- отправка формы ---------- */
async function doAuth() {
  const reg = S.authMode === 'reg';
  const nick = ($('#a-nick').value || '').trim();
  const pass = $('#a-pass').value || '';
  const pass2 = reg ? ($('#a-pass2').value || '') : pass;
  const terms = reg ? $('#a-terms').checked : true;

  setBigError('');
  setFieldError('nick', ''); setFieldError('pass', ''); setFieldError('pass2', '');

  let bad = false;
  if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { setFieldError('nick', '3–16 символов: латиница, цифры, _'); bad = true; }
  if (pass.length < 6) { setFieldError('pass', 'Минимум 6 символов'); bad = true; }
  if (reg && pass !== pass2) { setFieldError('pass2', 'Пароли не совпадают'); bad = true; }
  if (reg && !terms) { setBigError('Подтверди согласие с правилами'); bad = true; }
  if (bad) return;

  setLoading(true, reg ? 'Создаём аккаунт…' : 'Входим…');
  try {
    const email = nick.toLowerCase() + EMAIL_DOMAIN;

    if (reg) {
      if (nickOk !== true) {
        const free = await sb.rpc('nickname_available', { p_nick: nick });
        if (free.error) throw free.error;
        if (!free.data) { setFieldError('nick', 'Этот ник уже занят'); nickOk = false; throw new Error('nick taken'); }
      }
      const { data, error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { nickname: nick } }
      });
      if (error) throw error;
      if (!data.session) throw new Error('confirm email');
      await onSession(data.session);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      await onSession(data.session);
    }
  } catch (e) {
    const msg = errText(e);
    if (String(e.message).includes('confirm email')) {
      setBigError('В Supabase включено подтверждение почты. Отключи «Confirm email»: Authentication → Providers → Email.');
    } else if (String(e.message) === 'nick taken') {
      // уже показали под полем
    } else if (/уже занят/i.test(msg)) {
      setFieldError('nick', msg);
    } else if (/парол/i.test(msg)) {
      setFieldError('pass', msg);
    } else {
      setBigError(msg);
    }
  } finally {
    setLoading(false, reg ? 'Создать аккаунт' : 'Войти');
  }
}

/* =====================  REALTIME  ===================== */
function subscribe() {
  const uid = S.me.id;
  const onQ = deb(async () => { await loadQueue(); softRender(); });
  const onM = deb(async () => {
    await refreshMatch();
    if (S.page === 'admin') await loadAdmin();
    if (S.page === 'matches') await loadRecent();
    softRender();
  });
  const onP = deb(async () => {
    await loadMe();
    if (S.page === 'rating') await loadBoard();
    softRender();
  }, 600);
  S.ch = sb.channel('s2-db')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, onQ)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, onM)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'match_players', filter: 'user_id=eq.' + uid }, onM)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, onP)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, deb(async () => { await loadSettings(); softRender(); }))
    .subscribe(st => { S.conn = st === 'SUBSCRIBED' ? 'on' : st === 'CONNECTING' ? 'connecting' : 'off'; updateOnline(); });

  S.pch = sb.channel('s2-online', { config: { presence: { key: uid } } });
  S.pch.on('presence', { event: 'sync' }, () => { S.online = Object.keys(S.pch.presenceState()).length; updateOnline(); })
    .subscribe(async st => { if (st === 'SUBSCRIBED') await S.pch.track({ nick: S.me.nickname }); });
}
function updateOnline() {
  const el = $('#online'); if (!el) return;
  el.className = 'online' + (S.conn === 'on' ? ' on' : '');
  el.innerHTML = '<i></i>' + (S.conn === 'on' ? S.online + ' в сети' : S.conn === 'connecting' ? 'подключение…' : 'нет связи');
}
function startTimers() {
  clearInterval(S.hb); clearInterval(S.tick);
  S.hb = setInterval(async () => {
    if (!S.inQueue) return;
    const { data } = await sb.rpc('queue_heartbeat');
    if (data) { await refreshMatch(); softRender(); }
  }, 20000);
  S.tick = setInterval(() => {
    const el = $('#qt'); if (!el || !S.joinedAt) return;
    const s = Math.max(0, Math.floor((Date.now() - S.joinedAt) / 1000));
    el.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }, 1000);
}
function matchFound() {
  const d = document.createElement('div');
  d.className = 'found';
  d.innerHTML = '<div><h1>Матч найден</h1><p class="mute">Открываем комнату…</p></div>';
  document.body.appendChild(d);
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
  setTimeout(() => d.remove(), 1700);
}

/* ---------- играть ---------- */
function vPlay() {
  if (S.match) return vMatch();
  const ts = +S.settings.team_size || 5, need = ts * 2, q = S.queue, t = tier(S.me.rating);
  const blips = q.map(p => { const b = blip(p.user_id); return `<i class="blip${p.user_id === S.me.id ? ' me' : ''}" style="left:${b.x}%;top:${b.y}%"></i>`; }).join('');
  let slots = ''; for (let i = 0; i < need; i++) slots += `<i class="${i < q.length ? 'on' : ''}"></i>`;
  const list = q.length
    ? q.map(p => `<div class="qrow">${letterAv(p.nickname, 30)}<div class="grow">${esc(p.nickname)}${p.user_id === S.me.id ? '<span class="cap">это ты</span>' : ''}</div><div class="num">${esc(p.rating)}</div></div>`).join('')
    : '<div class="empty">В очереди никого нет. Нажми «Найти матч» первым.</div>';
  return `

      <div class="sweep"></div>${blips}

    </div>
    <div class="between small mute"><span>В очереди</span><span><b class="num" style="color:var(--text)">${q.length}</b> из ${need}</span></div>
    <div class="slots">${slots}</div>
    ${S.inQueue
      ? '<button class="btn ghost" data-act="leave">Отменить поиск</button>'
      : '<button class="btn" data-act="join">Найти матч</button>'}
  </section>
  <section class="panel ct"><h2>Кто в очереди</h2>${list}</section>
  <section class="panel"><h2>Как проходит матч</h2>
    <ol class="steps">

}

/* ---------- матч ---------- */
function teamHtml(list, side, avg) {
  return `<div class="team ${side.toLowerCase()}"><div class="th"><h3>Команда ${side === 'A' ? '1' : '2'}</h3><span class="mute small">средний рейтинг <b class="num" style="color:var(--text)">${avg ?? '—'}</b></span></div>
  ${list.map(p => `<div class="pl${p.user_id === S.me.id ? ' me' : ''}">${letterAv(p.nickname, 32)}<div class="grow">${esc(p.nickname)}${p.is_captain ? '<span class="cap">капитан</span>' : ''}</div>${p.delta != null ? `<span class="num ${p.delta >= 0 ? 'd-pos' : 'd-neg'}">${p.delta >= 0 ? '+' : ''}${p.delta}</span>` : ''}<span class="num mute">${p.rating_before}</span></div>`).join('')}</div>`;
}
function vMatch() {
  const m = S.match, pl = S.mplayers, mine = pl.find(p => p.user_id === S.me.id);
  const A = pl.filter(p => p.team === 'A'), B = pl.filter(p => p.team === 'B');
  const host = A.find(p => p.is_captain), open = m.status === 'live' || m.status === 'review';
  const reports = Object.values(m.reports || {});
  let head;
  if (m.status === 'live') head = '<section class="panel ok"><h2>Матч идёт</h2><p class="mute">Заходите в комнату и играйте. Когда закончите, капитаны сообщают результат.</p></section>';
  else if (m.status === 'review') head = '<section class="panel t"><h2>Результат на проверке</h2><p class="mute">Капитан отправил счёт. Ждём, пока админ засчитает матч.</p></section>';
  else if (m.status === 'cancelled') head = '<section class="panel bad"><h2>Матч отменён</h2><p class="mute">Рейтинг не изменился.</p><div style="height:12px"></div><button class="btn ghost" data-act="dismiss">Вернуться в лобби</button></section>';
  else {
    const won = mine && mine.team === m.winner, d = mine && mine.delta != null ? mine.delta : 0;
    head = `<section class="panel ${won ? 'ok' : 'bad'}"><h2 class="${won ? 'win' : 'lose'}">${won ? 'Победа' : 'Поражение'}</h2>
      <div class="score"><span class="bignum" style="color:var(--ct)">${m.score_a ?? '–'}</span><span class="mute">:</span><span class="bignum" style="color:var(--t)">${m.score_b ?? '–'}</span></div>
      <div class="between"><span class="mute">Изменение рейтинга</span><span class="bignum ${d >= 0 ? 'win' : 'lose'}" style="font-size:36px">${d >= 0 ? '+' : ''}${d}</span></div>
      <div style="height:12px"></div><button class="btn" data-act="dismiss">Вернуться в лобби</button></section>`;
  }
  let room = '';
  if (open) {
    let body;
    if (m.room_code) body = `<div class="mute small">Код комнаты</div><div class="code">${esc(m.room_code)}</div>` + (mine && mine.is_captain && mine.team === 'A' ? '<div style="height:8px"></div><button class="btn ghost sm" data-act="roomedit">Изменить код</button>' : '');
    else if (mine && mine.is_captain && mine.team === 'A') body = '<p class="mute" style="margin-bottom:10px">Ты хост. Создай комнату в Standoff 2 и вставь её код сюда: остальные увидят его сразу.</p><input type="text" id="rc" maxlength="40" placeholder="Код или ID комнаты"><div style="height:8px"></div><button class="btn" data-act="room">Отправить код</button>';
    else body = `<p class="mute">Ждём код комнаты от хоста: <b style="color:var(--text)">${esc(host ? host.nickname : '—')}</b></p>`;
    if (m.room_code && S.roomEdit) body = '<input type="text" id="rc" maxlength="40" placeholder="Новый код"><div style="height:8px"></div><button class="btn" data-act="room">Сохранить код</button>';
    room = `<section class="panel ct"><h2>Комната</h2>${body}</section>`;
  }
  let rep = '';
  if (open && mine && mine.is_captain) {
    const my = (m.reports || {})[S.me.id];
    rep = `<section class="panel t"><h2>Результат матча</h2>` + (my
      ? `<p class="mute">Ты отправил: победа команды ${my.winner === 'A' ? '1' : '2'}${my.a != null ? ` (${my.a}:${my.b})` : ''}. Админ проверит и засчитает матч.</p>`
      : `<p class="mute" style="margin-bottom:10px">Кто победил? Отправляют оба капитана, админ сверит и засчитает.</p>
        <div class="pick"><button class="btn${S.rep.winner === 'A' ? ' on' : ''}" data-act="repw" data-v="A">Команда 1</button><button class="btn${S.rep.winner === 'B' ? ' on' : ''}" data-act="repw" data-v="B">Команда 2</button></div>
        <div class="score"><input type="number" id="rs-a" min="0" max="99" placeholder="Счёт 1" inputmode="numeric"><span class="mute">:</span><input type="number" id="rs-b" min="0" max="99" placeholder="Счёт 2" inputmode="numeric"></div>
        <button class="btn" data-act="report">Отправить результат</button>`) + '</section>';
  } else if (open) {
    rep = '<section class="panel"><p class="mute">Результат вводят капитаны команд, потом админ засчитывает матч.</p></section>';
  }
  const seen = reports.length && open ? `<section class="panel"><h2>Отчёты капитанов</h2>${reports.map(r => `<div class="rep">${esc(r.nick)}: победа команды ${r.winner === 'A' ? '1' : '2'}${r.a != null ? ` (${esc(r.a)}:${esc(r.b)})` : ''}</div>`).join('')}</section>` : '';
  return head + `<div class="versus">${teamHtml(A, 'A', m.avg_a)}${teamHtml(B, 'B', m.avg_b)}</div><div style="height:12px"></div>` + room + rep + seen;
}

/* ---------- рейтинг ---------- */
function vRating() {
  const rows = S.board.length ? S.board.map((p, i) => `
    <div class="lrow${p.id === S.me.id ? ' me' : ''}" data-act="profile" data-id="${p.id}">
      <div class="pos${i < 3 ? ' top' : ''}">${i + 1}</div>${avatar(p, 34)}
      <div class="grow">${esc(p.nickname)}${roleBadge(p)}</div>
      ${insignia(p.rating, 22)}<div class="rt">${p.rating}</div><div class="wl">${p.wins}/${p.losses}</div>
    </div>`).join('') : '<div class="empty">Пока никто не сыграл. Первые матчи определят топ.</div>';
  return `<section class="panel t"><h1 style="margin-bottom:8px">Рейтинг</h1><p class="mute small" style="margin-bottom:8px">Топ-50 игроков. Справа: рейтинг и победы/поражения.</p>${rows}</section>`;
}

/* ---------- матчи ---------- */
function vMatches() {
  if (!S.recent.length) return '<section class="panel t"><h1>Матчи</h1><div class="empty">Засчитанных матчей пока нет.</div></section>';
  return '<h1 style="margin-bottom:12px">Матчи</h1>' + S.recent.map(m => {
    const A = m.match_players.filter(p => p.team === 'A'), B = m.match_players.filter(p => p.team === 'B');
    const w = m.winner === 'A' ? 'ct' : 't';
    const side = (l) => l.map(p => `<div class="pl">${letterAv(p.nickname, 26)}<div class="grow">${esc(p.nickname)}${p.is_captain ? '<span class="cap">капитан</span>' : ''}</div><span class="num ${p.delta >= 0 ? 'd-pos' : 'd-neg'}">${p.delta >= 0 ? '+' : ''}${p.delta}</span></div>`).join('');
    return `<details class="panel ${w}"><summary>
      <span class="mscore" style="color:var(--ct)">${m.score_a ?? '–'}</span><span class="mute">:</span><span class="mscore" style="color:var(--t)">${m.score_b ?? '–'}</span>
      <span class="mute small" style="margin-left:auto;text-align:right">Победила команда ${m.winner === 'A' ? '1' : '2'}<br>${ago(m.finished_at)}</span></summary>
      <div class="versus" style="margin-top:12px"><div class="team a"><h3>Команда 1</h3>${side(A)}</div><div class="team b"><h3>Команда 2</h3>${side(B)}</div></div></details>`;
  }).join('');
}

/* ---------- профиль ---------- */
function spark(hist) {
  const pts = hist.filter(h => h.rating_after != null).slice().reverse();
  if (pts.length < 2) return '';
  const vals = [pts[0].rating_before, ...pts.map(h => h.rating_after)];
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = Math.max(1, mx - mn);
  const xy = vals.map((v, i) => `${(i / (vals.length - 1) * 296 + 2).toFixed(1)},${(58 - (v - mn) / rg * 52).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 300 62" preserveAspectRatio="none"><polyline points="${xy}" fill="none" stroke="var(--t)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function vProfile() {
  if (!S.pv || !S.pv.p) return '<section class="panel"><div class="empty">Загружаем профиль…</div></section>';
  const p = S.pv.p, hist = S.pv.hist, own = p.id === S.me.id;
  const t = tier(p.rating), nt = nextTier(p.rating);
  const pct = nt ? Math.round((p.rating - t.min) / (nt.min - t.min) * 100) : 100;
  const games = p.wins + p.losses, wr = games ? Math.round(p.wins / games * 100) : 0;
  if (own && S.editing) {
    const d = S.draft;
    return `<section class="panel t"><h2>Редактировать профиль</h2><div class="stack">
      <div><label class="f">Аватар</label><div class="picker">${AV_EMOJI.map(e => `<button data-act="pav" data-v="${e}" class="${d.avatar === e ? 'on' : ''}">${e}</button>`).join('')}</div></div>
      <div><label class="f">Цвет</label><div class="picker colors">${AV_COLORS.map((c, i) => `<button data-act="pcol" data-v="${i}" class="${d.color === i ? 'on' : ''}" style="background:${c}"></button>`).join('')}</div></div>
      <div><label class="f" for="e-sid">Ник или ID в Standoff 2</label><input type="text" id="e-sid" maxlength="24" value="${esc(p.standoff_id)}"></div>
      <div><label class="f" for="e-bio">О себе</label><textarea id="e-bio" maxlength="160">${esc(p.bio)}</textarea></div>
      <div class="row"><button class="btn ghost" data-act="pcancel">Отмена</button><button class="btn" data-act="psave">Сохранить</button></div>
    </div></section>`;
  }
  const hrows = hist.length ? hist.map(h => {
    const won = h.team === h.matches.winner;
    return `<div class="lrow" style="cursor:default"><div class="grow ${won ? 'win' : 'lose'}">${won ? 'Победа' : 'Поражение'}</div>
      <div class="num mute">${h.matches.score_a ?? '–'}:${h.matches.score_b ?? '–'}</div>
      <div class="num ${h.delta >= 0 ? 'd-pos' : 'd-neg'}" style="min-width:44px;text-align:right">${h.delta >= 0 ? '+' : ''}${h.delta}</div>
      <div class="wl">${ago(h.matches.finished_at)}</div></div>`;
  }).join('') : '<div class="empty">Матчей пока нет. Найди первый на вкладке «Играть».</div>';
  return `
  <section class="panel t">
    <div class="hero">${avatar(p, 76)}<div style="min-width:0">
      <h1>${esc(p.nickname)}${roleBadge(p)}</h1>
      <div class="mute small">${p.standoff_id ? 'Standoff 2: ' + esc(p.standoff_id) : 'ID Standoff 2 не указан'}</div>
    </div></div>
    ${p.bio ? `<p style="margin-top:12px">${esc(p.bio)}</p>` : ''}
    <div class="between" style="margin-top:16px"><div class="tierline">${insignia(p.rating, 30)}<span style="color:${t.c}">${t.n}</span></div><div class="bignum" style="font-size:44px">${p.rating}</div></div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="mute small">${nt ? `До ранга «${nt.n}»: ${nt.min - p.rating}` : 'Высший ранг'}</div>
    ${spark(hist)}
    <div class="stats"><div class="stat"><b>${p.matches_played}</b><span>матчей</span></div><div class="stat"><b class="win">${p.wins}</b><span>побед</span></div><div class="stat"><b class="lose">${p.losses}</b><span>поражений</span></div><div class="stat"><b>${wr}%</b><span>винрейт</span></div></div>
    ${own ? '<div style="height:14px"></div><div class="row"><button class="btn ct" data-act="pedit">Редактировать</button><button class="btn ghost" data-act="logout">Выйти</button></div>' : ''}
  </section>
  <section class="panel ct"><h2>Последние матчи</h2>${hrows}</section>`;
}

/* ---------- админка ---------- */
function vAdmin() {
  if (!isAdmin()) return '<section class="panel bad"><h2>Нет доступа</h2></section>';
  const tabs = [['matches', 'Матчи'], ['players', 'Игроки'], ['queue', 'Очередь'], ...(isOwner() ? [['settings', 'Настройки']] : []), ['log', 'Журнал']];
  return `<h1 style="margin-bottom:12px">Админ-меню</h1>
  <div class="tabs">${tabs.map(([k, l]) => `<button class="${S.adminTab === k ? 'on' : ''}" data-act="admtab" data-v="${k}">${l}</button>`).join('')}</div>${admBody()}`;
}
function admBody() {
  const t = S.adminTab;
  if (t === 'matches') {
    if (!S.adm.matches.length) return '<section class="panel"><div class="empty">Активных матчей нет.</div></section>';
    return S.adm.matches.map(m => {
      const pl = m.match_players || [], A = pl.filter(p => p.team === 'A'), B = pl.filter(p => p.team === 'B');
      const reps = Object.values(m.reports || {});
      const names = l => l.map(p => `<div class="pl">${letterAv(p.nickname, 26)}<div class="grow">${esc(p.nickname)}${p.is_captain ? '<span class="cap">капитан</span>' : ''}</div><span class="num mute">${p.rating_before}</span></div>`).join('');
      return `<section class="panel ${m.status === 'review' ? 't' : 'ct'}" data-mid="${m.id}">
        <div class="between"><h2>Матч ${m.id.slice(0, 6)}</h2><span class="badge ${m.status === 'review' ? 'own' : ''}">${m.status === 'review' ? 'на проверке' : 'идёт'}</span></div>
        <div class="mute small">создан ${ago(m.created_at)}${m.room_code ? ' · комната ' + esc(m.room_code) : ''}</div>
        <div class="versus" style="margin:10px 0"><div class="team a"><h3>Команда 1 · ${m.avg_a ?? '—'}</h3>${names(A)}</div><div class="team b"><h3>Команда 2 · ${m.avg_b ?? '—'}</h3>${names(B)}</div></div>
        ${reps.map(r => `<div class="rep">Капитан ${esc(r.nick)}: победа команды ${r.winner === 'A' ? '1' : '2'}${r.a != null ? ` (${esc(r.a)}:${esc(r.b)})` : ''}</div>`).join('')}
        <div class="score"><input type="number" class="sa" min="0" max="99" placeholder="Счёт 1" inputmode="numeric"><span class="mute">:</span><input type="number" class="sb" min="0" max="99" placeholder="Счёт 2" inputmode="numeric"></div>
        <div class="row"><button class="btn ct" data-act="fin" data-w="A">Победа команды 1</button><button class="btn" data-act="fin" data-w="B">Победа команды 2</button></div>
        <div style="height:8px"></div><button class="btn ghost" data-act="cancelm">Отменить матч без рейтинга</button>
      </section>`;
    }).join('');
  }
  if (t === 'players') return `<section class="panel"><input type="text" id="psearch" placeholder="Найти игрока по нику" value="${esc(S.adm.q)}"><div id="plist">${playersHtml()}</div></section>`;
  if (t === 'queue') return `<section class="panel"><div class="between"><h2>В очереди: ${S.queue.length}</h2><button class="btn ghost sm" data-act="clearq">Очистить</button></div>${S.queue.length ? S.queue.map(p => `<div class="qrow">${letterAv(p.nickname, 30)}<div class="grow">${esc(p.nickname)}</div><div class="num">${p.rating}</div></div>`).join('') : '<div class="empty">Очередь пуста.</div>'}</section>`;
  if (t === 'settings') return `<section class="panel"><h2>Формат матча</h2><p class="mute small" style="margin-bottom:10px">Сколько игроков в каждой команде. Для проверки вдвоём поставь 1 на 1, для игры — 5 на 5.</p>
    <select id="tsize">${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${+S.settings.team_size === n ? ' selected' : ''}>${n} на ${n}</option>`).join('')}</select>
    <div style="height:10px"></div><button class="btn" data-act="savesize">Сохранить</button></section>`;
  if (t === 'log') return `<section class="panel">${S.adm.log.length ? S.adm.log.map(l => `<div class="logrow"><b>${esc(l.admin_nick || '—')}</b> · ${esc(l.action)}${l.details ? ': ' + esc(l.details) : ''}<div class="mute small">${ago(l.created_at)}</div></div>`).join('') : '<div class="empty">Журнал пуст.</div>'}</section>`;
  return '';
}
function playersHtml() {
  if (!S.adm.players.length) return '<div class="empty">Никого не нашли.</div>';
  return S.adm.players.map(p => `<div class="qrow" data-uid="${p.id}" data-nick="${esc(p.nickname)}" style="flex-wrap:wrap">
    ${letterAv(p.nickname, 32)}<div class="grow">${esc(p.nickname)}${roleBadge(p)}</div><div class="num">${p.rating}</div>
    <div class="adm-actions" style="width:100%">
      <button class="btn ghost sm" data-act="prate">Рейтинг</button>
      ${p.role !== 'owner' ? `<button class="btn ghost sm" data-act="pban" data-b="${p.banned ? 0 : 1}">${p.banned ? 'Разбанить' : 'Забанить'}</button>` : ''}
      ${isOwner() && p.role !== 'owner' ? `<button class="btn ghost sm" data-act="prole" data-r="${p.role === 'admin' ? 'player' : 'admin'}">${p.role === 'admin' ? 'Снять админа' : 'Сделать админом'}</button>` : ''}
    </div></div>`).join('');
}

/* =====================  ДЕЙСТВИЯ  ===================== */
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
const A = {
  authmode(el) {
    S.authMode = el.dataset.v;
    nickOk = null;
    renderAuth();
  },
  togglepass(el) {
    const inp = document.getElementById(el.dataset.t);
    if (!inp) return;
    inp.type = inp.type === 'password' ? 'text' : 'password';
    el.classList.toggle('on', inp.type === 'text');
  },
  async nav(el) {
    S.page = el.dataset.p; S.editing = false;
    if (S.page === 'rating') await loadBoard();
    if (S.page === 'matches') await loadRecent();
    if (S.page === 'profile') { S.viewId = S.me.id; S.pv = null; renderChrome(); renderView(); await loadProfile(S.me.id); }
    if (S.page === 'admin') await loadAdmin();
    softRender(); window.scrollTo(0, 0);
  },
  async profile(el) { S.page = 'profile'; S.viewId = el.dataset.id; S.pv = null; S.editing = false; renderChrome(); renderView(); await loadProfile(el.dataset.id); softRender(); window.scrollTo(0, 0); },
  logout() { sb.auth.signOut().then(() => { teardown(); S.authMode = 'login'; renderAuth(); }); },

  async join() {
    const id = await rpc('join_queue');
    await loadQueue();
    if (id) { await refreshMatch(); }
    softRender();
  },
  async leave() { await rpc('leave_queue'); await loadQueue(); softRender(); },
  dismiss() { dismissedIds.add(S.match.id); lsSet('s2a_dismissed', JSON.stringify([...dismissedIds].slice(-50))); S.match = null; S.mplayers = []; S.roomEdit = false; softRender(); },
  roomedit() { S.roomEdit = true; renderView(); },
  async room() {
    const v = $('#rc').value.trim(); if (!v) return toast('Введи код комнаты', 'bad');
    await rpc('set_room_code', { p_match: S.match.id, p_code: v });
    S.roomEdit = false; await refreshMatch(); softRender(); toast('Код отправлен', 'ok');
  },
  repw(el) { S.rep.winner = el.dataset.v; renderView(); },
  async report() {
    if (!S.rep.winner) return toast('Выбери победившую команду', 'bad');
    const a = $('#rs-a').value, b = $('#rs-b').value;
    await rpc('submit_report', { p_match: S.match.id, p_winner: S.rep.winner, p_score_a: a === '' ? null : +a, p_score_b: b === '' ? null : +b });
    await refreshMatch(); softRender(); toast('Результат отправлен админу', 'ok');
  },

  pedit() { S.editing = true; S.draft = { avatar: S.me.avatar, color: S.me.color }; renderView(); },
  pcancel() { S.editing = false; renderView(); },
  pav(el) { S.draft.avatar = el.dataset.v; renderView(); },
  pcol(el) { S.draft.color = +el.dataset.v; renderView(); },
  async psave() {
    await rpc('update_my_profile', { p_bio: $('#e-bio').value.trim(), p_standoff_id: $('#e-sid').value.trim(), p_avatar: S.draft.avatar, p_color: S.draft.color });
    S.editing = false; await loadMe(); await loadProfile(S.me.id); softRender(); toast('Профиль сохранён', 'ok');
  },

  async admtab(el) { S.adminTab = el.dataset.v; await loadAdmin(); softRender(); },
  async fin(el) {
    const card = el.closest('[data-mid]'), w = el.dataset.w;
    if (!confirm('Засчитать победу команды ' + (w === 'A' ? '1' : '2') + '? Рейтинг игроков изменится.')) return;
    const a = $('.sa', card).value, b = $('.sb', card).value;
    await rpc('admin_finish_match', { p_match: card.dataset.mid, p_winner: w, p_score_a: a === '' ? null : +a, p_score_b: b === '' ? null : +b });
    toast('Матч засчитан', 'ok'); await loadAdmin(); softRender();
  },
  async cancelm(el) {
    const card = el.closest('[data-mid]');
    if (!confirm('Отменить матч? Рейтинг не изменится.')) return;
    await rpc('admin_cancel_match', { p_match: card.dataset.mid });
    toast('Матч отменён', 'ok'); await loadAdmin(); softRender();
  },
  async clearq() { if (!confirm('Убрать всех из очереди?')) return; await rpc('admin_clear_queue'); await loadQueue(); softRender(); },
  async prate(el) {
    const row = el.closest('[data-uid]'), v = prompt('Новый рейтинг для ' + row.dataset.nick + ' (0–5000):');
    if (v === null) return; const n = parseInt(v, 10); if (isNaN(n)) return toast('Нужно число', 'bad');
    await rpc('admin_set_rating', { p_user: row.dataset.uid, p_rating: n }); toast('Рейтинг изменён', 'ok'); await loadAdmin(); softRender();
  },
  async pban(el) {
    const row = el.closest('[data-uid]'), ban = el.dataset.b === '1';
    if (!confirm((ban ? 'Забанить ' : 'Разбанить ') + row.dataset.nick + '?')) return;
    await rpc('admin_set_banned', { p_user: row.dataset.uid, p_banned: ban }); toast(ban ? 'Игрок забанен' : 'Бан снят', 'ok'); await loadAdmin(); softRender();
  },
  async prole(el) {
    const row = el.closest('[data-uid]'), r = el.dataset.r;
    if (!confirm((r === 'admin' ? 'Сделать админом ' : 'Снять админа с ') + row.dataset.nick + '?')) return;
    await rpc('admin_set_role', { p_user: row.dataset.uid, p_role: r }); toast('Роль изменена', 'ok'); await loadAdmin(); softRender();
  },
  async savesize() { await rpc('admin_set_setting', { p_key: 'team_size', p_value: $('#tsize').value }); await loadSettings(); toast('Формат сохранён', 'ok'); softRender(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || !A[el.dataset.act]) return;
  Promise.resolve(A[el.dataset.act](el, e)).catch(err => toast(errText(err), 'bad'));
});
document.addEventListener('submit', e => { if (e.target.id === 'af') { e.preventDefault(); doAuth(); } });
document.addEventListener('input', e => {
  if (!e.target) return;
  if (e.target.id === 'a-nick') {
    nickOk = null;
    const st = document.querySelector('.field[data-f="nick"] .status');
    if (st) { st.textContent = ''; st.style.color = 'var(--mute)'; }
    setFieldError('nick', '');
    checkNick(e.target.value.trim());
    return;
  }
  if (e.target.id === 'a-pass' && S.authMode === 'reg') {
    pwPaint(e.target.value);
    if ($('#a-pass2') && $('#a-pass2').value) {
      setFieldError('pass2', e.target.value === $('#a-pass2').value ? '' : 'Пароли не совпадают');
    }
    return;
  }
  if (e.target.id === 'a-pass2') {
    const p1 = $('#a-pass').value, p2 = e.target.value;
    setFieldError('pass2', p2 && p1 !== p2 ? 'Пароли не совпадают' : '');
    return;
  }
  if (e.target.id !== 'psearch') return;
  const v = e.target.value.trim();
  deb(async () => {
    S.adm.q = v; await loadAdmin();
    const l = $('#plist'); if (l) l.innerHTML = playersHtml();
  }, 300)();
});
document.addEventListener('focusout', () => {
  if (!S.dirty) return;
  setTimeout(() => { if (S.dirty && !typing()) renderView(); }, 1200);
});
window.addEventListener('pagehide', () => { if (S.inQueue && S.me) sb.rpc('leave_queue'); });

/* =====================  СТАРТ  ===================== */
(async () => {
  root.innerHTML = '<div class="auth"><div class="brand">S2<b>ARENA</b></div></div>';
  const { data } = await sb.auth.getSession();
  if (data.session) await onSession(data.session); else renderAuth();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.me) { teardown(); renderAuth(); } });
})();
})();
</script>
</body>
</html>
