<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brawl Profile</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--or:#ff7a00;--or2:#ffa040;--tx:#f5f5f5;--mut:#8a8a8a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center}
.card{background:var(--card);border:1px solid #2a2a2a;border-radius:20px;padding:24px;width:100%;max-width:420px;text-align:center;margin-top:20px}
h1{color:var(--or);font-size:22px;margin-bottom:8px}
p{color:var(--mut);font-size:14px;line-height:1.5;margin:8px 0}
.btn{background:linear-gradient(135deg,var(--or),var(--or2));color:#000;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%;margin-top:16px;cursor:pointer}
.btn:disabled{opacity:.5}
.ava{width:110px;height:110px;border-radius:50%;border:3px solid var(--or);object-fit:cover;background:#222}
.nick{font-size:26px;font-weight:800;margin-top:14px}
.tag{color:var(--or);font-weight:600}
.badge{display:inline-block;background:#1f1400;color:var(--or);border:1px solid var(--or);border-radius:20px;padding:4px 12px;font-size:12px;margin-top:10px}
input[type=text]{width:100%;background:#111;border:1px solid #333;color:var(--tx);border-radius:10px;padding:12px;margin-top:12px;font-size:16px;text-align:center}
.err{color:#ff5252}
.hidden{display:none}
</style>
</head>
<body>
<div id="app" class="card"><h1>Загрузка…</h1></div>

<script>
// ВСТАВЬ после деплоя функции:
const API = "https://wlhzcocwgmzcrtzhefic.supabase.co/functions/v1/api";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsaHpjb2N3Z216Y3J0emhlZmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ4ODYsImV4cCI6MjEwNjQ1MDg4Nn0.-Y1jYFT1NO9Nm1SgzNU7QYBA1E8zTZr8aXA768-5cd8";

const tg = Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d");
const app = document.getElementById("app");
const tgUser = tg.initDataUnsafe.user || {};
const ava = tgUser.photo_url || "";

async function call(action, extra = {}) {
  const r = await fetch(API, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
    body: JSON.stringify({ action, initData: tg.initData, ...extra }) });
  const d = await r.json(); if (!r.ok) throw d; return d;
}
const errText = e => ({ tag_not_found: "Тег не найден", tag_taken: "Этот аккаунт уже привязан", bad_auth: "Открой приложение из Telegram" }[e.error] || "Ошибка, попробуй ещё раз");

function render(p) {
  if (p.status === "verified") return profile(p);
  if (p.status === "pending") return pending(p);
  return upload();
}

function upload() {
  app.innerHTML = `<h1>Верификация Brawl Stars</h1>
  <p>Прикрепи скриншот своего профиля — мы найдём #ТЕГ.</p>
  <input type="file" id="f" accept="image/*" class="hidden">
  <button class="btn" id="pick">📷 Выбрать фото профиля</button>
  <p id="st"></p>
  <input type="text" id="manual" class="hidden" placeholder="#ТЕГ вручную">
  <button class="btn hidden" id="go">Продолжить</button>`;
  const f = q("f"), st = q("st");
  q("pick").onclick = () => f.click();
  f.onchange = async () => {
    if (!f.files[0]) return;
    st.textContent = "Распознаём тег…"; st.className = "";
    try {
      const { data } = await Tesseract.recognize(f.files[0], "eng");
      const m = data.text.match(/#\s?([0-9A-Za-z]{5,10})/);
      q("manual").value = m ? "#" + m[1].toUpperCase() : "";
      st.textContent = m ? "Проверь тег и нажми «Продолжить»" : "Тег не распознан — введи вручную";
    } catch { st.textContent = "Не удалось распознать — введи тег вручную"; }
    q("manual").classList.remove("hidden"); q("go").classList.remove("hidden");
  };
  q("go").onclick = async () => {
    q("go").disabled = true;
    try { render((await call("start", { tag: q("manual").value })).player); }
    catch (e) { st.textContent = errText(e); st.className = "err"; q("go").disabled = false; }
  };
}

function pending(p) {
  app.innerHTML = `<h1>Подтверди аккаунт</h1>
  <p class="tag">${p.bs_name} · ${p.bs_tag}</p>
  <p>Зайди в Brawl Stars и <b>смени аватарку</b> на любую другую. Затем нажми кнопку.</p>
  <button class="btn" id="chk">Я сменил аватарку</button>
  <p id="st"></p><p><a href="#" id="back" style="color:var(--mut)">Другой аккаунт</a></p>`;
  q("chk").onclick = async () => {
    q("chk").disabled = true; q("st").textContent = "Проверяем…";
    try {
      const d = await call("check");
      if (d.player.status === "verified") return render(d.player);
      q("st").textContent = "Аватарка не изменилась. Подожди ~30 сек после смены и попробуй снова."; q("st").className = "err";
    } catch (e) { q("st").textContent = errText(e); q("st").className = "err"; }
    q("chk").disabled = false;
  };
  q("back").onclick = e => { e.preventDefault(); upload(); };
}

function profile(p) {
  app.innerHTML = `<img class="ava" src="${ava || p.tg_photo_url || ""}" alt="">
  <div class="nick">${p.bs_name}</div>
  <p class="tag">${p.bs_tag}</p>
  <span class="badge">✔ Аккаунт подтверждён</span>`;
}

const q = id => document.getElementById(id);
call("me").then(d => render(d.player)).catch(e => { app.innerHTML = `<h1>Ошибка</h1><p class="err">${errText(e)}</p>`; });
</script>
</body>
</html>
