<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>CyberBet — Standoff 2</title>
<style>
  :root{
    --bg:#0e1116;
    --bg-grid:rgba(255,255,255,0.035);
    --card:#161b22;
    --card2:#1c222c;
    --line:#232a35;
    --accent:#ffd400;
    --green:#22c55e;
    --red:#ef4444;
    --text:#e6edf3;
    --muted:#8b949e;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  *{
    box-sizing:border-box;
    margin:0;padding:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    min-height:100vh;
    color:var(--text);
    overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
    user-select:none;
    -webkit-user-select:none;
  }

  body{
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(to right, var(--bg-grid) 0, var(--bg-grid) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(to bottom, var(--bg-grid) 0, var(--bg-grid) 1px, transparent 1px, transparent 32px),
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,212,0,0.08), transparent 70%);
    background-attachment:fixed, fixed, fixed;
  }

  /* HEADER */
  header{
    background:rgba(10,13,18,0.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top, 0px));
    display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:20;
  }
  .logo{font-weight:800;font-size:19px;letter-spacing:1px;color:var(--accent)}
  .logo span{color:var(--text)}
  .header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .btn-login{
    padding:9px 14px;border-radius:10px;
    background:var(--accent);color:#000;
    border:none;font-weight:700;font-size:13px;cursor:pointer;
  }

  /* CSS-иконки */
  .ico-css{display:inline-block;position:relative;color:var(--accent)}
  .ico-search{width:16px;height:16px;border:2px solid var(--accent);border-radius:50%}
  .ico-search::after{
    content:'';position:absolute;width:7px;height:2px;background:var(--accent);
    border-radius:2px;right:-6px;bottom:-2px;transform:rotate(45deg);transform-origin:left center;
  }
  .ico-cart{
    width:18px;height:14px;border:2px solid var(--accent);border-top:none;
    border-radius:0 0 4px 4px;position:relative;margin-top:4px;
  }
  .ico-cart::before{
    content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:12px;height:8px;border:2px solid var(--accent);border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .ico-cart::after{
    content:'';position:absolute;bottom:-6px;left:2px;width:4px;height:4px;
    background:var(--accent);border-radius:50%;box-shadow:10px 0 0 var(--accent);
  }

  /* BALANCE */
  .balance-card{
    margin:16px;padding:16px;
    background:linear-gradient(135deg, #1a1f28 0%, #12161c 100%);
    border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:center;justify-content:space-between;
    position:relative;overflow:hidden;
  }
  .balance-card::before{
    content:'';position:absolute;right:-40px;top:-40px;
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,212,0,0.15), transparent 70%);
  }
  .balance-info{position:relative;z-index:1}
  .balance-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .balance-value{font-size:28px;font-weight:800;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums}
  .balance-value.danger{color:var(--red)}
  .topup-btn{
    position:relative;z-index:1;padding:10px 16px;border-radius:10px;
    background:var(--accent);color:#000;border:none;font-weight:700;font-size:13px;cursor:pointer;
  }

  /* HERO */
  .hero{padding:8px 16px 4px;display:flex;align-items:center;gap:10px}
  .hero h1{font-size:20px;font-weight:700}
  .tag{
    background:rgba(34,197,94,.15);color:var(--green);
    padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  }

  /* FILTERS */
  .filters{
    display:flex;gap:8px;padding:12px 16px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 14px;border-radius:20px;
    background:var(--card);border:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .chip.active{background:var(--accent);color:#000;border-color:var(--accent)}

  /* MATCHES */
  .list{display:flex;flex-direction:column;gap:12px;padding:4px 16px 100px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
  .empty .big{font-size:16px;color:var(--text);font-weight:600;margin-bottom:8px}

  .match{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;animation:fadeIn .35s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .match-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;border-bottom:1px solid var(--line);
    font-size:11px;color:var(--muted);gap:8px;
  }
  .match-head .tour{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live{
    color:var(--red);font-weight:700;display:flex;align-items:center;gap:5px;flex:0 0 auto;
  }
  .live::before{
    content:'';width:6px;height:6px;border-radius:50%;
    background:var(--red);animation:pulse 1.2s infinite;
  }
  @keyframes pulse{50%{opacity:.25}}

  .teams{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .team{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
  .team .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}

  .odds{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}
  .odd{
    padding:12px 6px;text-align:center;cursor:pointer;
    border-right:1px solid var(--line);transition:background .15s;
    background:transparent;color:inherit;border-top:none;border-bottom:none;border-left:none;
    font-family:inherit;min-height:52px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    position:relative;
  }
  .odd:last-child{border-right:none}
  .odd:active{background:#1f2630}
  .odd .label{font-size:10px;color:var(--muted);margin-bottom:3px}
  .odd .val{font-size:15px;font-weight:700;color:var(--green)}
  .odd.selected{background:rgba(255,212,0,.12)}
  .odd.selected .val{color:var(--accent)}
  .odd.selected::after{
    content:'';position:absolute;top:6px;right:8px;
    width:6px;height:6px;border-radius:50%;background:var(--accent);
  }

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(10,13,18,0.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));
    z-index:30;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--muted);text-decoration:none;font-size:10px;font-weight:600;
    padding:4px 0;cursor:pointer;
  }
  .nav-item.active{color:var(--accent)}
  .nav-ico{width:18px;height:18px;display:block;position:relative;color:inherit}
  .nav-ico.line::before{
    content:'';position:absolute;left:0;top:3px;width:18px;height:2px;
    background:currentColor;border-radius:2px;
    box-shadow:0 5px 0 currentColor, 0 10px 0 currentColor;
  }
  .nav-ico.live::before{
    content:'';position:absolute;left:1px;top:1px;width:16px;height:16px;
    border:2px solid currentColor;border-radius:50%;
  }
  .nav-ico.live::after{
    content:'';position:absolute;left:7px;top:7px;width:4px;height:4px;
    background:currentColor;border-radius:50%;
  }
  .nav-ico.admin::before{
    content:'';position:absolute;left:0;top:0;width:18px;height:18px;
    border:2px solid currentColor;border-radius:50%;
  }
  .nav-ico.admin::after{
    content:'';position:absolute;left:5px;top:5px;width:8px;height:8px;
    border:2px solid currentColor;border-radius:50%;
  }
  .nav-ico.user::before{
    content:'';position:absolute;left:5px;top:0;width:8px;height:8px;
    border:2px solid currentColor;border-radius:50%;
  }
  .nav-ico.user::after{
    content:'';position:absolute;left:1px;top:10px;width:16px;height:8px;
    border:2px solid currentColor;border-bottom:none;border-radius:10px 10px 0 0;
  }

  /* CART FAB */
  .cart-fab{
    position:fixed;right:16px;bottom:calc(76px + var(--safe-bottom));
    width:54px;height:54px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(255,212,0,.35);
    cursor:pointer;z-index:25;
    transition:transform .2s ease;
  }
  .cart-fab:active{transform:scale(0.92)}
  .cart-fab.pulse{animation:cartPulse .5s ease}
  @keyframes cartPulse{
    0%{transform:scale(1)}
    40%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }
  .cart-fab .ico-cart{border-color:#000}
  .cart-fab .ico-cart::before{border-color:#000}
  .cart-fab .ico-cart::after{background:#000;box-shadow:10px 0 0 #000}
  .cart-badge{
    position:absolute;top:-4px;right:-4px;
    background:var(--red);color:#fff;font-size:11px;font-weight:700;
    min-width:20px;height:20px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    padding:0 5px;border:2px solid var(--bg);
  }

  /* MODALS */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    z-index:100;display:none;
    align-items:flex-end;justify-content:center;
    animation:fadeIn .2s ease;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:520px;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + var(--safe-bottom));
    max-height:90vh;overflow-y:auto;
    animation:slideUp .3s ease;
    border-top:1px solid var(--line);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .sheet-head h2{font-size:18px;font-weight:700}
  .close-btn{
    width:32px;height:32px;border-radius:10px;
    background:var(--card2);border:1px solid var(--line);
    color:var(--muted);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }

  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:6px;
  }
  .field input{
    width:100%;padding:12px 14px;
    background:var(--bg);border:1px solid var(--line);
    border-radius:10px;color:var(--text);font-size:15px;
    font-family:inherit;outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  .submit-btn{
    width:100%;padding:14px;border-radius:12px;
    background:var(--accent);color:#000;border:none;
    font-weight:700;font-size:15px;cursor:pointer;margin-top:6px;
  }
  .submit-btn:active{opacity:.85}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed}
  .danger-btn{
    width:100%;padding:12px;border-radius:12px;
    background:transparent;color:var(--red);
    border:1px solid rgba(239,68,68,0.4);
    font-weight:600;font-size:14px;cursor:pointer;margin-top:8px;
  }

  /* ADMIN LIST */
  .admin-item{
    display:flex;align-items:center;gap:12px;
    padding:12px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
  }
  .admin-item-info{flex:1;min-width:0}
  .admin-item-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-item-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del-btn{
    flex:0 0 auto;width:34px;height:34px;border-radius:10px;
    background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
    color:var(--red);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  }

  /* TOAST */
  .toast{
    position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:12px 18px;border-radius:12px;
    font-size:13px;font-weight:600;z-index:200;
    opacity:0;pointer-events:none;transition:all .25s ease;
    white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{border-color:rgba(34,197,94,0.5)}
  .toast.error{border-color:rgba(239,68,68,0.5)}

  /* BET PANEL (купоны) */
  .bet-summary{
    background:var(--bg);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:14px;
  }
  .bet-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:12px}
  .bet-row .k{color:var(--muted)}
  .bet-row .v{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bet-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:15px}
  .bet-row.total .v{color:var(--accent);font-size:18px}

  .amount-quick{display:flex;gap:6px;margin-top:8px}
  .amount-quick button{
    flex:1;padding:8px;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  }
  .amount-quick button:active{background:var(--card2)}

  /* COUPON ITEMS */
  .coupon-list{
    max-height:280px;
    overflow-y:auto;
    margin-bottom:14px;
  }
  .coupon-item{
    display:flex;align-items:center;gap:10px;
    padding:12px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
    animation:fadeIn .25s ease;
  }
  .coupon-item-body{flex:1;min-width:0}
  .coupon-item-match{
    font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .coupon-item-meta{
    font-size:11px;color:var(--muted);margin-top:3px;
    display:flex;gap:8px;
  }
  .coupon-item-meta b{color:var(--accent);font-weight:700}
  .coupon-remove{
    flex:0 0 auto;
    width:30px;height:30px;border-radius:8px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;line-height:1;
  }
  .coupon-remove:active{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.3)}

  .coupon-empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:30px 10px;
  }
  .coupon-empty .ic{
    display:block;
    margin:0 auto 12px;
    opacity:0.5;
  }
</style>
</head>
<body>

<header>
  <div class="logo">CYBER<span>BET</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="searchBtn" aria-label="Поиск">
      <span class="ico-css ico-search"></span>
    </button>
    <button class="btn-login" id="loginBtn">Вход</button>
  </div>
</header>

<div class="balance-card">
  <div class="balance-info">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="balanceValue">500 ₽</div>
  </div>
  <button class="topup-btn" id="topupBtn">Пополнить</button>
</div>

<section class="hero">
  <h1>Standoff 2</h1>
  <span class="tag" id="matchCount">0 матчей</span>
</section>

<div class="filters">
  <div class="chip active" data-filter="all">Все</div>
  <div class="chip" data-filter="live">Live</div>
  <div class="chip" data-filter="today">Сегодня</div>
  <div class="chip" data-filter="tomorrow">Завтра</div>
</div>

<div class="list" id="matchList"></div>

<div class="cart-fab" id="cartFab">
  <span class="ico-css ico-cart"></span>
  <span class="cart-badge" id="cartBadge" style="display:none">0</span>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" data-tab="line"><span class="nav-ico line"></span>Линия</a>
  <a class="nav-item" data-tab="live"><span class="nav-ico live"></span>Live</a>
  <a class="nav-item" data-tab="admin"><span class="nav-ico admin"></span>Админ</a>
  <a class="nav-item" data-tab="profile"><span class="nav-ico user"></span>Профиль</a>
</nav>

<!-- АДМИНКА -->
<div class="overlay" id="adminOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Админ-панель</h2>
      <button class="close-btn" data-close>×</button>
    </div>

    <div class="field">
      <label>Турнир</label>
      <input type="text" id="fTour" placeholder="ESL Snapdragon • Bo3">
    </div>
    <div class="field">
      <label>Команда 1</label>
      <input type="text" id="fTeam1" placeholder="Team Spirit">
    </div>
    <div class="field">
      <label>Команда 2</label>
      <input type="text" id="fTeam2" placeholder="NAVI Junior">
    </div>
    <div class="field">
      <label>Время (Сегодня 21:00 / Завтра / Live)</label>
      <input type="text" id="fTime" placeholder="Сегодня 21:00">
    </div>
    <div class="field">
      <label>Коэффициенты</label>
      <div class="row">
        <input type="number" step="0.01" min="1" id="fK1" placeholder="П1" value="1.85">
        <input type="number" step="0.01" min="1" id="fKX" placeholder="X" value="7.00">
        <input type="number" step="0.01" min="1" id="fK2" placeholder="П2" value="1.95">
      </div>
    </div>
    <button class="submit-btn" id="addMatchBtn">+ Добавить матч</button>

    <div style="margin-top:24px">
      <div class="sheet-head" style="margin-bottom:12px">
        <h2 style="font-size:14px">Существующие матчи</h2>
      </div>
      <div id="adminList"></div>
    </div>
  </div>
</div>

<!-- КУПОН -->
<div class="overlay" id="couponOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Купон <span id="couponCount" style="color:var(--accent);font-size:15px">(0)</span></h2>
      <button class="close-btn" data-close>×</button>
    </div>

    <div class="coupon-list" id="couponList"></div>

    <div class="bet-summary" id="couponSummary" style="display:none">
      <div class="bet-row">
        <span class="k">Событий</span>
        <span class="v" id="couponEvents">0</span>
      </div>
      <div class="bet-row">
        <span class="k">Общий коэффициент</span>
        <span class="v" id="couponTotalCoef" style="color:var(--accent)">1.00</span>
      </div>
      <div class="bet-row total">
        <span class="k">Возможный выигрыш</span>
        <span class="v" id="couponWin">0 ₽</span>
      </div>
    </div>

    <div class="field" id="couponAmountField" style="display:none">
      <label>Сумма ставки</label>
      <input type="number" id="couponAmount" placeholder="100" value="100" min="10" step="10">
      <div class="amount-quick">
        <button data-camount="50">50</button>
        <button data-camount="100">100</button>
        <button data-camount="250">250</button>
        <button data-camount="500">500</button>
      </div>
    </div>

    <button class="submit-btn" id="placeCouponBtn" style="display:none">Сделать ставку</button>
    <button class="danger-btn" id="clearCouponBtn" style="display:none">Очистить купон</button>
  </div>
</div>

<!-- ПОИСК -->
<div class="overlay" id="searchOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Поиск матчей</h2>
      <button class="close-btn" data-close>×</button>
    </div>
    <div class="field">
      <input type="text" id="searchInput" placeholder="Название команды или турнира...">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- ВХОД -->
<div class="overlay" id="loginOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Вход</h2>
      <button class="close-btn" data-close>×</button>
    </div>
    <div class="field">
      <label>Логин</label>
      <input type="text" id="loginUser" placeholder="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="submit-btn" id="doLoginBtn">Войти</button>
  </div>
</div>

<!-- ПОПОЛНЕНИЕ -->
<div class="overlay" id="topupOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Пополнение</h2>
      <button class="close-btn" data-close>×</button>
    </div>
    <div class="field">
      <label>Сумма</label>
      <input type="number" id="topupAmount" placeholder="1000" value="1000" step="100">
      <div class="amount-quick">
        <button data-topup="500">500 ₽</button>
        <button data-topup="1000">1000 ₽</button>
        <button data-topup="5000">5000 ₽</button>
      </div>
    </div>
    <button class="submit-btn" id="doTopupBtn">Пополнить</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div class="overlay" id="profileOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Профиль</h2>
      <button class="close-btn" data-close>×</button>
    </div>
    <div class="bet-summary">
      <div class="bet-row"><span class="k">Игрок</span><span class="v">Гость</span></div>
      <div class="bet-row"><span class="k">Баланс</span><span class="v" id="profileBalance" style="color:var(--accent)">500 ₽</span></div>
      <div class="bet-row"><span class="k">Сделано ставок</span><span class="v" id="profileBets">0</span></div>
    </div>
    <button class="danger-btn" id="resetBtn">Сбросить всё (матчи + баланс + купон)</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ============ СОСТОЯНИЕ ============ */
  var STORAGE_KEY = 'cyberbet_state_v2';
  var state = {
    balance: 500,
    matches: [],
    betsCount: 0,
    nextId: 1,
    coupon: [] // [{matchId, team1, team2, tour, choice, coef}]
  };

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var p = JSON.parse(saved);
      if (p && typeof p === 'object') {
        if (typeof p.balance === 'number') state.balance = p.balance;
        if (Array.isArray(p.matches)) state.matches = p.matches;
        if (typeof p.betsCount === 'number') state.betsCount = p.betsCount;
        if (typeof p.nextId === 'number') state.nextId = p.nextId;
        if (Array.isArray(p.coupon)) state.coupon = p.coupon;
      }
    }
  } catch(e){}

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }

  /* ============ ХЕЛПЕРЫ ============ */
  function $(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtMoney(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
  }
  function plural(n, forms){
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  }

  /* ============ TOAST ============ */
  var toastTimer;
  function toast(msg, type){
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type || 'success');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = 'toast ' + (type || 'success'); }, 2200);
  }

  /* ============ МОДАЛКИ ============ */
  function openModal(id){
    var el = $(id);
    if (el) el.classList.add('show');
  }
  function closeModal(el){
    if (typeof el === 'string') el = $(el);
    if (el) el.classList.remove('show');
  }
  function closeAllModals(){
    document.querySelectorAll('.overlay.show').forEach(function(o){ o.classList.remove('show'); });
  }

  document.querySelectorAll('.overlay').forEach(function(ov){
    ov.addEventListener('click', function(e){
      if (e.target === ov) closeModal(ov);
    });
  });
  document.querySelectorAll('[data-close]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var ov = btn.closest('.overlay');
      if (ov) closeModal(ov);
    });
  });

  /* ============ КУПОН: ЛОГИКА ============ */
  function isInCoupon(matchId, choice){
    return state.coupon.some(function(c){ return c.matchId === matchId && c.choice === choice; });
  }

  function addToCoupon(m){
    // Проверяем, нет ли уже ставки на этот матч (любой исход)
    var existing = state.coupon.find(function(c){ return c.matchId === m.id; });
    if (existing){
      // Заменяем исход
      state.coupon = state.coupon.filter(function(c){ return c.matchId !== m.id; });
    }
    state.coupon.push({
      matchId: m.id,
      team1: m.team1,
      team2: m.team2,
      tour: m.tour,
      choice: m.choice,
      coef: m.coef
    });
  }

  function removeFromCoupon(matchId){
    state.coupon = state.coupon.filter(function(c){ return c.matchId !== matchId; });
  }

  function totalCoef(){
    if (state.coupon.length === 0) return 0;
    return state.coupon.reduce(function(acc, c){ return acc * c.coef; }, 1);
  }

  /* ============ РЕНДЕР КУПОНА ============ */
  function renderCoupon(){
    var badge = $('cartBadge');
    var n = state.coupon.length;
    if (n > 0){
      badge.textContent = n;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
    $('couponCount').textContent = '(' + n + ')';

    var listEl = $('couponList');
    var summary = $('couponSummary');
    var amountField = $('couponAmountField');
    var placeBtn = $('placeCouponBtn');
    var clearBtn = $('clearCouponBtn');

    if (n === 0){
      listEl.innerHTML =
        '<div class="coupon-empty">' +
          '<span class="ico-css ico-cart ic" style="transform:scale(1.4)"></span>' +
          'Купон пуст.<br>Нажми на коэффициент — событие попадёт сюда.' +
        '</div>';
      summary.style.display = 'none';
      amountField.style.display = 'none';
      placeBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      return;
    }

    listEl.innerHTML = state.coupon.map(function(c){
      return '' +
      '<div class="coupon-item">' +
        '<div class="coupon-item-body">' +
          '<div class="coupon-item-match">' + escapeHtml(c.team1) + ' — ' + escapeHtml(c.team2) + '</div>' +
          '<div class="coupon-item-meta">' +
            '<span>' + escapeHtml(c.choice) + '</span>' +
            '<b>' + Number(c.coef).toFixed(2) + '</b>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="coupon-remove" data-remove="' + c.matchId + '">×</button>' +
      '</div>';
    }).join('');

    listEl.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = Number(btn.getAttribute('data-remove'));
        removeFromCoupon(id);
        renderAll();
        toast('Удалено из купона', 'success');
      });
    });

    summary.style.display = 'block';
    amountField.style.display = 'block';
    placeBtn.style.display = 'block';
    clearBtn.style.display = 'block';

    $('couponEvents').textContent = n + ' ' + plural(n, ['событие','события','событий']);
    $('couponTotalCoef').textContent = totalCoef().toFixed(2);
    updateCouponWin();
  }

  function updateCouponWin(){
    var amount = parseFloat($('couponAmount').value) || 0;
    var win = amount * totalCoef();
    $('couponWin').textContent = fmtMoney(win);
  }

  $('couponAmount').addEventListener('input', updateCouponWin);

  document.querySelectorAll('[data-camount]').forEach(function(b){
    b.addEventListener('click', function(){
      $('couponAmount').value = b.getAttribute('data-camount');
      updateCouponWin();
    });
  });

  /* ============ РЕНДЕР БАЛАНСА И МАТЧЕЙ ============ */
  var currentFilter = 'all';

  function renderBalance(){
    $('balanceValue').textContent = fmtMoney(state.balance);
    $('balanceValue').classList.toggle('danger', state.balance <= 0);
    $('profileBalance').textContent = fmtMoney(state.balance);
    $('profileBets').textContent = state.betsCount;
  }

  function renderMatches(){
    var filtered = state.matches.filter(function(m){
      if (currentFilter === 'all') return true;
      if (currentFilter === 'live') return !!m.isLive;
      if (currentFilter === 'today') return /сегодня/i.test(m.time || '') && !m.isLive;
      if (currentFilter === 'tomorrow') return /завтра/i.test(m.time || '');
      return true;
    });

    $('matchCount').textContent = state.matches.length + ' ' +
      plural(state.matches.length, ['матч','матча','матчей']);

    if (filtered.length === 0){
      $('matchList').innerHTML =
        '<div class="empty">' +
          '<div class="big">Пока нет матчей</div>' +
          '<div>Открой «Админ» внизу, чтобы добавить первый матч</div>' +
        '</div>';
      return;
    }

    $('matchList').innerHTML = filtered.map(function(m){
      // Проверяем, что уже в купоне для этого матча
      var inCoupon = state.coupon.find(function(c){ return c.matchId === m.id; });
      var selChoice = inCoupon ? inCoupon.choice : null;

      function oddBtn(choice, coef){
        var sel = selChoice === choice ? ' selected' : '';
        return '<button type="button" class="odd' + sel + '" data-id="' + m.id + '" data-choice="' + choice + '" data-coef="' + coef + '">' +
          '<div class="label">' + choice + '</div>' +
          '<div class="val">' + Number(coef).toFixed(2) + '</div>' +
        '</button>';
      }

      return '' +
      '<div class="match" data-mid="' + m.id + '">' +
        '<div class="match-head">' +
          '<span class="tour">' + escapeHtml(m.tour || 'Матч') + '</span>' +
          (m.isLive ? '<span class="live">LIVE</span>' : '<span>' + escapeHtml(m.time || '') + '</span>') +
        '</div>' +
        '<div class="teams">' +
          '<div class="team"><span class="name">' + escapeHtml(m.team1) + '</span><span>—</span></div>' +
          '<div class="team"><span class="name">' + escapeHtml(m.team2) + '</span><span>—</span></div>' +
        '</div>' +
        '<div class="odds">' +
          oddBtn('П1', m.k1) +
          oddBtn('Ничья', m.kx) +
          oddBtn('П2', m.k2) +
        '</div>' +
      '</div>';
    }).join('');

    // Обработчики на коэффициенты
    $('matchList').querySelectorAll('.odd').forEach(function(btn){
      btn.addEventListener('click', function(){
        var matchId = Number(btn.getAttribute('data-id'));
        var choice = btn.getAttribute('data-choice');
        var coef = Number(btn.getAttribute('data-coef'));
        var m = state.matches.find(function(x){ return x.id === matchId; });
        if (!m) return;

        // Если этот же исход уже в купоне — убираем (toggle)
        var already = isInCoupon(matchId, choice);

        if (already){
          removeFromCoupon(matchId);
          toast('Убрано из купона', 'success');
        } else {
          addToCoupon({
            id: m.id, team1: m.team1, team2: m.team2, tour: m.tour,
            choice: choice, coef: coef
          });
          toast('Добавлено в купон: ' + choice + ' @ ' + coef.toFixed(2), 'success');
          // Пульс на корзине
          var fab = $('cartFab');
          fab.classList.remove('pulse');
          void fab.offsetWidth;
          fab.classList.add('pulse');
        }
        renderAll();
      });
    });
  }

  function renderAdminList(){
    if (state.matches.length === 0){
      $('adminList').innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">Матчей пока нет</div>';
      return;
    }
    $('adminList').innerHTML = state.matches.map(function(m){
      return '' +
      '<div class="admin-item">' +
        '<div class="admin-item-info">' +
          '<div class="admin-item-title">' + escapeHtml(m.team1) + ' — ' + escapeHtml(m.team2) + '</div>' +
          '<div class="admin-item-sub">' + escapeHtml(m.tour || '—') + ' • ' + escapeHtml(m.time || '—') + ' • ' +
            Number(m.k1).toFixed(2) + ' / ' + Number(m.kx).toFixed(2) + ' / ' + Number(m.k2).toFixed(2) +
          '</div>' +
        '</div>' +
        '<button type="button" class="del-btn" data-del="' + m.id + '">×</button>' +
      '</div>';
    }).join('');

    $('adminList').querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = Number(btn.getAttribute('data-del'));
        deleteMatch(id);
      });
    });
  }

  function renderAll(){
    renderBalance();
    renderMatches();
    renderAdminList();
    renderCoupon();
    save();
  }

  /* ============ ДОБАВЛЕНИЕ МАТЧА ============ */
  $('addMatchBtn').addEventListener('click', function(){
    var tour = $('fTour').value.trim();
    var t1 = $('fTeam1').value.trim();
    var t2 = $('fTeam2').value.trim();
    var time = $('fTime').value.trim();
    var k1 = parseFloat($('fK1').value);
    var kx = parseFloat($('fKX').value);
    var k2 = parseFloat($('fK2').value);

    if (!t1 || !t2){ toast('Введи названия обеих команд', 'error'); return; }
    if (!(k1 > 1) || !(kx > 1) || !(k2 > 1)){ toast('Коэффициенты должны быть > 1', 'error'); return; }

    var isLive = /live|лайв/i.test(time);

    state.matches.unshift({
      id: state.nextId++,
      tour: tour || 'Матч',
      team1: t1, team2: t2,
      time: time || 'Сегодня',
      k1: k1, kx: kx, k2: k2,
      isLive: isLive
    });

    $('fTour').value = '';
    $('fTeam1').value = '';
    $('fTeam2').value = '';
    $('fTime').value = '';

    renderAll();
    toast('Матч добавлен', 'success');
  });

  /* ============ УДАЛЕНИЕ МАТЧА ============ */
  function deleteMatch(id){
    state.matches = state.matches.filter(function(m){ return m.id !== id; });
    // Также убираем из купона
    state.coupon = state.coupon.filter(function(c){ return c.matchId !== id; });
    renderAll();
    toast('Матч удалён', 'success');
  }

  /* ============ ОФОРМЛЕНИЕ КУПОНА ============ */
  $('placeCouponBtn').addEventListener('click', function(){
    if (state.coupon.length === 0){
      toast('Купон пуст', 'error');
      return;
    }
    var amount = parseFloat($('couponAmount').value) || 0;
    if (amount < 10){ toast('Минимальная ставка — 10 ₽', 'error'); return; }
    if (amount > state.balance){ toast('Недостаточно средств', 'error'); return; }

    var coef = totalCoef();
    var win = amount * coef;
    var eventsCount = state.coupon.length;

    // Списываем
    state.balance -= amount;
    state.betsCount += 1;

    // Очищаем купон
    state.coupon = [];

    renderAll();
    closeModal('couponOverlay');

    toast('Ставка принята • ' + eventsCount + ' ' +
      plural(eventsCount, ['событие','события','событий']) +
      ' на ' + fmtMoney(amount), 'success');

    // Демо-выплата через 1.5 сек
    setTimeout(function(){
      state.balance += win;
      renderAll();
      toast('Выигрыш +' + fmtMoney(win), 'success');
    }, 1500);
  });

  /* ============ ОЧИСТКА КУПОНА ============ */
  $('clearCouponBtn').addEventListener('click', function(){
    if (state.coupon.length === 0) return;
    state.coupon = [];
    renderAll();
    toast('Купон очищен', 'success');
  });

  /* ============ ФИЛЬТРЫ ============ */
  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      currentFilter = chip.getAttribute('data-filter');
      renderMatches();
    });
  });

  /* ============ НИЖНЯЯ НАВИГАЦИЯ ============ */
  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      var tab = item.getAttribute('data-tab');
      document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
      item.classList.add('active');

      if (tab === 'admin') openModal('adminOverlay');
      else if (tab === 'profile') openModal('profileOverlay');
      else if (tab === 'live'){
        currentFilter = 'live';
        document.querySelectorAll('.chip').forEach(function(c){
          c.classList.toggle('active', c.getAttribute('data-filter') === 'live');
        });
        renderMatches();
      } else {
        currentFilter = 'all';
        document.querySelectorAll('.chip').forEach(function(c){
          c.classList.toggle('active', c.getAttribute('data-filter') === 'all');
        });
        renderMatches();
      }
    });
  });

  /* ============ КОРЗИНА ============ */
  $('cartFab').addEventListener('click', function(){
    renderCoupon();
    $('couponAmount').value = $('couponAmount').value || 100;
    openModal('couponOverlay');
  });

  /* ============ ПОИСК ============ */
  $('searchBtn').addEventListener('click', function(){
    $('searchInput').value = '';
    $('searchResults').innerHTML = '';
    openModal('searchOverlay');
    setTimeout(function(){ $('searchInput').focus(); }, 300);
  });

  $('searchInput').addEventListener('input', function(){
    var q = $('searchInput').value.trim().toLowerCase();
    if (!q){ $('searchResults').innerHTML = ''; return; }
    var found = state.matches.filter(function(m){
      return (m.team1 + ' ' + m.team2 + ' ' + (m.tour || '')).toLowerCase().indexOf(q) !== -1;
    });
    if (found.length === 0){
      $('searchResults').innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">Ничего не найдено</div>';
      return;
    }
    $('searchResults').innerHTML = found.map(function(m){
      return '<div class="admin-item"><div class="admin-item-info">' +
        '<div class="admin-item-title">' + escapeHtml(m.team1) + ' — ' + escapeHtml(m.team2) + '</div>' +
        '<div class="admin-item-sub">' + escapeHtml(m.tour || '—') + ' • ' + escapeHtml(m.time || '—') + '</div>' +
      '</div></div>';
    }).join('');
  });

  /* ============ ВХОД ============ */
  $('loginBtn').addEventListener('click', function(){ openModal('loginOverlay'); });
  $('doLoginBtn').addEventListener('click', function(){
    var u = $('loginUser').value.trim();
    if (!u){ toast('Введи логин', 'error'); return; }
    closeModal('loginOverlay');
    toast('Добро пожаловать, ' + u, 'success');
  });

  /* ============ ПОПОЛНЕНИЕ ============ */
  $('topupBtn').addEventListener('click', function(){
    $('topupAmount').value = 1000;
    openModal('topupOverlay');
  });
  document.querySelectorAll('[data-topup]').forEach(function(b){
    b.addEventListener('click', function(){
      $('topupAmount').value = b.getAttribute('data-topup');
    });
  });
  $('doTopupBtn').addEventListener('click', function(){
    var amount = parseFloat($('topupAmount').value) || 0;
    if (amount <= 0){ toast('Введи сумму', 'error'); return; }
    state.balance += amount;
    renderAll();
    closeModal('topupOverlay');
    toast('Пополнено на ' + fmtMoney(amount), 'success');
  });

  /* ============ СБРОС ============ */
  $('resetBtn').addEventListener('click', function(){
    if (!confirm('Сбросить всё: матчи, купон и баланс?')) return;
    state = { balance: 500, matches: [], betsCount: 0, nextId: 1, coupon: [] };
    renderAll();
    closeAllModals();
    toast('Всё сброшено. Баланс: 500 ₽', 'success');
  });

  /* ============ ЗАПРЕТ ЗУМА ============ */
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive:false });
  ['gesturestart','gesturechange','gestureend'].forEach(function(evt){
    document.addEventListener(evt, function(e){ e.preventDefault(); });
  });
  document.addEventListener('wheel', function(e){
    if (e.ctrlKey) e.preventDefault();
  }, { passive:false });

  /* ============ СТАРТ ============ */
  renderAll();

})();
</script>

</body>
</html>
