<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>S2 Arena — матчи 5×5 в Standoff 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1118; --panel:#141d28; --panel2:#1b2735; --line:#2a3948;
  --text:#e8edf3; --mute:#8b9cb0;
  --ct:#4ea1ff; --t:#ffb238; --ok:#3fd68a; --bad:#ff5f56;
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --cut:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font:15px/1.5 var(--body);min-height:100vh;
  background-color:var(--ink);
  background-image:
    linear-gradient(rgba(139,156,176,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(139,156,176,.05) 1px,transparent 1px);
  background-size:36px 36px;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:.02em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ct);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* ---------- шапка и навигация ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,17,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;height:58px}
.brand{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em;cursor:pointer;user-select:none}
.brand b{color:var(--t);font-weight:700}
.nav-d{display:none;gap:4px;margin-left:8px}
.nav-btn{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mute);padding:8px 12px;cursor:pointer;font-weight:700}
.nav-btn svg{width:18px;height:18px;fill:currentColor}
.nav-btn.on{color:var(--text)}
.nav-btn.on svg{color:var(--t)}
.nav-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--t)}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer}
.me-chip .nick{font-weight:800;line-height:1.1}
.me-chip .rt{font-family:var(--disp);color:var(--t);font-size:15px;line-height:1.1}
.nav-m{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(11,17,24,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-m .nav-btn{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:9px 2px}
main{padding-top:16px;padding-bottom:96px}
@media (min-width:860px){
  .nav-d{display:flex}.nav-m{display:none}main{padding-bottom:48px}
}

/* ---------- панели и кнопки ---------- */
.panel{
  background:var(--panel);border-left:3px solid var(--line);padding:16px;margin-bottom:12px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);
}
.panel.ct{border-left-color:var(--ct)}
.panel.t{border-left-color:var(--t)}
.panel.ok{border-left-color:var(--ok)}
.panel.bad{border-left-color:var(--bad)}
.panel>h2{margin-bottom:10px}
.btn{
  display:block;width:100%;border:0;cursor:pointer;background:var(--t);color:#1c1300;
  font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.04em;padding:13px 18px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.ct{background:var(--ct);color:#04121f}
.btn.bad{background:var(--bad);color:#210503}
.btn.sm{display:inline-block;width:auto;font-size:15px;padding:8px 14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:grid;gap:10px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;padding:12px 13px;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:0;
}
textarea{resize:vertical;min-height:84px}
label.f{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.err{color:var(--bad);min-height:20px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;margin-left:6px;vertical-align:middle;background:var(--panel2);color:var(--mute)}
.badge.own{background:var(--t);color:#1c1300}
.badge.adm{background:var(--ct);color:#04121f}
.badge.ban{background:var(--bad);color:#210503}
.empty{color:var(--mute);padding:14px 0;text-align:center}

/* ---------- аватары и ранги ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-family:var(--disp)}
.ins{display:block;flex:none}

/* ---------- радар: главный экран ---------- */
.online{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;white-space:nowrap}
.online i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.online.on i{background:var(--ok)}
.radar{
  position:relative;width:min(76vw,300px);aspect-ratio:1;margin:14px auto 10px;border-radius:50%;
  background:
    linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,
    linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,
    repeating-radial-gradient(circle,transparent 0 22%,rgba(78,161,255,.22) 22% calc(22% + 1px)),
    #0c1520;
  box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;
}
.sweep{position:absolute;inset:0;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,rgba(78,161,255,0) 0deg,rgba(78,161,255,.42) 70deg,rgba(78,161,255,0) 71deg)}
.radar.on .sweep{opacity:1;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--t);box-shadow:0 0 0 4px rgba(255,178,56,.18)}
.blip.me{background:var(--ct);box-shadow:0 0 0 4px rgba(78,161,255,.25)}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.core b{font-family:var(--disp);font-size:44px;font-weight:600;line-height:1;text-shadow:0 0 12px var(--ink),0 0 4px var(--ink)}
.core small{color:var(--mute);text-shadow:0 0 8px var(--ink)}
.slots{display:flex;gap:4px;margin:12px 0}
.slots i{flex:1;height:8px;background:var(--panel2)}
.slots i.on{background:var(--t)}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .grow{flex:1;font-weight:700}
.steps{margin:0;padding-left:20px;color:var(--mute)}
.steps li{margin:4px 0}

/* ---------- матч ---------- */
.versus{display:grid;gap:12px}
@media (min-width:600px){.versus{grid-template-columns:1fr 1fr}}
.team{background:var(--panel);padding:14px;border-top:3px solid var(--ct)}
.team.b{border-top-color:var(--t)}
.team .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.team.a h3{color:var(--ct)}.team.b h3{color:var(--t)}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl .grow{flex:1;font-weight:700}
.pl.me .grow{color:var(--t)}
.cap{color:var(--t);font-size:12px;font-weight:800;margin-left:6px}
.code{font-family:var(--disp);font-size:34px;letter-spacing:.06em;word-break:break-all}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .btn{background:var(--panel2);color:var(--text)}
.pick .btn.on[data-v="A"]{background:var(--ct);color:#04121f}
.pick .btn.on[data-v="B"]{background:var(--t);color:#1c1300}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:10px 0}
.bignum{font-family:var(--disp);font-size:56px;line-height:1}
.win{color:var(--ok)}.lose{color:var(--bad)}

/* ---------- таблицы и списки ---------- */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-of-type{border-top:0}
.lrow:hover{background:var(--panel2)}
.lrow.me{background:rgba(255,178,56,.08)}
.lrow .pos{width:26px;text-align:center;font-family:var(--disp);font-size:18px;color:var(--mute)}
.lrow .pos.top{color:var(--t)}
.lrow .grow{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .rt{font-family:var(--disp);font-size:20px;min-width:52px;text-align:right}
.lrow .wl{color:var(--mute);font-size:13px;min-width:46px;text-align:right}
details.panel summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.panel summary::-webkit-details-marker{display:none}
.mscore{font-family:var(--disp);font-size:26px}
.d-pos{color:var(--ok)}.d-neg{color:var(--bad)}

/* ---------- профиль ---------- */
.hero{display:flex;gap:16px;align-items:center}
.hero h1{display:flex;align-items:center;flex-wrap:wrap}
.tierline{display:flex;align-items:center;gap:8px;font-weight:800}
.meter{height:8px;background:var(--panel2);margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--t)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel2);padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{width:40px;height:40px;border:2px solid transparent;background:var(--ink);cursor:pointer;font-size:20px;padding:0}
.picker button.on{border-color:var(--t)}
.picker.colors button{border-radius:50%}
svg.spark{width:100%;height:64px;display:block;margin-top:12px}

/* ---------- вход / регистрация ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;position:relative}
.auth .brand{font-size:36px;text-align:center;margin-bottom:6px;cursor:default}
.auth .lead{text-align:center;color:var(--mute);margin-bottom:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);margin-bottom:14px}
.seg button{background:none;border:0;padding:11px;cursor:pointer;color:var(--mute);font-weight:800}
.seg button.on{background:var(--panel2);color:var(--text)}

.field{display:block}
.field .in-wrap{position:relative}
.field .in-wrap input{padding-right:44px}
.field .status{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:14px;color:var(--mute)}
.field .hint{color:var(--mute);font-size:12px;margin-top:4px;line-height:1.35}
.field .err{color:var(--bad);font-size:13px;min-height:16px;margin-top:2px}
.field.has-err input{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;padding:8px;display:grid;place-items:center}
.eye:hover{color:var(--text)}
.eye.on{color:var(--t)}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.pw-meter i{height:4px;background:var(--panel2);transition:background .2s}
.pw-hint{margin-top:4px;transition:color .2s}
.agree{display:flex;gap:10px;align-items:flex-start;color:var(--mute);font-size:13px;line-height:1.4;cursor:pointer;padding:2px 0}
.agree input{accent-color:var(--t);width:16px;height:16px;margin-top:2px;flex:none}
.agree b{color:var(--text);font-weight:700}
#a-err.big{min-height:20px;margin:4px 0 0}
.center{text-align:center}
.lnk{color:var(--t);text-decoration:none;font-weight:700}
.lnk:hover{text-decoration:underline}
#a-go{position:relative;display:grid;place-items:center}
#a-go .spin{position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#1c1300;opacity:0;transition:opacity .15s}
#a-go.loading{pointer-events:none}
#a-go.loading .spin{opacity:1;animation:spin .8s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.field.has-err input{animation:shake .25s ease-out}
@media (max-width:420px){
  .auth-card{padding:18px 14px}
  .auth .brand{font-size:30px}
}

/* ---------- уведомления ---------- */
#toasts{position:fixed;left:0;right:0;top:66px;z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 16px}
.toast{background:var(--panel2);border-left:3px solid var(--ct);padding:10px 14px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.found{position:fixed;inset:0;z-index:70;background:rgba(11,17,24,.94);display:grid;place-items:center;text-align:center;animation:fin .25s}
.found h1{font-size:clamp(40px,12vw,84px);color:var(--t);letter-spacing:.05em}
@keyframes fin{from{opacity:0}}

/* ---------- админка ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;background:var(--panel);border:0;color:var(--mute);padding:10px 14px;cursor:pointer;font-weight:800}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--t)}
.adm-actions{display:flex;flex-wrap:wrap;gap:6px}
.rep{font-size:13px;color:var(--t);margin:4px 0}
.logrow{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.logrow:first-of-type{border-top:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* =====================  НАСТРОЙКИ  ===================== */
const SUPABASE_URL = 'https://zwrczkwtzzfywgqprmrt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyY3prd3R6emZ5d2dxcHJtcnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4OTc2MDQzNywiZXhwIjoyMTA1MzM2NDM3fQ.2OdASwhJVUUoG_uvKc03DKFmZtOm5GPFgBjQAkVlJ5Y';
const EMAIL_DOMAIN = '@s2arena.app';

/* =====================  УТИЛИТЫ  ===================== */
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deb = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000 | 0);
  if (s < 60) return 'только что';
  if (s < 3600) return (s / 60 | 0) + ' мин назад';
  if (s < 86400) return (s / 3600 | 0) + ' ч назад';
  return (s / 86400 | 0) + ' дн назад';
}
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3300);
  setTimeout(() => t.remove(), 3800);
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  const map = [
    ['Invalid login', 'Неверный ник или пароль'], ['already registered', 'Этот ник уже занят'],
    ['Database error saving', 'Не удалось создать профиль — проверь ник и что SQL из schema.sql выполнен'],
    ['banned', 'Аккаунт заблокирован'], ['already in match', 'Ты уже в матче'],
    ['not admin', 'Нужны права админа'], ['not owner', 'Это может только владелец'],
    ['only captains', 'Результат вводят только капитаны'], ['only host', 'Код комнаты вводит хост'],
    ['match closed', 'Матч уже закрыт'], ['not allowed', 'Это действие запрещено'],
    ['rate limit', 'Слишком часто, подожди немного'], ['Failed to fetch', 'Нет связи с сервером']
  ];
  for (const [k, v] of map) if (m.includes(k)) return v;
  return m || 'Что-то пошло не так';
}

/* ранги */
const TIERS = [
  { n: 'Рекрут', min: 0, c: '#8b9cb0' }, { n: 'Страж', min: 900, c: '#6fb4ff' },
  { n: 'Ветеран', min: 1100, c: '#4ea1ff' }, { n: 'Элита', min: 1300, c: '#ffb238' },
  { n: 'Мастер', min: 1500, c: '#ff8a3d' }, { n: 'Легенда', min: 1800, c: '#ff5f56' }
];
const tierIdx = r => { let i = 0; TIERS.forEach((t, k) => { if (r >= t.min) i = k; }); return i; };
const tier = r => TIERS[tierIdx(r)];
const nextTier = r => TIERS[tierIdx(r) + 1] || null;
function insignia(r, size = 26) {
  const n = tierIdx(r) + 1, t = TIERS[n - 1], h = n * 7 + 9;
  let p = '';
  for (let i = 0; i < n; i++) p += `<path d="M4 ${i * 7 + 12} L16 ${i * 7 + 6} L28 ${i * 7 + 12}"/>`;
  return `<svg class="ins" viewBox="0 0 32 ${h}" width="${size}" height="${Math.round(size * h / 32)}" fill="none" stroke="${t.c}" stroke-width="3" stroke-linecap="square" aria-label="${t.n}">${p}</svg>`;
}
const AV_COLORS = ['#4ea1ff', '#ffb238', '#3fd68a', '#ff5f56', '#b48cff', '#2fd0d0', '#ff8ab3', '#c7d36b'];
const AV_EMOJI = ['🎯', '🔫', '🦊', '🐺', '🐉', '💀', '🚀', '👑', '⚡', '🔥', '🧠', '🦅'];
function avatar(p, size = 40) {
  const c = AV_COLORS[(p.color || 0) % 8];
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .5)}px;background:${c}2e;box-shadow:inset 0 0 0 2px ${c}">${esc(p.avatar || '🎯')}</span>`;
}
function letterAv(nick, size = 32) {
  const c = AV_COLORS[hash(nick) % 8];
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .45)}px;background:${c}2e;box-shadow:inset 0 0 0 2px ${c};color:${c}">${esc(nick.slice(0, 1).toUpperCase())}</span>`;
}
const roleBadge = p => p.banned ? '<span class="badge ban">Бан</span>' : p.role === 'owner' ? '<span class="badge own">Владелец</span>' : p.role === 'admin' ? '<span class="badge adm">Админ</span>' : '';
function blip(key) { const h = hash(key), a = (h % 360) * Math.PI / 180, r = 12 + ((h >>> 9) % 32); return { x: 50 + Math.cos(a) * r, y: 50 + Math.sin(a) * r }; }
const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  rating: '<path d="M5 20V10h4v10zM10 20V4h4v16zM15 20v-7h4v7z"/>',
  matches: '<path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>',

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let dismissedIds; try { dismissedIds = new Set(JSON.parse(lsGet('s2a_dismissed') || '[]')); } catch (e) { dismissedIds = new Set(); }
const S = {
  session: null, me: null, page: 'play', authMode: 'login',
  settings: { team_size: '5' }, queue: [], inQueue: false, joinedAt: 0,
  match: null, mplayers: [], rep: { winner: null },
  board: [], recent: [], online: 0, conn: 'connecting',

  adminTab: 'matches', adm: { matches: [], players: [], log: [], q: '' },
  dirty: false, ch: null, pch: null, hb: null, tick: null, roomEdit: false
};
const isAdmin = () => !!S.me && (S.me.role === 'admin' || S.me.role === 'owner');
const isOwner = () => !!S.me && S.me.role === 'owner';

/* =====================  ЗАГРУЗКА ДАННЫХ  ===================== */
async function loadMe() {
  const { data } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  S.me = data;
}
async function loadSettings() {
  const { data } = await sb.from('settings').select('*');
  (data || []).forEach(r => { S.settings[r.key] = r.value; });
}
async function loadQueue() {
  const { data } = await sb.from('queue').select('*').order('joined_at');
  S.queue = data || [];
  const mine = S.queue.find(q => q.user_id === S.me.id);
  S.inQueue = !!mine;
  S.joinedAt = mine ? new Date(mine.joined_at).getTime() : 0;
}
async function loadMatch() {
  const { data } = await sb.from('match_players').select('match_id, matches!inner(*)')
    .eq('user_id', S.me.id).order('created_at', { ascending: false }).limit(1);
  const row = data && data[0];
  let m = null;
  if (row) {
    const mm = row.matches;
    const open = mm.status === 'live' || mm.status === 'review';
    const fresh = Date.now() - new Date(mm.finished_at || mm.created_at).getTime() < 10 * 60 * 1000;
    if (open || (!dismissedIds.has(mm.id) && fresh)) m = mm;
  }
  if (!m) { S.match = null; S.mplayers = []; return; }
  const { data: pl } = await sb.from('match_players').select('*').eq('match_id', m.id).order('rating_before', { ascending: false });
  S.match = m; S.mplayers = pl || [];
}
async function loadBoard() {
  const { data } = await sb.from('profiles')
    .select('id,nickname,rating,wins,losses,matches_played,avatar,color,role,banned')
    .eq('banned', false).order('rating', { ascending: false }).limit(50);
  S.board = data || [];
}
async function loadRecent() {
  const { data } = await sb.from('matches').select('*, match_players(nickname,team,delta,is_captain)')
    .eq('status', 'finished').order('finished_at', { ascending: false }).limit(20);
  S.recent = data || [];
}
async function loadProfile(id) {
  const [a, b] = await Promise.all([
    sb.from('profiles').select('*').eq('id', id).maybeSingle(),
    sb.from('match_players').select('team,delta,rating_before,rating_after,created_at,matches!inner(status,winner,score_a,score_b,finished_at)')
      .eq('user_id', id).eq('matches.status', 'finished').order('created_at', { ascending: false }).limit(20)
  ]);
  S.pv = { p: a.data, hist: b.data || [] };
}
