<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BETCASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #0a0e1a;
            padding: 12px;
            overflow: hidden;
        }

        /* ===== 3D ФОН ===== */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a2a5a 0%, #070a12 70%);
            overflow: hidden;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, #f7e05e, #ff8a2a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #4a8af4, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ff6b6b, #cc3333);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.1;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -60px) scale(1.3);
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 8px 8px 80px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== ПРОФИЛЬ (АВАТАРКА + НИКНЕЙМ) ===== */
        .profile {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 6px 0 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #0a0e1a;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(247, 224, 94, 0.15);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nickname {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== БАЛАНС ===== */
        .balance-block {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px 16px 20px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .balance-amount {
            color: #fff;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 40px rgba(247, 224, 94, 0.08);
        }

        /* ===== ИНДИВИДУАЛЬНАЯ ЭМОДЗИ ВАЛЮТЫ (CSS) ===== */
        .currency-icon {
            display: inline-block;
            font-size: 38px;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a, #f7e05e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(247, 224, 94, 0.2));
            line-height: 1;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .balance-sub {
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ===== CSS ЭМОДЗИ ГОЛУБОГО ЦВЕТА ===== */
        .icon-blue {
            filter: brightness(0) saturate(100%) invert(45%) sepia(100%) saturate(500%) hue-rotate(180deg);
            opacity: 0.8;
            display: inline-block;
        }

        /* ===== НИЖНЯЯ НАВИГАЦИЯ ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px 16px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: #6f8f9f;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 20px;
            filter: brightness(0) saturate(100%) invert(45%) sepia(100%) saturate(500%) hue-rotate(180deg);
            opacity: 0.6;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: #4a8af4;
        }

        .nav-item.active .nav-icon {
            opacity: 1;
            filter: brightness(0) saturate(100%) invert(45%) sepia(100%) saturate(500%) hue-rotate(180deg);
        }

        .nav-item .nav-label {
            font-size: 9px;
            font-weight: 500;
        }

        /* ===== АДМИН МЕНЮ (выезжающее) ===== */
        .admin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
        }

        .admin-overlay.active {
            display: block;
        }

        .admin-menu {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 90%;
            max-width: 380px;
            background: rgba(20, 30, 60, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 51;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .admin-menu.open {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        .admin-title {
            color: #4a8af4;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .admin-title .icon-blue {
            font-size: 20px;
        }

        .admin-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            color: #c8d6ff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .admin-item:last-child {
            border-bottom: none;
        }

        .admin-item:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.04);
        }

        .admin-item .icon-blue {
            font-size: 18px;
        }

        .admin-close {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #6f8f9f;
            font-size: 20px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .admin-close:hover {
            color: #fff;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 8px 8px 75px;
            }
            .balance-amount {
                font-size: 38px;
            }
            .currency-icon {
                font-size: 30px;
            }
            .avatar {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }
            .nickname {
                font-size: 15px;
            }
            .admin-menu {
                width: 95%;
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="app">

        <!-- ПРОФИЛЬ (АВАТАРКА + НИКНЕЙМ) -->
        <div class="profile">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="nickname" id="userName">Загрузка...</div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-block">
            <div class="balance-label">Ваш баланс</div>
            <div class="balance-amount">
                <span class="currency-icon">₿</span>
                <span id="balanceDisplay">0</span>
            </div>
            <div class="balance-sub">BETCASH</div>
        </div>

    </div>

    <!-- АДМИН МЕНЮ (выезжающее) -->
    <div class="admin-overlay" id="adminOverlay" onclick="closeAdminMenu()"></div>
    <div class="admin-menu" id="adminMenu">
        <button class="admin-close" onclick="closeAdminMenu()">✕</button>
        <div class="admin-title">
            <span class="icon-blue">👑</span> Админ панель
        </div>
        <div class="admin-item" onclick="alert('📊 Статистика')">
            <span class="icon-blue">📊</span> Статистика
        </div>
        <div class="admin-item" onclick="alert('👥 Пользователи')">
            <span class="icon-blue">👥</span> Пользователи
        </div>
        <div class="admin-item" onclick="alert('⚙️ Настройки')">
            <span class="icon-blue">⚙️</span> Настройки
        </div>
        <div class="admin-item" onclick="alert('💎 Выдать BETCASH')">
            <span class="icon-blue">💎</span> Выдать BETCASH
        </div>
        <div class="admin-item" style="border-top:1px solid rgba(255,255,255,0.05);margin-top:4px;padding-top:14px;color:#ff6b6b;" onclick="closeAdminMenu()">
            <span class="icon-blue" style="filter:brightness(0) saturate(100%) invert(45%) sepia(100%) saturate(500%) hue-rotate(340deg);">🚪</span> Закрыть
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="alert('Главная')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Главная</span>
        </button>
        <button class="nav-item" onclick="alert('Игры')">
            <span class="nav-icon">🎮</span>
            <span class="nav-label">Игры</span>
        </button>
        <button class="nav-item" onclick="alert('Рейтинг')">
            <span class="nav-icon">🏆</span>
            <span class="nav-label">Рейтинг</span>
        </button>
        <button class="nav-item" id="adminBtn" onclick="toggleAdminMenu()">
            <span class="nav-icon">👑</span>
            <span class="nav-label">Админ</span>
        </button>
    </div>

    <script>
        // ===== SUPABASE (только для баланса) =====
        const supabaseUrl = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ===== TELEGRAM =====
        let tgUser = null;
        let isAdmin = false;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        if (!tgUser) {
            tgUser = {
                id: 'demo_' + Date.now(),
                first_name: 'Игрок',
                username: 'player',
                photo_url: null
            };
            console.log('ℹ️ Демо-режим');
        }

        // ===== ПРОВЕРКА АДМИНА =====
        const adminUsername = 'loveforever_08';
        const tgUsername = tgUser.username || '';

        if (tgUsername.toLowerCase() === adminUsername.toLowerCase()) {
            isAdmin = true;
            document.getElementById('adminBtn').style.display = 'flex';
            console.log('👑 Админ авторизован:', tgUsername);
        } else {
            document.getElementById('adminBtn').style.display = 'none';
            console.log('👤 Обычный пользователь:', tgUsername);
        }

        const userId = tgUser.id.toString();
        const username = tgUser.first_name || tgUser.username || 'Игрок';
        let balance = 0;

        // ===== DOM =====
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            userName.textContent = username;

            if (tgUser.photo_url) {
                userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
            } else {
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }

        // ===== SUPABASE ЗАГРУЗКА БАЛАНСА =====
        async function loadBalance() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('balance')
                    .eq('id', userId)
                    .single();

                if (error && error.code === 'PGRST116') {
                    // Создаём пользователя
                    await supabase.from('users').insert([{
                        id: userId,
                        name: username,
                        balance: 5000
                    }]);
                    balance = 5000;
                } else if (data) {
                    balance = data.balance || 0;
                }
                updateUI();
                console.log('✅ Баланс загружен:', balance);
            } catch (e) {
                console.error('❌ Ошибка загрузки баланса:', e);
                balance = 5000;
                updateUI();
            }
        }

        // ===== АДМИН МЕНЮ =====
        function toggleAdminMenu() {
            if (!isAdmin) {
                alert('⛔ Доступ запрещён! Только для админов.');
                return;
            }
            document.getElementById('adminMenu').classList.toggle('open');
            document.getElementById('adminOverlay').classList.toggle('active');
        }

        function closeAdminMenu() {
            document.getElementById('adminMenu').classList.remove('open');
            document.getElementById('adminOverlay').classList.remove('active');
        }

        // ===== ЗАПУСК =====
        loadBalance();

        console.log('🚀 BETCASH запущен!');
        console.log('👤 Пользователь:', tgUser);
        console.log('👑 Админ режим:', isAdmin);
    </script>

</body>
</html>
