<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BETCASH BRAWL STARS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e1a;
            padding: 20px;
            overflow: hidden;
        }

        /* ===== 3D ФОН ===== */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a2a5a 0%, #070a12 70%);
            overflow: hidden;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, #f7e05e, #ff8a2a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #4a8af4, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ff6b6b, #cc3333);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.1;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -60px) scale(1.3);
            }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* ===== ЛОГОТИП ===== */
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 40px rgba(247, 224, 94, 0.15);
        }

        .logo-sub {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== АВАТАРКА + НИКНЕЙМ ===== */
        .profile {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 50px;
            width: 100%;
            justify-content: center;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            border: 3px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #0a0e1a;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 30px rgba(247, 224, 94, 0.2);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nickname {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        /* ===== БАЛАНС ===== */
        .balance-block {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px 20px 28px;
            text-align: center;
            box-shadow: 0 8px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .balance-amount {
            color: #fff;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 40px rgba(247, 224, 94, 0.1);
        }

        .currency-icon {
            font-size: 36px;
            background: linear-gradient(135deg, #f7e05e, #ff8a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(247, 224, 94, 0.2));
        }

        .balance-sub {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* ===== КНОПКИ ===== */
        .buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7e05e, #e8b42b);
            color: #0a0e1a;
            box-shadow: 0 4px 30px rgba(247, 224, 94, 0.25);
        }

        .btn-primary:active {
            box-shadow: 0 2px 15px rgba(247, 224, 94, 0.15);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #c8d6ff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .app {
                padding: 15px;
            }
            .logo {
                font-size: 24px;
            }
            .balance-amount {
                font-size: 38px;
            }
            .currency-icon {
                font-size: 30px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 8px;
            }
            .profile {
                margin-bottom: 35px;
            }
            .avatar {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
            .nickname {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="app">

        <!-- ЛОГОТИП -->
        <div class="logo">BETCASH</div>
        <div class="logo-sub">Brawl Stars</div>

        <!-- ПРОФИЛЬ (АВАТАРКА + НИКНЕЙМ) -->
        <div class="profile">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="nickname" id="userName">Загрузка...</div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-block">
            <div class="balance-label">Ваш баланс</div>
            <div class="balance-amount">
                <span class="currency-icon">🪙</span>
                <span id="balanceDisplay">0</span>
            </div>
            <div class="balance-sub">BETCASH</div>
        </div>

        <!-- КНОПКИ -->
        <div class="buttons">
            <button class="btn btn-primary" id="getCoinsBtn">+ Получить</button>
            <button class="btn btn-secondary" id="buyCoinsBtn">💎 Купить</button>
        </div>

    </div>

    <script>
        // ===== TELEGRAM =====
        let tgUser = null;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        // Демо-режим
        if (!tgUser) {
            tgUser = {
                id: 'demo_' + Date.now(),
                first_name: 'Игрок',
                username: 'player',
                photo_url: null
            };
            console.log('ℹ️ Демо-режим');
        }

        // ===== DOM ЭЛЕМЕНТЫ =====
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ===== БАЛАНС =====
        let balance = 5000;

        // ===== ОБНОВЛЕНИЕ UI =====
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();

            const name = tgUser.first_name || tgUser.username || 'Игрок';
            userName.textContent = name;

            if (tgUser.photo_url) {
                userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
            } else {
                userAvatar.textContent = name.charAt(0).toUpperCase();
            }
        }

        // ===== КНОПКИ =====
        document.getElementById('getCoinsBtn').addEventListener('click', function() {
            balance += 500;
            updateUI();
            alert('✅ +500 BETCASH!');
        });

        document.getElementById('buyCoinsBtn').addEventListener('click', function() {
            const amount = prompt('💰 Сколько BETCASH купить?', '1000');
            if (!amount) return;
            const coins = parseInt(amount);
            if (isNaN(coins) || coins <= 0) {
                alert('❌ Введите корректную сумму!');
                return;
            }
            balance += coins;
            updateUI();
            alert(`✅ +${coins} BETCASH!`);
        });

        // ===== ЗАПУСК =====
        updateUI();

        console.log('🚀 BETCASH BRAWL STARS запущен!');
        console.log('👤 Пользователь:', tgUser);
    </script>

</body>
</html>
