<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame - Dice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0a0e1a;padding:0;overflow:hidden}
        #bg-3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 30% 40%,#1a3a6a 0%,#0a0e1a 70%);overflow:hidden;pointer-events:none}
        .sphere{position:absolute;border-radius:50%;filter:blur(60px);opacity:.25;animation:floatSphere 20s ease-in-out infinite alternate}
        .sphere:nth-child(1){width:500px;height:500px;top:-100px;right:-100px;background:radial-gradient(circle,#4a8af4,#1a3a7a);animation-duration:25s}
        .sphere:nth-child(2){width:400px;height:400px;bottom:-100px;left:-100px;background:radial-gradient(circle,#6aafff,#2a5a9a);animation-duration:20s;animation-delay:-5s}
        .sphere:nth-child(3){width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#8ac4ff,#3a6aaa);animation-duration:30s;animation-delay:-10s;opacity:.15}
        @keyframes floatSphere{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,-40px) scale(1.2)}}
        
        .app{position:relative;z-index:1;max-width:420px;width:100%;height:100vh;padding:15px 15px 80px;display:flex;flex-direction:column;overflow-y:auto}
        
        .header{display:flex;align-items:center;gap:12px;margin-bottom:15px;flex-shrink:0}
        .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4a8af4,#1a3a7a);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
        .avatar img{width:100%;height:100%;object-fit:cover}
        .username{color:#fff;font-size:16px;font-weight:600}
        
        .balance-block{width:100%;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px 18px 12px;text-align:center;flex-shrink:0;margin-bottom:12px}
        .balance-label{color:rgba(255,255,255,.5);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
        .balance-amount{color:#fff;font-size:30px;font-weight:800;margin-bottom:10px}
        .buttons{display:flex;gap:8px;width:100%}
        .btn{flex:1;padding:9px 8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s ease}
        .btn:active{transform:scale(.96)}
        .btn-primary{background:linear-gradient(135deg,#4a8af4,#2a5a9a);color:#fff}
        .btn-secondary{background:rgba(255,255,255,.08);color:#c8d6ff;border:1px solid rgba(255,255,255,.12)}
        
        .page{display:none;flex-direction:column;flex:1}
        .page.active{display:flex}
        
        .menu-title{color:#aec0ff;font-size:13px;font-weight:600;margin-bottom:8px;flex-shrink:0}
        .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
        .menu-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 4px;text-align:center;color:#c8d6ff;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}
        .menu-item:active{transform:scale(.95);background:rgba(255,255,255,.08)}
        .menu-item .icon{font-size:22px;display:block;margin-bottom:3px;filter:brightness(.7) invert(.9);opacity:.5}
        
        .dice-page{display:none;flex-direction:column;gap:10px;padding:5px 0}
        .dice-page.active{display:flex}
        .dice-back{color:#4a8af4;font-size:13px;cursor:pointer;margin-bottom:2px}
        .dice-back:hover{color:#6aafff}
        .dice-title{color:#fff;font-size:22px;font-weight:700;text-align:center}
        
        .dice-3d{display:flex;justify-content:center;gap:16px;margin:5px 0;perspective:600px}
        .dice-cube{width:65px;height:65px;position:relative;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(.4,.2,.2,1)}
        .dice-cube.rolling{animation:rollDice 1s ease-in-out}
        @keyframes rollDice{0%{transform:rotateX(0) rotateY(0)}50%{transform:rotateX(720deg) rotateY(360deg)}100%{transform:rotateX(0) rotateY(0)}}
        .dice-face{position:absolute;width:65px;height:65px;background:linear-gradient(135deg,#1a2a5a,#2a4a8a);border:2px solid rgba(255,255,255,.12);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff}
        .dice-face:nth-child(1){transform:translateZ(32.5px)}
        .dice-face:nth-child(2){transform:rotateX(180deg) translateZ(32.5px)}
        .dice-face:nth-child(3){transform:rotateY(-90deg) translateZ(32.5px)}
        .dice-face:nth-child(4){transform:rotateY(90deg) translateZ(32.5px)}
        .dice-face:nth-child(5){transform:rotateX(90deg) translateZ(32.5px)}
        .dice-face:nth-child(6){transform:rotateX(-90deg) translateZ(32.5px)}
        
        .dice-result{text-align:center;font-size:17px;color:#f7e05e;font-weight:700;min-height:28px}
        .dice-timer{text-align:center;font-size:15px;color:#4a8af4;font-weight:600;padding:5px;background:rgba(74,138,244,.08);border-radius:8px;border:1px solid rgba(74,138,244,.15)}
        .dice-timer .highlight{color:#f7e05e;font-size:20px}
        .dice-timer.betting{color:#4ade80}
        .dice-timer.rolling{color:#f7e05e}
        
        .dice-bets{background:rgba(255,255,255,.02);border-radius:10px;padding:10px;max-height:130px;overflow-y:auto}
        .dice-bet-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.02);color:#aec0ff;font-size:12px}
        .dice-bet-item .win{color:#4ade80}
        .dice-bet-item .lose{color:#ff6b6b}
        .dice-bet-item .pending{color:#f7e05e}
        
        .dice-bet-options{display:flex;gap:8px;margin:4px 0}
        .dice-bet-option{flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
        .dice-bet-option.active{border-color:#f7e05e;background:rgba(255,215,0,.08);color:#f7e05e}
        .dice-bet-option:disabled{opacity:.4;cursor:not-allowed}
        .dice-input-group{display:flex;gap:6px;align-items:center}
        .dice-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
        .dice-input:focus{border-color:#4a8af4}
        .dice-input:disabled{opacity:.4}
        .dice-quick-btn{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
        .dice-quick-btn:disabled{opacity:.4;cursor:not-allowed}
        .dice-place-btn{width:100%;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,#f7e05e,#e8b42b);color:#0a0e1a;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
        .dice-place-btn:active{transform:scale(.96)}
        .dice-place-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
        
        .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:50;display:none}
        .sidebar-overlay.active{display:block}
        .sidebar{position:fixed;top:0;right:-280px;width:280px;height:100%;background:rgba(10,14,30,.98);backdrop-filter:blur(20px);z-index:51;padding:25px 20px;transition:right .3s cubic-bezier(.4,0,.2,1);border-left:1px solid rgba(255,255,255,.05)}
        .sidebar.open{right:0}
        .sidebar-close{color:#8a9bb5;font-size:24px;cursor:pointer;margin-bottom:25px;display:inline-block}
        .sidebar-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:20px}
        .sidebar-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;color:#c8d6ff;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:3px}
        .sidebar-item:active{transform:scale(.96);background:rgba(255,255,255,.04)}
        .sidebar-item .icon{font-size:20px;filter:brightness(.7) invert(.9);opacity:.6;width:28px}
        .sidebar-item.active{background:rgba(74,138,244,.12);color:#4a8af4}
        
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:420px;width:100%;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;padding:6px 20px 16px;z-index:40;border-top:1px solid rgba(255,255,255,.04)}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:none;color:#6f8f9f;font-size:10px;cursor:pointer;padding:4px 10px;transition:color .2s}
        .nav-item .icon{font-size:20px;filter:brightness(.7) invert(.9);opacity:.6;transition:all .2s}
        .nav-item.active{color:#f7e05e}
        .nav-item.active .icon{filter:none;opacity:1;transform:scale(1.05)}
        .nav-center{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4a8af4,#2a5a9a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:-25px;box-shadow:0 4px 20px rgba(74,138,244,.3);border:3px solid rgba(255,255,255,.08);cursor:pointer;transition:all .2s}
        .nav-center:active{transform:scale(.92)}
        .nav-center.active{background:linear-gradient(135deg,#f7e05e,#e8b42b);box-shadow:0 4px 20px rgba(247,224,94,.3)}
        
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;display:none;justify-content:center;align-items:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:rgba(20,30,60,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px 22px;max-width:340px;width:100%}
        .modal-title{color:#fff;font-size:20px;font-weight:700;text-align:center;margin-bottom:14px}
        .modal-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:16px;outline:none;text-align:center;text-transform:uppercase}
        .modal-input:focus{border-color:#4a8af4}
        .modal-buttons{display:flex;gap:10px;margin-top:14px}
        .modal-btn{flex:1;padding:10px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
        .modal-btn:active{transform:scale(.95)}
        .modal-btn-primary{background:linear-gradient(135deg,#4a8af4,#2a5a9a);color:#fff}
        .modal-btn-secondary{background:rgba(255,255,255,.06);color:#c8d6ff;border:1px solid rgba(255,255,255,.08)}
        .result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:200;display:none;justify-content:center;align-items:center;padding:20px}
        .result-modal.active{display:flex}
        .result-box{text-align:center;animation:fadeIn .3s ease}
        .result-icon{font-size:64px;margin-bottom:12px}
        .result-title{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px}
        .result-title.win{color:#4ade80}
        .result-title.lose{color:#ff6b6b}
        .result-amount{font-size:17px;color:#f7e05e;margin-bottom:16px}
        .result-btn{padding:10px 36px;border-radius:30px;border:none;background:linear-gradient(135deg,#f7e05e,#e8b42b);color:#0a0e1a;font-weight:700;font-size:15px;cursor:pointer}
        @keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    </style>
</head>
<body>
    <div id="bg-3d"><div class="sphere"></div><div class="sphere"></div><div class="sphere"></div></div>
    
    <div class="app">
        <div class="header">
            <div class="avatar" id="userAvatar">🐹</div>
            <div class="username" id="userName">Загрузка...</div>
        </div>
        
        <div class="balance-block">
            <div class="balance-label">BETCOIN</div>
            <div class="balance-amount" id="balanceDisplay">0</div>
            <div class="buttons">
                <button class="btn btn-primary" id="getBtn">💎 Получить</button>
                <button class="btn btn-secondary" id="buyBtn">💰 Купить</button>
            </div>
        </div>
        
        <div class="page active" id="pageHome">
            <div class="menu-title">Управление</div>
            <div class="menu-grid">
                <div class="menu-item" onclick="alert('Профиль')"><span class="icon">👤</span>Профиль</div>
                <div class="menu-item" onclick="alert('Инвентарь')"><span class="icon">📦</span>Инвентарь</div>
                <div class="menu-item" onclick="alert('Сервис')"><span class="icon">⚙️</span>Сервис</div>
                <div class="menu-item" onclick="openPromo()"><span class="icon">🎁</span>Промо</div>
            </div>
        </div>
        
        <div class="dice-page" id="dicePage">
            <div class="dice-back" onclick="closeDiceGame()">← Назад</div>
            <div class="dice-title">🎲 Dice</div>
            
            <div class="dice-timer" id="diceTimer">⏳ Раунд: <span class="highlight" id="timerDisplay">12</span>s</div>
            
            <div class="dice-3d">
                <div class="dice-cube" id="dice1">
                    <div class="dice-face">⚀</div><div class="dice-face">⚁</div><div class="dice-face">⚂</div>
                    <div class="dice-face">⚃</div><div class="dice-face">⚄</div><div class="dice-face">⚅</div>
                </div>
                <div class="dice-cube" id="dice2">
                    <div class="dice-face">⚀</div><div class="dice-face">⚁</div><div class="dice-face">⚂</div>
                    <div class="dice-face">⚃</div><div class="dice-face">⚄</div><div class="dice-face">⚅</div>
                </div>
            </div>
            <div class="dice-result" id="diceResult">Результат: ?</div>
            
            <div class="dice-bet-options">
                <button class="dice-bet-option active" data-bet="under" onclick="setDiceBet('under')">⟨ 7</button>
                <button class="dice-bet-option" data-bet="over" onclick="setDiceBet('over')">7 ⟩</button>
            </div>
            <div class="dice-input-group">
                <input class="dice-input" id="diceInput" type="number" value="100" min="1" />
                <button class="dice-quick-btn" onclick="document.getElementById('diceInput').value = Math.floor(balance/2)">1/2</button>
                <button class="dice-quick-btn" onclick="document.getElementById('diceInput').value = balance">Max</button>
            </div>
            <button class="dice-place-btn" id="dicePlaceBtn" onclick="placeDiceBet()">🎲 Сделать ставку</button>
            
            <div style="color:#8a9bb5;font-size:12px;margin-top:6px">Ставки игроков</div>
            <div class="dice-bets" id="diceBets">
                <div class="dice-bet-item"><span>Загрузка...</span><span></span></div>
            </div>
        </div>
    </div>
    
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" onclick="closeSidebar()">✕</div>
        <div class="sidebar-title">📋 Разделы</div>
        <div class="sidebar-item active" onclick="navigateTo('pageHome');closeSidebar()"><span class="icon">🏠</span>Главная</div>
        <div class="sidebar-item" onclick="openDiceGame();closeSidebar()"><span class="icon">🎲</span>Dice</div>
        <div class="sidebar-item" onclick="alert('Скоро')"><span class="icon">🎮</span>Другие игры</div>
        <div class="sidebar-item" onclick="alert('Рейтинг')"><span class="icon">🏆</span>Рейтинг</div>
        <div class="sidebar-item" onclick="alert('Настройки')"><span class="icon">⚙️</span>Настройки</div>
    </div>
    
    <div class="bottom-nav">
        <button class="nav-item active" onclick="navigateTo('pageHome')" data-page="pageHome">
            <span class="icon">🏠</span><span>Главная</span>
        </button>
        <div class="nav-center" onclick="openDiceGame()" id="gameBtn">🎲</div>
        <button class="nav-item" onclick="toggleSidebar()">
            <span class="icon">⚙️</span><span>Настройки</span>
        </button>
    </div>
    
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" maxlength="20" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="applyPromo()">Активировать</button>
            </div>
        </div>
    </div>
    
    <div class="result-modal" id="resultModal">
        <div class="result-box">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">Вы выиграли!</div>
            <div class="result-amount" id="resultAmount">+0 BetCoin</div>
            <button class="result-btn" onclick="closeResult()">Продолжить</button>
        </div>
    </div>

    <script>
        // ===== TELEGRAM =====
        let tgUser = null;
        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
            }
        } catch (e) {}

        if (!tgUser) {
            tgUser = { id: 'demo_' + Date.now(), first_name: 'Тест', photo_url: null };
        }

        const userId = tgUser.id.toString();
        let balance = 0;
        let diceBet = 'under';
        let timerInterval = null;
        let roundSeconds = 12;
        let isRolling = false;

        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const diceTimer = document.getElementById('diceTimer');
        const diceResult = document.getElementById('diceResult');
        const dicePlaceBtn = document.getElementById('dicePlaceBtn');
        const diceInput = document.getElementById('diceInput');

        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            const name = tgUser.first_name || 'Пользователь';
            userName.textContent = name;
            if (tgUser.photo_url) {
                userAvatar.innerHTML = '<img src="' + tgUser.photo_url + '" />';
            } else {
                userAvatar.textContent = name.charAt(0).toUpperCase();
                userAvatar.style.fontSize = '18px';
            }
        }

        // ===== SUPABASE =====
        const supabaseUrl = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';

        async function loadData() {
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/users?id=eq.${userId}&select=*`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                const data = await response.json();
                if (data.length === 0) {
                    await fetch(`${supabaseUrl}/rest/v1/users`, {
                        method: 'POST',
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: userId, name: tgUser.first_name || 'Пользователь', balance: 5000 })
                    });
                    balance = 5000;
                } else {
                    balance = data[0].balance || 0;
                }
                updateUI();
            } catch (e) { balance = 5000; updateUI(); }
        }

        async function saveBalance(newBalance) {
            try {
                await fetch(`${supabaseUrl}/rest/v1/users?id=eq.${userId}`, {
                    method: 'PATCH',
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: newBalance })
                });
                balance = newBalance;
                updateUI();
            } catch (e) {}
        }

        // ===== NAVIGATION =====
        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const navBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (navBtn) navBtn.classList.add('active');
            document.getElementById('dicePage').classList.remove('active');
        }

        // ===== BUTTONS =====
        document.getElementById('getBtn').onclick = function() { saveBalance(balance + 500); alert('✅ +500 BetCoin!'); };
        document.getElementById('buyBtn').onclick = function() {
            const amount = prompt('💰 Сколько BetCoin купить?', '1000');
            if (amount) { const coins = parseInt(amount); if (coins > 0) { saveBalance(balance + coins); alert('✅ +' + coins + ' BetCoin!'); } }
        };

        // ===== DICE GAME =====
        function openDiceGame() {
            document.getElementById('dicePage').classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('gameBtn').classList.add('active');
            loadDiceBets();
            if (!timerInterval) startTimer();
        }

        function closeDiceGame() {
            document.getElementById('dicePage').classList.remove('active');
            document.getElementById('gameBtn').classList.remove('active');
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            navigateTo('pageHome');
        }

        function setDiceBet(type) {
            if (isRolling) return;
            diceBet = type;
            document.querySelectorAll('.dice-bet-option').forEach(b => b.classList.remove('active'));
            document.querySelector(`.dice-bet-option[data-bet="${type}"]`).classList.add('active');
        }

        function startTimer() {
            if (timerInterval) { clearInterval(timerInterval); }
            roundSeconds = 12;
            isRolling = false;
            updateTimerDisplay();
            enableBetting(true);
            diceTimer.className = 'dice-timer betting';
            
            timerInterval = setInterval(() => {
                roundSeconds--;
                updateTimerDisplay();
                if (roundSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    executeRound();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = roundSeconds;
        }

        function enableBetting(enabled) {
            const inputs = document.querySelectorAll('.dice-input, .dice-quick-btn, .dice-bet-option');
            inputs.forEach(el => el.disabled = !enabled);
            dicePlaceBtn.disabled = !enabled;
            diceInput.disabled = !enabled;
        }

        async function executeRound() {
            if (isRolling) return;
            isRolling = true;
            enableBetting(false);
            diceTimer.className = 'dice-timer rolling';
            diceTimer.innerHTML = '🎲 Бросок!';
            
            const die1 = Math.floor(Math.random() * 6) + 1;
            const die2 = Math.floor(Math.random() * 6) + 1;
            const result = die1 + die2;
            
            const dots = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            
            dice1.innerHTML = `<div class="dice-face">${dots[die1-1]}</div><div class="dice-face">${dots[die1-1]}</div><div class="dice-face">${dots[die1-1]}</div><div class="dice-face">${dots[die1-1]}</div><div class="dice-face">${dots[die1-1]}</div><div class="dice-face">${dots[die1-1]}</div>`;
            dice2.innerHTML = `<div class="dice-face">${dots[die2-1]}</div><div class="dice-face">${dots[die2-1]}</div><div class="dice-face">${dots[die2-1]}</div><div class="dice-face">${dots[die2-1]}</div><div class="dice-face">${dots[die2-1]}</div><div class="dice-face">${dots[die2-1]}</div>`;
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');
            
            setTimeout(() => {
                dice1.classList.remove('rolling');
                dice2.classList.remove('rolling');
            }, 1000);
            
            diceResult.textContent = `Результат: ${result} (${die1}+${die2})`;
            
            await processBets(result);
            await loadDiceBets();
            
            setTimeout(() => {
                isRolling = false;
                startTimer();
            }, 1500);
        }

        async function processBets(result) {
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/bets?game=eq.Dice&result=eq.pending&order=created_at.asc&limit=50`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                const bets = await response.json();
                
                for (const bet of bets) {
                    const win = (bet.detail === 'under') ? result < 7 : result > 7;
                    const winAmount = win ? bet.amount * 2 : 0;
                    
                    await fetch(`${supabaseUrl}/rest/v1/bets?id=eq.${bet.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            result: win ? 'win' : 'lose',
                            win_amount: winAmount,
                            coefficient: 2,
                            detail: `${result}`
                        })
                    });
                    
                    if (win) {
                        const userResponse = await fetch(`${supabaseUrl}/rest/v1/users?id=eq.${bet.user_id}&select=balance`, {
                            headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                        });
                        const userData = await userResponse.json();
                        if (userData.length > 0) {
                            const newBalance = userData[0].balance - bet.amount + winAmount;
                            await fetch(`${supabaseUrl}/rest/v1/users?id=eq.${bet.user_id}`, {
                                method: 'PATCH',
                                headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ balance: newBalance })
                            });
                            if (bet.user_id === userId) {
                                balance = newBalance;
                                updateUI();
                            }
                        }
                    }
                }
            } catch (e) {
                console.error('Ошибка обработки ставок:', e);
            }
        }

        async function placeDiceBet() {
            if (isRolling) { alert('⏳ Раунд уже начался! Дождитесь окончания.'); return; }
            if (roundSeconds < 3) { alert('⏳ Раунд скоро закончится! Подождите следующего.'); return; }
            
            const amount = parseInt(diceInput.value);
            if (isNaN(amount) || amount <= 0) { alert('❌ Введите сумму!'); return; }
            if (amount > balance) { alert('❌ Недостаточно средств!'); return; }

            const newBalance = balance - amount;
            await saveBalance(newBalance);

            try {
                await fetch(`${supabaseUrl}/rest/v1/bets`, {
                    method: 'POST',
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: tgUser.first_name || 'Игрок',
                        amount: amount,
                        game: 'Dice',
                        result: 'pending',
                        win_amount: 0,
                        coefficient: 0,
                        detail: diceBet
                    })
                });
                loadDiceBets();
            } catch (e) {
                await saveBalance(balance + amount);
                alert('❌ Ошибка при ставке. Попробуйте снова.');
            }
        }

        async function loadDiceBets() {
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/bets?game=eq.Dice&order=created_at.desc&limit=15`, {
                    headers: { 'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}` }
                });
                const bets = await response.json();
                const container = document.getElementById('diceBets');
                if (!bets || bets.length === 0) {
                    container.innerHTML = '<div class="dice-bet-item"><span>Нет ставок</span><span></span></div>';
                    return;
                }
                container.innerHTML = bets.map(b => {
                    let status = '';
                    let cls = '';
                    if (b.result === 'win') { status = '+' + b.win_amount + ' (x2)'; cls = 'win'; }
                    else if (b.result === 'lose') { status = '-' + b.amount; cls = 'lose'; }
                    else { status = '⏳ Ожидание...'; cls = 'pending'; }
                    const detail = b.detail === 'under' ? '⟨7' : b.detail === 'over' ? '7⟩' : '';
                    const showDetail = detail ? ' ' + detail : '';
                    return `<div class="dice-bet-item">
                        <span>${b.user_name || 'Игрок'} • ${b.amount}${showDetail}</span>
                        <span class="${cls}">${status}</span>
                    </div>`;
                }).join('');
            } catch (e) {
                console.error('Ошибка загрузки ставок:', e);
            }
        }

        // ===== SIDEBAR =====
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        // ===== PROMO =====
        function openPromo() {
            document.getElementById('promoModal').classList.add('active');
            document.getElementById('promoInput').value = '';
            setTimeout(() => document.getElementById('promoInput').focus(), 100);
        }

        function closePromo() {
            document.getElementById('promoModal').classList.remove('active');
        }

        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            if (!code) { alert('❌ Введите промокод!'); return; }
            const codes = { 'BETCOIN': 10000, 'WELCOME': 500, 'BONUS': 1000, 'GOLD': 2500, 'VIP': 5000 };
            if (codes[code]) {
                saveBalance(balance + codes[code]);
                alert('🎉 +' + codes[code] + ' BetCoin!');
                closePromo();
            } else {
                alert('❌ Неверный промокод!');
            }
        }

        document.getElementById('promoModal').onclick = function(e) { if (e.target === this) closePromo(); };
        document.getElementById('promoInput').onkeydown = function(e) { if (e.key === 'Enter') applyPromo(); };

        // ===== RESULT =====
        function closeResult() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // ===== INIT =====
        loadData();

        window.navigateTo = navigateTo;
        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        window.openDiceGame = openDiceGame;
        window.closeDiceGame = closeDiceGame;
        window.setDiceBet = setDiceBet;
        window.placeDiceBet = placeDiceBet;
        window.closeResult = closeResult;
        window.openPromo = openPromo;
        window.closePromo = closePromo;
        window.applyPromo = applyPromo;
    </script>
</body>
</html>
