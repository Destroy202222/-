<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #0a0e1a;
            padding: 12px;
            overflow-x: hidden;
        }

        /* 3D ФОН */
        #bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #1a3a6a 0%, #0a0e1a 70%);
            overflow: hidden;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.25;
            animation: floatSphere 20s ease-in-out infinite alternate;
        }

        .sphere:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, #4a8af4, #1a3a7a);
            animation-duration: 25s;
        }

        .sphere:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, #6aafff, #2a5a9a);
            animation-duration: 20s;
            animation-delay: -5s;
        }

        .sphere:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #8ac4ff, #3a6aaa);
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes floatSphere {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .app {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            padding: 12px 12px 30px;
        }

        /* ХЕДЕР */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a8af4, #1a3a7a);
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(74, 138, 244, 0.3);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #6f8f9f;
            font-size: 12px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        .wins {
            color: #6f8f9f;
            font-size: 12px;
        }

        /* БАЛАНС */
        .balance-block {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-left {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            color: #8a9bb5;
            font-size: 13px;
        }

        .balance-amount {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
        }

        .balance-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f7d875, #e8b42b);
            color: #0a0e1a;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d6e0ff;
        }

        /* ЭМОДЗИ ТЕМНО-БЕЛОГО ЦВЕТА */
        .btn .emoji {
            filter: brightness(0.7) invert(0.9);
            opacity: 0.8;
        }

        /* ЗАГОЛОВОК "УПРАВЛЕНИЕ" */
        .menu-title {
            color: #aec0ff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* СЕТКА МЕНЮ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 4px;
            text-align: center;
            color: #aec0ff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.06);
        }

        .menu-item .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
            filter: brightness(0.7) invert(0.9);
            opacity: 0.6;
        }

        .menu-item .icon.white {
            filter: brightness(0) invert(1);
            opacity: 0.7;
        }

        /* НИЖНИЕ БЛОКИ */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .bottom-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            color: #aec0ff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bottom-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.06);
        }

        .bottom-item .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
            filter: brightness(0.7) invert(0.9);
            opacity: 0.6;
        }

        /* МОДАЛКА ПРОМОКОДА */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 30, 60, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 340px;
            width: 100%;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .modal-input:focus {
            border-color: #4a8af4;
        }

        .modal-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0;
            text-transform: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #4a8af4, #2a5a9a);
            color: #fff;
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #c8d6ff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 420px) {
            .app {
                padding: 8px 8px 20px;
            }
            .balance-amount {
                font-size: 20px;
            }
            .menu-item {
                font-size: 10px;
                padding: 10px 2px;
            }
            .menu-item .icon {
                font-size: 18px;
            }
            .bottom-item {
                font-size: 11px;
                padding: 12px 4px;
            }
            .bottom-item .icon {
                font-size: 20px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 3D ФОН -->
    <div id="bg-3d">
        <div class="sphere"></div>
        <div class="sphere"></div>
        <div class="sphere"></div>
    </div>

    <div class="app">
        <!-- ХЕДЕР -->
        <div class="header">
            <div class="header-left">
                <div class="avatar" id="userAvatar">🐹</div>
                <span class="username" id="userName">Гость</span>
                <span class="online-status">
                    <span class="online-dot"></span>
                    online • 51
                </span>
                <span class="wins">0 W</span>
            </div>
        </div>

        <!-- БАЛАНС -->
        <div class="balance-block">
            <div class="balance-left">
                <div class="balance-label">BetCoin</div>
                <div class="balance-amount" id="balanceDisplay">0</div>
            </div>
            <div class="balance-actions">
                <button class="btn btn-gold" id="getCoinsBtn">
                    <span class="emoji">💎</span> Получить
                </button>
                <button class="btn btn-outline" id="buyCoinsBtn">
                    <span class="emoji">💰</span> Купить
                </button>
            </div>
        </div>

        <!-- УПРАВЛЕНИЕ -->
        <div class="menu-title">Управление</div>

        <div class="menu-grid">
            <div class="menu-item" onclick="alert('Профиль')">
                <span class="icon">👤</span>Профиль
            </div>
            <div class="menu-item" onclick="alert('Инвентарь')">
                <span class="icon">📦</span>Инвентарь
            </div>
            <div class="menu-item" onclick="alert('Сервис')">
                <span class="icon">⚙️</span>Сервис
            </div>
            <div class="menu-item" onclick="openPromo()">
                <span class="icon">🎁</span>Промо
            </div>
        </div>

        <!-- НИЖНИЕ БЛОКИ -->
        <div class="bottom-grid">
            <div class="bottom-item" onclick="alert('Профиль')">
                <span class="icon">👤</span>Профиль
            </div>
            <div class="bottom-item" onclick="alert('Инвентарь')">
                <span class="icon">📦</span>Инвентарь
            </div>
            <div class="bottom-item" onclick="alert('Сервис')">
                <span class="icon">⚙️</span>Сервис
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПРОМОКОДА -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" maxlength="20" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="applyPromo()">Активировать</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // SUPABASE
        // ============================================
        const supabaseUrl = 'https://dlprylagddsmtzpmzxqy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ============================================
        // TELEGRAM AUTH
        // ============================================
        let tgUser = null;
        let userId = '';
        let balance = 0;

        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram user:', tgUser);
            }
        } catch (e) {
            console.log('ℹ️ Telegram не доступен');
        }

        // Демо-пользователь
        if (!tgUser) {
            tgUser = { id: 'demo_' + Date.now(), first_name: 'Гость' };
        }

        userId = tgUser.id.toString();

        // ============================================
        // DOM REFS
        // ============================================
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');

        // ============================================
        // UPDATE UI
        // ============================================
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();

            const name = tgUser.first_name || tgUser.username || 'Гость';
            userName.textContent = name;

            if (tgUser.photo_url) {
                userAvatar.innerHTML = `<img src="${tgUser.photo_url}" alt="avatar" />`;
            } else {
                userAvatar.textContent = name.charAt(0).toUpperCase() || '🐹';
            }
        }

        // ============================================
        // SUPABASE FUNCTIONS
        // ============================================
        async function loadUserData() {
            try {
                let { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (error && error.code === 'PGRST116') {
                    const newUser = {
                        id: userId,
                        name: tgUser.first_name || 'Гость',
                        balance: 5000,
                        created_at: new Date().toISOString()
                    };
                    const { data: inserted, error: insertError } = await supabase
                        .from('users')
                        .insert([newUser])
                        .select()
                        .single();
                    if (insertError) throw insertError;
                    data = inserted;
                } else if (error) {
                    throw error;
                }

                balance = data.balance || 0;
                updateUI();
                console.log('✅ Баланс загружен:', balance);

            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                balance = 5000;
                updateUI();
            }
        }

        async function updateBalance(newBalance) {
            try {
                const { error } = await supabase
                    .from('users')
                    .update({ balance: newBalance })
                    .eq('id', userId);
                if (error) throw error;
                balance = newBalance;
                updateUI();
                console.log('✅ Баланс обновлен:', newBalance);
                return true;
            } catch (error) {
                console.error('❌ Ошибка обновления:', error);
                return false;
            }
        }

        // ============================================
        // BUTTONS
        // ============================================
        document.getElementById('getCoinsBtn').addEventListener('click', async function() {
            const newBalance = balance + 500;
            await updateBalance(newBalance);
            alert('✅ +500 BetCoin!');
        });

        document.getElementById('buyCoinsBtn').addEventListener('click', async function() {
            const amount = prompt('💰 Сколько BetCoin купить?', '1000');
            if (!amount) return;
            const coins = parseInt(amount);
            if (isNaN(coins) || coins <= 0) {
                alert('❌ Введите сумму!');
                return;
            }
            const newBalance = balance + coins;
            await updateBalance(newBalance);
            alert(`✅ +${coins} BetCoin!`);
        });

        // ============================================
        // PROMOCODE
        // ============================================
        function openPromo() {
            document.getElementById('promoModal').classList.add('active');
            document.getElementById('promoInput').value = '';
            document.getElementById('promoInput').focus();
        }

        function closePromo() {
            document.getElementById('promoModal').classList.remove('active');
        }

        async function applyPromo() {
            const input = document.getElementById('promoInput');
            const code = input.value.trim().toUpperCase();

            if (!code) {
                alert('❌ Введите промокод!');
                return;
            }

            // Промокоды
            const promoCodes = {
                'BETCOIN': 10000,
                'WELCOME': 500,
                'BONUS': 1000,
                'GOLD': 2500,
                'VIP': 5000,
                'FREE': 100,
                'LUCKY': 750,
                'MEGA': 10000
            };

            if (promoCodes[code]) {
                const bonus = promoCodes[code];
                const newBalance = balance + bonus;
                await updateBalance(newBalance);
                alert(`🎉 Промокод активирован! +${bonus} BetCoin`);
                closePromo();
            } else {
                alert('❌ Неверный промокод!');
                input.value = '';
                input.focus();
            }
        }

        // Закрытие по клику вне модалки
        document.getElementById('promoModal').addEventListener('click', function(e) {
            if (e.target === this) closePromo();
        });

        // Enter в поле промокода
        document.getElementById('promoInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') applyPromo();
        });

        // ============================================
        // INIT
        // ============================================
        loadUserData();

        // Глобальные функции для HTML
        window.openPromo = openPromo;
        window.closePromo = closePromo;
        window.applyPromo = applyPromo;

        console.log('🚀 BetGame запущен!');
        console.log('👤 Пользователь:', tgUser);
    </script>

</body>
</html>
