<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BetGame</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#0a0e1a;display:flex;justify-content:center;padding:15px}
        .app{max-width:400px;width:100%}
        .header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
        .user{color:#fff;font-size:16px;font-weight:600}
        .avatar{width:35px;height:35px;border-radius:50%;background:gold;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:700}
        .avatar img{width:100%;height:100%;object-fit:cover}
        .balance{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
        .balance span{color:#fff;font-size:24px;font-weight:700}
        .btn{padding:6px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer}
        .btn-gold{background:gold;color:#000}
        .btn-out{background:transparent;border:1px solid rgba(255,255,255,.15);color:#fff}
        .menu-title{color:#aec0ff;font-size:14px;font-weight:600;margin:12px 0 8px}
        .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        .menu-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 4px;text-align:center;color:#aec0ff;font-size:12px;cursor:pointer}
        .menu-item .icon{font-size:20px;display:block;margin-bottom:4px}
        
        /* DICE */
        .dice-container{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;margin-bottom:10px}
        .dice-header{display:flex;justify-content:space-between;align-items:center;color:#fff;cursor:pointer}
        .dice-header span{font-size:16px;font-weight:600}
        .dice-header .arrow{transition:transform .3s;display:inline-block}
        .dice-header .arrow.open{transform:rotate(180deg)}
        .dice-content{display:none;padding-top:10px}
        .dice-content.open{display:block}
        .dice-timer{text-align:center;font-size:14px;color:#4ade80;padding:4px;background:rgba(74,222,128,.08);border-radius:8px;margin:4px 0}
        .dice-timer span{font-size:18px;color:#f7e05e}
        .dice-box{display:flex;justify-content:center;gap:16px;margin:8px 0}
        .dice{width:50px;height:50px;background:linear-gradient(135deg,#1a2a5a,#2a4a8a);border:2px solid rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff}
        .dice.rolling{animation:rollDice .8s ease-in-out}
        @keyframes rollDice{0%{transform:rotate(0)}50%{transform:rotate(360deg)}100%{transform:rotate(720deg)}}
        .dice-result{text-align:center;color:#f7e05e;font-size:14px;font-weight:700;min-height:22px}
        .dice-bet-options{display:flex;gap:4px;margin:4px 0}
        .dice-bet-option{flex:1;padding:6px 4px;border-radius:6px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-align:center}
        .dice-bet-option.active{border-color:#f7e05e;background:rgba(255,215,0,.08);color:#f7e05e}
        .dice-bet-option:disabled{opacity:.4;cursor:not-allowed}
        .dice-input-group{display:flex;gap:4px;margin:4px 0}
        .dice-input-group input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:12px;outline:none}
        .dice-input-group input:disabled{opacity:.4}
        .dice-input-group button{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:11px;cursor:pointer}
        .dice-input-group button:disabled{opacity:.4;cursor:not-allowed}
        .dice-place-btn{width:100%;padding:8px;border-radius:8px;border:none;background:gold;color:#000;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
        .dice-place-btn:disabled{opacity:.4;cursor:not-allowed}
        .dice-bets{background:rgba(255,255,255,.02);border-radius:6px;padding:6px;max-height:80px;overflow-y:auto;margin-top:4px}
        .dice-bet-item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.02);color:#aec0ff;font-size:10px}
        .dice-bet-item .win{color:#4ade80}
        .dice-bet-item .lose{color:#ff6b6b}
        .dice-bet-item .pending{color:#f7e05e}
        
        /* LOBBY */
        .lobby-page{display:none;padding:6px 0}
        .lobby-page.active{display:block}
        .lobby-back{color:#4a8af4;font-size:13px;cursor:pointer;margin-bottom:6px;display:inline-block}
        .lobby-title{color:#fff;font-size:20px;font-weight:700;text-align:center;margin:6px 0}
        .lobby-create{display:flex;gap:8px;margin-bottom:10px}
        .lobby-create input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:13px;outline:none}
        .lobby-create input:focus{border-color:#4a8af4}
        .lobby-create button{padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#4a8af4,#2a5a9a);color:#fff;font-weight:600;cursor:pointer}
        .lobby-list{max-height:400px;overflow-y:auto}
        .lobby-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;margin-bottom:6px}
        .lobby-item .top{display:flex;justify-content:space-between;align-items:center}
        .lobby-item .name{color:#fff;font-size:14px;font-weight:600}
        .lobby-item .bet{color:#f7e05e;font-size:13px}
        .lobby-item .status{color:#8a9bb5;font-size:12px}
        .lobby-item .actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
        .lobby-item .actions button{padding:4px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
        .lobby-item .actions .join{background:#4a8af4;color:#fff}
        .lobby-item .actions .delete{background:#ff6b6b;color:#fff}
        .lobby-item .actions .start{background:#4ade80;color:#000}
        .lobby-item .actions .screenshot{background:#f7e05e;color:#000}
        
        /* ADMIN */
        .admin-panel{background:rgba(255,0,0,.05);border:1px solid rgba(255,0,0,.15);border-radius:12px;padding:12px;margin-top:10px}
        .admin-title{color:#ff6b6b;font-size:14px;font-weight:600;margin-bottom:8px}
        .admin-input-group{display:flex;gap:6px;margin-bottom:6px}
        .admin-input-group input{flex:1;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:12px;outline:none}
        .admin-input-group button{padding:6px 12px;border-radius:6px;border:none;font-weight:600;cursor:pointer}
        .admin-btn-add{background:#4a8af4;color:#fff}
        .admin-btn-remove{background:#ff6b6b;color:#fff}
        .admin-list{max-height:100px;overflow-y:auto}
        .admin-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.02);color:#aec0ff;font-size:12px}
        .admin-item button{background:transparent;border:none;color:#ff6b6b;cursor:pointer;font-size:14px}
        
        .page{display:none}
        .page.active{display:block}
        
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:420px;width:100%;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;padding:6px 16px 14px;z-index:40;border-top:1px solid rgba(255,255,255,.04)}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:none;color:#6f8f9f;font-size:10px;cursor:pointer;padding:4px 8px}
        .nav-item .icon{font-size:18px;filter:brightness(.7) invert(.9);opacity:.6}
        .nav-item.active{color:#f7e05e}
        .nav-item.active .icon{filter:none;opacity:1}
        .nav-center{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#4a8af4,#2a5a9a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:-20px;box-shadow:0 4px 20px rgba(74,138,244,.3);border:3px solid rgba(255,255,255,.08);cursor:pointer}
        .nav-center:active{transform:scale(.92)}
        .nav-center.active{background:linear-gradient(135deg,#f7e05e,#e8b42b);box-shadow:0 4px 20px rgba(247,224,94,.3)}
        
        .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:50;display:none}
        .sidebar-overlay.active{display:block}
        .sidebar{position:fixed;top:0;right:-280px;width:280px;height:100%;background:rgba(10,14,30,.98);backdrop-filter:blur(20px);z-index:51;padding:25px 20px;transition:right .3s cubic-bezier(.4,0,.2,1);border-left:1px solid rgba(255,255,255,.05)}
        .sidebar.open{right:0}
        .sidebar-close{color:#8a9bb5;font-size:24px;cursor:pointer;margin-bottom:25px;display:inline-block}
        .sidebar-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:20px}
        .sidebar-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;color:#c8d6ff;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:3px}
        .sidebar-item:active{transform:scale(.96);background:rgba(255,255,255,.04)}
        .sidebar-item .icon{font-size:20px;filter:brightness(.7) invert(.9);opacity:.6;width:28px}
        .sidebar-item.active{background:rgba(74,138,244,.12);color:#4a8af4}
        
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;display:none;justify-content:center;align-items:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:rgba(20,30,60,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px 20px;max-width:340px;width:100%}
        .modal-title{color:#fff;font-size:18px;font-weight:700;text-align:center;margin-bottom:12px}
        .modal-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:15px;outline:none;text-align:center}
        .modal-input:focus{border-color:#4a8af4}
        .modal-buttons{display:flex;gap:10px;margin-top:12px}
        .modal-btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
        .modal-btn:active{transform:scale(.95)}
        .modal-btn-primary{background:linear-gradient(135deg,#4a8af4,#2a5a9a);color:#fff}
        .modal-btn-secondary{background:rgba(255,255,255,.06);color:#c8d6ff;border:1px solid rgba(255,255,255,.08)}
        .result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:200;display:none;justify-content:center;align-items:center;padding:20px}
        .result-modal.active{display:flex}
        .result-box{text-align:center}
        .result-icon{font-size:56px;margin-bottom:10px}
        .result-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
        .result-title.win{color:#4ade80}
        .result-title.lose{color:#ff6b6b}
        .result-amount{color:#f7e05e;font-size:15px;margin-bottom:14px}
        .result-btn{padding:10px 30px;border:none;border-radius:30px;background:gold;color:#000;font-weight:700;font-size:14px;cursor:pointer}
        .hidden{display:none}
    </style>
</head>
<body>
    <div id="bg-3d"></div>
    <div class="app">
        <!-- HEADER -->
        <div class="header">
            <div class="user" id="userName">Загрузка...</div>
            <div class="avatar" id="userAvatar">🐹</div>
        </div>
        
        <!-- BALANCE -->
        <div class="balance">
            <div>
                <div style="color:#8a9bb5;font-size:12px">BetCoin</div>
                <span id="balanceDisplay">0</span>
            </div>
            <div style="display:flex;gap:6px">
                <button class="btn btn-gold" id="getBtn">+ Получить</button>
                <button class="btn btn-out" id="buyBtn">Купить</button>
            </div>
        </div>
        
        <!-- HOME -->
        <div class="page active" id="pageHome">
            <div class="menu-title">Управление</div>
            <div class="menu-grid">
                <div class="menu-item" onclick="alert('Профиль')"><span class="icon">👤</span>Профиль</div>
                <div class="menu-item" onclick="alert('Инвентарь')"><span class="icon">📦</span>Инвентарь</div>
                <div class="menu-item" onclick="alert('Сервис')"><span class="icon">⚙️</span>Сервис</div>
                <div class="menu-item" onclick="alert('Промо')"><span class="icon">🎁</span>Промо</div>
            </div>
            
            <!-- DICE -->
            <div class="dice-container">
                <div class="dice-header" onclick="toggleDice()">
                    <span>🎲 Dice</span>
                    <span class="arrow" id="diceArrow">▼</span>
                </div>
                <div class="dice-content" id="diceContent">
                    <div class="dice-timer">⏳ Раунд: <span id="timerDisplay">12</span>s</div>
                    <div class="dice-box">
                        <div class="dice" id="dice1">⚀</div>
                        <div class="dice" id="dice2">⚀</div>
                    </div>
                    <div class="dice-result" id="diceResult">Результат: ?</div>
                    <div class="dice-bet-options">
                        <button class="dice-bet-option active" data-bet="under" onclick="setBet('under')">⟨7</button>
                        <button class="dice-bet-option" data-bet="seven" onclick="setBet('seven')">=7</button>
                        <button class="dice-bet-option" data-bet="over" onclick="setBet('over')">7⟩</button>
                    </div>
                    <div class="dice-input-group">
                        <input id="betInput" type="number" value="100" min="1" />
                        <button onclick="document.getElementById('betInput').value=Math.floor(balance/2)">½</button>
                        <button onclick="document.getElementById('betInput').value=balance">Max</button>
                    </div>
                    <button class="dice-place-btn" id="placeBtn" onclick="placeBet()">🎲 Сделать ставку</button>
                    <div style="color:#8a9bb5;font-size:10px;margin-top:4px">Ваша ставка</div>
                    <div class="dice-bets" id="betsList">
                        <div class="dice-bet-item"><span>Нет ставок</span><span></span></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- LOBBY -->
        <div class="page" id="pageLobby">
            <div class="lobby-back" onclick="navigateTo('pageHome')">← Назад</div>
            <div class="lobby-title">🎮 1 на 1 Brawl Stars</div>
            
            <div class="lobby-create">
                <input id="lobbyBetInput" type="number" placeholder="Ставка BETCOIN" value="100" min="1" />
                <button id="createLobbyBtn">Создать</button>
            </div>
            <div id="lobbyList" class="lobby-list"></div>
            
            <div id="adminPanel" class="admin-panel hidden">
                <div class="admin-title">👑 Админ панель</div>
                <div class="admin-input-group">
                    <input id="adminInput" type="text" placeholder="TG username" />
                    <button id="addAdminBtn" class="admin-btn-add">+</button>
                    <button id="removeAdminBtn" class="admin-btn-remove">-</button>
                </div>
                <div class="admin-list" id="adminList"></div>
            </div>
        </div>
        
        <!-- NAV -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="navigateTo('pageHome')" data-page="pageHome">
                <span class="icon">🏠</span><span>Главная</span>
            </button>
            <div class="nav-center" onclick="navigateTo('pageLobby')" id="gameBtn">🎮</div>
            <button class="nav-item" onclick="toggleSidebar()">
                <span class="icon">⚙️</span><span>Настройки</span>
            </button>
        </div>
    </div>
    
    <!-- SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" onclick="closeSidebar()">✕</div>
        <div class="sidebar-title">📋 Разделы</div>
        <div class="sidebar-item active" onclick="navigateTo('pageHome');closeSidebar()"><span class="icon">🏠</span>Главная</div>
        <div class="sidebar-item" onclick="navigateTo('pageLobby');closeSidebar()"><span class="icon">🎮</span>1 на 1</div>
        <div class="sidebar-item" onclick="alert('Скоро')"><span class="icon">🏆</span>Рейтинг</div>
    </div>
    
    <!-- PROMO MODAL -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <div class="modal-title">🎁 Введите промокод</div>
            <input class="modal-input" id="promoInput" type="text" placeholder="ВВЕДИТЕ КОД" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closePromo()">Отмена</button>
                <button class="modal-btn modal-btn-primary" id="applyPromoBtn">Активировать</button>
            </div>
        </div>
    </div>
    
    <!-- RESULT MODAL -->
    <div class="result-modal" id="resultModal">
        <div class="result-box">
            <div class="result-icon" id="resIcon">🎉</div>
            <div class="result-title" id="resTitle">Вы выиграли!</div>
            <div class="result-amount" id="resAmount">+0 BetCoin</div>
            <button class="result-btn" id="resultBtn">Продолжить</button>
        </div>
    </div>
    
    <!-- SCREENSHOT MODAL -->
    <div class="modal-overlay" id="screenshotModal">
        <div class="modal">
            <div class="modal-title">📸 Прикрепить скриншот</div>
            <input class="modal-input" id="screenshotInput" type="text" placeholder="Ссылка" />
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closeScreenshot()">Отмена</button>
                <button class="modal-btn modal-btn-primary" id="submitScreenshotBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // ===== TELEGRAM =====
        let tgUser = null;
        try {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                console.log('✅ Telegram:', tgUser);
            }
        } catch(e) {
            console.log('❌ Telegram error:', e);
        }
        if (!tgUser) tgUser = { id: 'demo', first_name: 'Тест', username: 'test' };
        
        const userId = tgUser.id.toString();
        const username = tgUser.first_name || tgUser.username || 'Игрок';
        let balance = 5000;
        let betType = 'under';
        let timerInterval = null;
        let seconds = 12;
        let isRolling = false;
        let currentLobbyId = null;
        
        // ===== DOM =====
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const balanceDisplay = document.getElementById('balanceDisplay');
        
        function updateUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            userName.textContent = username;
            if (tgUser.photo_url) {
                userAvatar.innerHTML = '<img src="' + tgUser.photo_url + '" />';
            } else {
                userAvatar.textContent = username.charAt(0).toUpperCase();
            }
        }
        
        // ===== NAVIGATION =====
        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const navBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (navBtn) navBtn.classList.add('active');
            if (pageId === 'pageLobby') {
                document.getElementById('gameBtn').classList.add('active');
                loadLobbies();
            } else {
                document.getElementById('gameBtn').classList.remove('active');
            }
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
        
        // ===== DICE =====
        function toggleDice() {
            const content = document.getElementById('diceContent');
            const arrow = document.getElementById('diceArrow');
            content.classList.toggle('open');
            arrow.classList.toggle('open');
            if (content.classList.contains('open') && !timerInterval) startTimer();
        }
        
        function setBet(type) {
            betType = type;
            document.querySelectorAll('.dice-bet-option').forEach(b => b.classList.remove('active'));
            document.querySelector(`.dice-bet-option[data-bet="${type}"]`).classList.add('active');
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 12;
            isRolling = false;
            document.getElementById('placeBtn').disabled = false;
            document.getElementById('timerDisplay').textContent = seconds;
            
            timerInterval = setInterval(() => {
                seconds--;
                document.getElementById('timerDisplay').textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    rollDice();
                }
            }, 1000);
        }
        
        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('placeBtn').disabled = true;
            document.querySelector('.dice-timer').innerHTML = '🎲 Бросок...';
            
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const result = d1 + d2;
            const dots = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            
            document.getElementById('dice1').textContent = dots[d1-1];
            document.getElementById('dice2').textContent = dots[d2-1];
            document.getElementById('dice1').classList.add('rolling');
            document.getElementById('dice2').classList.add('rolling');
            
            setTimeout(() => {
                document.getElementById('dice1').classList.remove('rolling');
                document.getElementById('dice2').classList.remove('rolling');
            }, 800);
            
            document.getElementById('diceResult').textContent = `Результат: ${result} (${d1}+${d2})`;
            
            // Обработка выигрыша
            let win = false;
            let coeff = 0;
            if (betType === 'under') { win = result < 7; coeff = 2; }
            else if (betType === 'over') { win = result > 7; coeff = 2; }
            else if (betType === 'seven') { win = result === 7; coeff = 5; }
            
            const betAmount = parseInt(document.getElementById('betInput').value) || 0;
            if (win && betAmount > 0) {
                const winAmount = betAmount * coeff;
                balance += winAmount;
                updateUI();
                document.getElementById('diceResult').textContent += ` 🎉 Выигрыш +${winAmount}!`;
            } else if (betAmount > 0) {
                document.getElementById('diceResult').textContent += ` ❌ Проигрыш -${betAmount}`;
            }
            
            setTimeout(() => {
                isRolling = false;
                document.querySelector('.dice-timer').innerHTML = '⏳ Раунд: <span id="timerDisplay">12</span>s';
                document.getElementById('diceResult').textContent = 'Результат: ?';
                startTimer();
                loadBets();
            }, 5000);
        }
        
        function placeBet() {
            if (isRolling) { alert('⏳ Раунд идет!'); return; }
            if (seconds < 3) { alert('⏳ Раунд скоро закончится!'); return; }
            
            const amount = parseInt(document.getElementById('betInput').value);
            if (!amount || amount <= 0) { alert('❌ Введите сумму!'); return; }
            if (amount > balance) { alert('❌ Недостаточно средств!'); return; }
            
            balance -= amount;
            updateUI();
            loadBets();
            alert('✅ Ставка принята!');
        }
        
        function loadBets() {
            const container = document.getElementById('betsList');
            container.innerHTML = `<div class="dice-bet-item">
                <span>${username} • ${document.getElementById('betInput').value || 0} ${betType === 'under' ? '⟨7' : betType === 'over' ? '7⟩' : '=7'}</span>
                <span class="pending">⏳ Ожидание</span>
            </div>`;
        }
        
        // ===== LOBBY =====
        function openLobby() {
            navigateTo('pageLobby');
        }
        
        function createLobby() {
            const bet = parseInt(document.getElementById('lobbyBetInput').value);
            if (!bet || bet <= 0) { alert('❌ Введите ставку!'); return; }
            if (bet > balance) { alert('❌ Недостаточно средств!'); return; }
            
            balance -= bet;
            updateUI();
            
            const list = document.getElementById('lobbyList');
            const lobbyId = 'lobby_' + Date.now();
            list.innerHTML += `
                <div class="lobby-item" id="${lobbyId}">
                    <div class="top">
                        <span class="name">${username} ⏳</span>
                        <span class="bet">${bet} BETCOIN</span>
                    </div>
                    <div class="status">Статус: waiting</div>
                    <div class="actions">
                        <button class="join" onclick="alert('Игрок присоединился!')">Присоединиться</button>
                        <button class="delete" onclick="this.parentElement.parentElement.remove()">Удалить</button>
                    </div>
                </div>
            `;
            alert('✅ Лобби создано!');
        }
        
        function loadLobbies() {
            // Заглушка - лобби хранятся локально
        }
        
        // ===== PROMO =====
        function openPromo() { document.getElementById('promoModal').classList.add('active'); }
        function closePromo() { document.getElementById('promoModal').classList.remove('active'); }
        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            if (!code) { alert('❌ Введите код!'); return; }
            if (code === 'BETCOIN') {
                balance += 10000;
                updateUI();
                alert('🎉 +10000 BetCoin!');
                closePromo();
            } else { alert('❌ Неверный код!'); }
        }
        
        function closeResult() { document.getElementById('resultModal').classList.remove('active'); }
        function openScreenshot() { document.getElementById('screenshotModal').classList.add('active'); }
        function closeScreenshot() { document.getElementById('screenshotModal').classList.remove('active'); }
        function submitScreenshot() {
            const url = document.getElementById('screenshotInput').value.trim();
            if (!url) { alert('❌ Введите ссылку!'); return; }
            alert('✅ Скриншот прикреплен!');
            closeScreenshot();
        }
        
        // ===== ADMIN =====
        function addAdmin() {
            const input = document.getElementById('adminInput');
            const name = input.value.trim();
            if (!name) { alert('❌ Введите username!'); return; }
            const list = document.getElementById('adminList');
            list.innerHTML += `<div class="admin-item"><span>${name}</span><button onclick="this.parentElement.remove()">✕</button></div>`;
            input.value = '';
        }
        
        function removeAdmin() {
            const input = document.getElementById('adminInput');
            const name = input.value.trim();
            if (!name) { alert('❌ Введите username!'); return; }
            const items = document.querySelectorAll('.admin-item');
            for (let item of items) {
                if (item.textContent.includes(name)) {
                    item.remove();
                    break;
                }
            }
            input.value = '';
        }
        
        // ===== BUTTONS =====
        document.getElementById('getBtn').onclick = function() {
            balance += 500;
            updateUI();
            alert('✅ +500 BetCoin!');
        };
        
        document.getElementById('buyBtn').onclick = function() {
            const amount = prompt('💰 Сумма:', '1000');
            if (amount) {
                const c = parseInt(amount);
                if (c > 0) {
                    balance += c;
                    updateUI();
                    alert('✅ +' + c + ' BetCoin!');
                }
            }
        };
        
        document.getElementById('createLobbyBtn').onclick = createLobby;
        document.getElementById('addAdminBtn').onclick = addAdmin;
        document.getElementById('removeAdminBtn').onclick = removeAdmin;
        document.getElementById('applyPromoBtn').onclick = applyPromo;
        document.getElementById('resultBtn').onclick = closeResult;
        document.getElementById('submitScreenshotBtn').onclick = submitScreenshot;
        
        // ===== INIT =====
        updateUI();
        console.log('🚀 BetGame loaded!');
        console.log('👤 User:', tgUser);
        
        window.navigateTo = navigateTo;
        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        window.toggleDice = toggleDice;
        window.setBet = setBet;
        window.placeBet = placeBet;
        window.openLobby = openLobby;
        window.createLobby = createLobby;
        window.openPromo = openPromo;
        window.closePromo = closePromo;
        window.applyPromo = applyPromo;
        window.closeResult = closeResult;
        window.openScreenshot = openScreenshot;
        window.closeScreenshot = closeScreenshot;
        window.submitScreenshot = submitScreenshot;
        window.addAdmin = addAdmin;
        window.removeAdmin = removeAdmin;
    </script>
</body>
</html>
